## 22.1 Garis tren dengan JavaScript murni

**Regresi linear sederhana** mencari garis lurus `y = a + b × x` yang paling dekat dengan semua titik data. `b` adalah **kemiringan** (berapa `y` bertambah setiap `x` naik satu), dan `a` adalah **titik potong** (nilai `y` saat `x` nol).

Rumusnya bisa ditulis dengan JavaScript yang sudah kamu kuasai:

```slak
function regresi(x, y) {
  const n = x.length
  const rx = x.reduce((a, v) => a + v, 0) / n
  const ry = y.reduce((a, v) => a + v, 0) / n
  let atas = 0, bawah = 0
  for (let i = 0; i < n; i++) {
    atas += (x[i] - rx) * (y[i] - ry)
    bawah += (x[i] - rx) ** 2
  }
  const b = atas / bawah
  return { a: ry - b * rx, b }
}

const df = await sl.read_csv("toko-nusantara.csv")
const bulanan = df.resample("tanggal", "M").agg({ omzet: ["total", "sum"] }).to_records()
const x = bulanan.map((_, i) => i + 1)          // bulan ke-1, ke-2, ...
const y = bulanan.map(r => r.omzet)

const { a, b } = regresi(x, y)
sl.write(`Garis tren: omzet = ${Math.round(a).toLocaleString("id-ID")} + ${Math.round(b).toLocaleString("id-ID")} × bulan`)
sl.write(`Artinya omzet cenderung naik sekitar Rp ${Math.round(b).toLocaleString("id-ID")} setiap bulan.`)
```

Ini disebut metode **kuadrat terkecil**: garis yang dipilih adalah garis dengan jumlah kuadrat jarak titik ke garis paling kecil.

## 22.2 Regresi dengan Slak Data

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const b = df.resample("tanggal", "M").agg({ omzet: ["total", "sum"] })
const data = b.assign({ bulan_ke: () => sl.Series(b.omzet.to_list().map((_, i) => i + 1)) })

const lr = sl.stats.linregress(data.bulan_ke, data.omzet)
sl.write(`Kemiringan: ${Math.round(lr.slope).toLocaleString("id-ID")} per bulan`)
sl.write(`R²: ${lr.rsquared.toLocaleString("id-ID", { maximumFractionDigits: 2 })}, p-value: ${lr.pvalue.toLocaleString("id-ID", { maximumFractionDigits: 4 })}`)
sl.scatter_chart(data, { x: "bulan_ke", y: "omzet", trendline: true, format: "compact" })
```

Angkanya sama dengan hasil fungsi buatanmu. Dua angka baru:

- **R²** (0 sampai 1) mengukur berapa bagian naik-turunnya omzet yang dijelaskan garis tren. R² 0,33 artinya garis lurus menjelaskan sekitar sepertiganya; sisanya karena musim dan hal lain.
- **p-value** di bawah 0,05 artinya kecenderungan naik itu nyata, bukan kebetulan.

Untuk **beberapa** variabel penjelas sekaligus, pakai `sl.stats.ols` dengan rumus gaya statsmodels:

```slak
const model = sl.stats.ols(sl.dataset("karyawan"), "gaji_juta ~ pengalaman_tahun + C(pendidikan)")
sl.write(model)
```

`C(pendidikan)` memberi tahu bahwa `pendidikan` adalah kategori. Tabel koefisien menjawab: dengan pendidikan yang sama, setiap tahun pengalaman menambah gaji sekian juta.

> **API Slak baru**
> - `sl.stats.linregress(x, y)` menghasilkan `slope`, `intercept`, `rvalue`, `rsquared`, dan `pvalue`.
> - `sl.stats.ols(df, "y ~ x1 + x2 + C(kategori)")` membuat regresi berganda lengkap dengan tabel koefisien, R², dan diagnostik.

## 22.3 Meramal penjualan

Garis lurus mengabaikan musim. Untuk meramal, Slak menyediakan `sl.ts.forecast`, yang mencoba beberapa metode (termasuk **Holt-Winters**, yang memperhitungkan tren dan musim sekaligus) lalu memilih yang paling cocok dengan data.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const bulanan = df.resample("tanggal", "M").agg({ omzet: ["total", "sum"] })
const n = sl.slider("Ramal berapa bulan ke depan?", 3, 12, 6)
const ramalan = sl.ts.forecast(bulanan, { periods: n })
sl.write(ramalan)
```

Hasilnya mencakup grafik, tabel ramalan, dan ukuran kesalahan. Yang terpenting adalah **batas bawah dan batas atas**: rentang yang kemungkinan besar (sekitar 95%) memuat nilai sebenarnya.

> **Ramalan bukan janji.** Selalu laporkan rentangnya, bukan hanya satu angka. "Omzet Januari diperkirakan 10–18 juta, paling mungkin 14 juta" jauh lebih jujur daripada "omzet Januari 14 juta". Dua tahun data juga terbilang pendek untuk meramal musim; semakin panjang datanya, semakin bisa diandalkan ramalannya.

| Ukuran | Arti |
|---|---|
| MAE | Rata-rata selisih ramalan dengan kenyataan, dalam rupiah |
| RMSE | Mirip MAE, tetapi menghukum selisih besar lebih berat |
| MAPE | Rata-rata selisih dalam persen |

> **API Slak baru**
> - `sl.ts.forecast(df, { periods, method })` meramal deret waktu. Hasilnya bisa ditampilkan dengan `sl.write`, dan tabelnya ada di `.forecast` (kolom `prediksi`, `batas_bawah`, `batas_atas`).

## 22.4 Analisis bisnis siap pakai

Beberapa analisis begitu sering diminta sehingga Slak menyediakannya dalam satu perintah.

### Pareto: produk mana yang paling penting?

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const par = sl.analysis.pareto(df, { category: "produk", value: "total" })
sl.combo_chart(par, { x: "produk", bar: "total", line: "persen_kumulatif" })
const a = par.filter(r => r.kelas === "A")
sl.write(`${a.shape[0]} dari ${par.shape[0]} produk (kelas A) bersama-sama menyumbang sekitar 80% omzet.`)
```

Analisis Pareto mengurutkan produk dari omzet terbesar dan menjumlahkan porsinya. Produk yang bersama-sama mencapai 80% omzet masuk kelas **A**: wajib selalu tersedia di rak. Di banyak toko, kelas A hanya sekitar 20% produk (inilah "aturan 80/20"). Di Toko Nusantara omzetnya lebih merata, sehingga kelas A lebih banyak; temuan seperti ini pun berharga, karena artinya toko tidak bergantung pada segelintir produk.

### RFM: mengenal pelanggan

**RFM** menilai setiap pelanggan dari tiga sisi: **R**ecency (kapan terakhir belanja), **F**requency (seberapa sering), dan **M**onetary (berapa banyak). Pelanggan lalu dikelompokkan ke segmen berbahasa Indonesia seperti *Juara*, *Pelanggan Setia*, *Berisiko*, dan *Tertidur*.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const rfm = sl.analysis.rfm(df, { customer: "pelanggan_id", date: "tanggal", amount: "total" })
sl.bar_chart(rfm.value_counts("segmen"), { x: "segmen", y: "jumlah", horizontal: true, sort: true })
sl.dataframe(rfm.sort_values("skor_rfm", { ascending: false }).head(5))
```

Segmen *Berisiko* dan *Jangan Sampai Hilang* adalah pelanggan bernilai tinggi yang lama tidak datang: sasaran utama untuk ditawari promo.

### Kohort dan funnel

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const ko = sl.analysis.cohort(df, { customer: "pelanggan_id", date: "tanggal", period: "Q" })
sl.heatmap(ko.drop("ukuran"), { format: "percent:0", title: "Berapa persen pelanggan kembali di kuartal berikutnya?" })

sl.dataframe(sl.analysis.funnel({ "Lihat produk": 10000, "Masuk keranjang": 1200, "Bayar": 300 }), { format: { konversi_dari_awal: "percent", konversi_dari_sebelumnya: "percent" } })
```

**Kohort** mengelompokkan pelanggan menurut kapan mereka pertama datang, lalu melacak berapa persen yang kembali. **Funnel** menghitung berapa yang lolos di setiap tahap, sehingga tahap yang paling banyak "bocor" terlihat.

> **API Slak baru**
> - `sl.analysis.pareto(df, { category, value })`, `sl.analysis.rfm(df, { customer, date, amount })`, `sl.analysis.cohort(df, { customer, date, period })`, `sl.analysis.funnel(tahap)`.
> - `sl.combo_chart(df, { x, bar, line })` menggambar batang dan garis sekaligus.

## 22.5 Machine learning: belajar dari contoh

**Machine learning** adalah cara membuat program yang belajar aturan sendiri dari contoh-contoh, bukan dari aturan yang kita tulis dengan `if`. Ada tiga jenis tugas yang paling sering:

| Tugas | Pertanyaan | Contoh |
|---|---|---|
| **Regresi** | Berapa nilainya? | Berapa gaji yang wajar untuk pengalaman 5 tahun? |
| **Klasifikasi** | Masuk kelompok mana? | Apakah pelanggan ini akan berhenti berlangganan? |
| **Pengelompokan** (klaster) | Kelompok apa saja yang ada? | Pelanggan kita terbagi ke tipe apa saja? |

### Data latih dan data uji

Aturan emas machine learning: **jangan menilai model dengan data yang dipakai untuk melatihnya.** Itu seperti murid yang dinilai dengan soal latihan yang sudah ia hafal. Bagi datanya dua: sebagian untuk **latih**, sebagian lagi disimpan untuk **uji**.

```slak
const kar = sl.dataset("karyawan")
const [latih, uji] = sl.ml.train_test_split(kar, { test_size: 0.25, random_state: 7 })
sl.write(`${latih.shape[0]} baris latih, ${uji.shape[0]} baris uji`)

const model = sl.ml.LinearRegression().fit(latih.select(["pengalaman_tahun", "jam_pelatihan", "gaji_juta"]), "gaji_juta")
const tebakan = model.predict(uji.select(["pengalaman_tahun", "jam_pelatihan"]))

const [a, b] = sl.columns(2)
a.metric("R² pada data uji", Math.round(sl.ml.r2_score(uji.gaji_juta, tebakan) * 100) / 100)
b.metric("Rata-rata meleset", `${sl.ml.mae(uji.gaji_juta, tebakan).toLocaleString("id-ID", { maximumFractionDigits: 1 })} juta`)
```

Alurnya selalu sama, apa pun modelnya: **bagi → latih (`fit`) → tebak (`predict`) → ukur**. Nama-namanya sengaja dibuat sama dengan scikit-learn, pustaka machine learning paling terkenal di Python.

### Klasifikasi: siapa yang akan berhenti?

Dataset bawaan `pelanggan` berisi 1.000 pelanggan layanan internet fiktif dan kolom `churn` (1 = berhenti berlangganan).

```slak
const data = sl.dataset("pelanggan").drop("pelanggan_id")
const [latih, uji] = sl.ml.train_test_split(data, { test_size: 0.25, stratify: "churn", random_state: 42 })

const pohon = sl.ml.DecisionTreeClassifier({ max_depth: 4 }).fit(latih, "churn")
const tebak = pohon.predict(uji.drop("churn"))

sl.metric("Akurasi pada data uji", sl.ml.accuracy_score(uji.churn, tebak), null, { format: "percent" })
sl.dataframe(sl.ml.confusion_matrix(uji.churn, tebak))
sl.code(pohon.rules())
```

- **Akurasi** adalah persentase tebakan yang benar.
- **Matriks kebingungan** (*confusion matrix*) memperlihatkan jenis kesalahannya: berapa pelanggan yang sebenarnya berhenti tetapi ditebak bertahan, dan sebaliknya. Untuk churn, kesalahan jenis pertama biasanya lebih mahal.
- **Pohon keputusan** bisa dibaca sebagai aturan "jika … maka …" lewat `rules()`. Ini sangat berguna untuk menjelaskan model kepada orang bisnis.

### Pengelompokan: tipe-tipe pelanggan

**KMeans** membagi data ke `k` kelompok sehingga anggota satu kelompok saling mirip. Tidak ada jawaban benar yang diberikan; model menemukan kelompoknya sendiri.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const pel = df.groupby("pelanggan_id").agg({ transaksi: ["id_transaksi", "nunique"], belanja: ["total", "sum"] })

const X = sl.ml.StandardScaler().fit_transform(pel.select(["transaksi", "belanja"]))
const km = sl.ml.KMeans({ n_clusters: 3, random_state: 1 }).fit(X)
const dikelompokkan = pel.assign({ klaster: () => km.predict(X) })

const profil = dikelompokkan.groupby("klaster").agg({
  pelanggan: ["pelanggan_id", "size"], rata_transaksi: ["transaksi", "mean"], rata_belanja: ["belanja", "mean"]
}).sort_values("rata_belanja")
sl.dataframe(profil, { format: { rata_transaksi: "decimal:1", rata_belanja: "rupiah" } })
sl.scatter_chart(dikelompokkan.assign({ klaster: r => `Kelompok ${r.klaster}` }), { x: "transaksi", y: "belanja", color: "klaster", format: "compact" })
```

`StandardScaler` menyamakan skala kolom lebih dulu. Tanpanya, kolom `belanja` (jutaan) akan mendominasi kolom `transaksi` (satuan), dan pengelompokan hanya melihat belanja.

Hasilnya biasanya tiga tipe yang mudah diberi nama: **pembeli sesekali** (sebagian besar), **pelanggan tetap**, dan **pelanggan setia** yang sedikit jumlahnya tetapi besar belanjanya.

> **API Slak baru**
> - `sl.ml.train_test_split(df, { test_size, stratify, random_state })` membagi data latih dan uji.
> - Model: `sl.ml.LinearRegression()`, `sl.ml.DecisionTreeClassifier({ max_depth })`, `sl.ml.KMeans({ n_clusters })`, dan lainnya. Semuanya memakai `.fit(df, "target")` dan `.predict(df)`.
> - Ukuran: `sl.ml.accuracy_score`, `sl.ml.confusion_matrix`, `sl.ml.r2_score`, `sl.ml.mae`, `sl.ml.rmse`.
> - `sl.ml.StandardScaler().fit_transform(df)` menyamakan skala kolom.

## 22.6 Demo model untuk orang lain

Model yang hanya kamu pahami sendiri belum berguna. `sl.ml_demo` membuat formulir interaktif: setiap kolom mendapat widget yang sesuai, dan tebakan model tampil seketika.

```slak
sl.ml_demo(
  sl.ml.DecisionTreeClassifier({ max_depth: 4 }),
  sl.dataset("pelanggan").drop("pelanggan_id"),
  { target: "churn", labels: { 0: "Bertahan", 1: "Berhenti" } }
)
```

Ubah jumlah keluhan atau lama berlangganan, lalu perhatikan tebakan dan keyakinan model berubah. Bagian "Fitur mana yang paling berpengaruh?" menunjukkan apa yang paling diperhatikan model.

> **API Slak baru**
> - `sl.ml_demo(model, df, { target, labels })` membuat formulir coba model. Model yang belum dilatih dilatih otomatis.

Hasil model Slak sudah dicocokkan dengan scikit-learn. Untuk model yang lebih rumit, seperti gradient boosting atau deep learning, analis biasanya beralih ke Python (Bab 26).

> **Coba di playground**
> Di contoh klasifikasi, ganti `max_depth: 4` menjadi `max_depth: 2` lalu `max_depth: 12`. Apa yang terjadi pada akurasi data uji? Pohon yang terlalu dalam menghafal data latih, sehingga justru buruk pada data baru. Gejala ini disebut *overfitting*.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Akurasi 100% | Dinilai dengan data latih, atau target ikut sebagai fitur | Nilai dengan data uji; buang kolom target dari fitur |
| Akurasi tinggi, tetapi semua ditebak "bertahan" | Kelas tidak seimbang | Lihat matriks kebingungan, bukan akurasi saja |
| Ramalan meyakinkan padahal datanya sedikit | Satu angka tanpa rentang | Laporkan batas bawah dan atas |
| Klaster hanya mengikuti satu kolom | Skala kolom berbeda jauh | Pakai `StandardScaler` |
| Galat nilai kosong saat `fit` | Model butuh data lengkap | `dropna` atau `fillna` dulu |

## Latihan

**Latihan 22.1 (mudah).** Pakai fungsi `regresi` buatanmu untuk data kecil di bawah. Hasil `b` (kemiringan) harus 2 dan `a` harus 1.

```slak latihan
function regresi(x, y) {
  // salin dan lengkapi dari 22.1
  return { a: 0, b: 0 }
}

const hasil = regresi([1, 2, 3, 4], [3, 5, 7, 9])
await sl.testing.test("kemiringan 2", () => sl.testing.expect(hasil.b).toBeCloseTo(2, 6))
await sl.testing.test("titik potong 1", () => sl.testing.expect(hasil.a).toBeCloseTo(1, 6))

**Latihan 22.2 (sedang).** Hitung `porsiBerisiko`: proporsi pelanggan Toko Nusantara yang masuk segmen RFM "Berisiko" atau "Jangan Sampai Hilang".

```slak latihan
const df = await sl.read_csv("toko-nusantara.csv")
const porsiBerisiko = 0   // ganti

sl.metric("Pelanggan berisiko", (porsiBerisiko * 100).toFixed(1) + "%")
const rfm = sl.analysis.rfm(df, { customer: "pelanggan_id", date: "tanggal", amount: "total" })
await sl.testing.test("porsi benar", () => sl.testing.expect(porsiBerisiko).toBeCloseTo(
  rfm.filter(r => ["Berisiko", "Jangan Sampai Hilang"].includes(r.segmen)).shape[0] / rfm.shape[0], 6))

**Latihan 22.3 (tantangan).** Latih `RandomForestClassifier` untuk memprediksi churn, lalu simpan akurasinya pada data uji di `akurasi`. Akurasinya harus lebih baik daripada menebak "bertahan" untuk semua orang.

```slak latihan
const data = sl.dataset("pelanggan").drop("pelanggan_id")
const [latih, uji] = sl.ml.train_test_split(data, { test_size: 0.25, stratify: "churn", random_state: 42 })
const akurasi = 0   // ganti

sl.metric("Akurasi", (akurasi * 100).toFixed(1) + "%")
const tebakBertahan = uji.churn.to_list().filter(v => v === 0).length / uji.shape[0]

## Mini-proyek: prakiraan dan segmen pelanggan

sl.title("Prakiraan dan Pelanggan Toko Nusantara :crystal_ball:")

# Bab 23 · Peta dan Data Wilayah

> **Tujuan belajar**
> - Mengenal data berbasis lokasi: kota, provinsi, dan koordinat.
> - Menggambar peta titik, peta gelembung, dan rute.
> - Membuat peta warna wilayah (choropleth) untuk 38 provinsi dan 514 kabupaten/kota, tanpa internet.
> - Mencocokkan nama wilayah yang ditulis berbeda-beda, dan menghitung jarak antartitik.

Indonesia membentang lebih dari 5.000 km dari Sabang sampai Merauke. Bagi Toko Nusantara yang cabangnya tersebar dari Jakarta sampai Jayapura, peta bukan hiasan: peta memperlihatkan pola yang tidak terlihat di tabel.

## 23.1 Memasang peta

Peta ada di berkas tambahan:

```html
<script src="slak.js"><\/script>
<script src="slak-data.js"><\/script>
<script src="slak-peta.js"><\/script>      <!-- batas 38 provinsi dan titik 514 kab/kota -->
<script src="slak-peta-kab.js"><\/script>  <!-- batas poligon kab/kota (opsional) -->
```

Batas 38 provinsi, termasuk pemekaran Papua tahun 2022, sudah ada di dalam `slak-peta.js`. Peta bekerja **tanpa internet**. Playground, Slak Studio, dan halaman buku ini sudah memuatnya.

## 23.2 Tiga cara menyebut lokasi

| Cara | Contoh | Ketelitian |
|---|---|---|
| Koordinat | `lat: -2.5337, lon: 140.7181` | Paling tepat |
| Nama kota atau kabupaten | `"Jayapura"`, `"Kab. Mimika"` | Titik tengah wilayah |
| Nama provinsi | `"Papua Barat Daya"` | Untuk peta warna wilayah |

**Lintang** (*latitude*, `lat`) adalah posisi utara-selatan: negatif di selatan khatulistiwa. **Bujur** (*longitude*, `lon`) adalah posisi barat-timur: Indonesia berada sekitar 95 sampai 141 derajat bujur timur.

## 23.3 Peta titik dan gelembung

`cabang.csv` menyimpan koordinat setiap cabang. Gabungkan dengan omzet (Bab 18), lalu gambar:

```slak
const [trx, cabang] = await Promise.all([sl.read_csv("toko-nusantara.csv"), sl.read_csv("cabang.csv")])
const perCabang = trx.groupby("cabang").agg({ omzet: ["total", "sum"] }).merge(cabang, { on: "cabang" })

sl.map(perCabang, { lat: "lat", lon: "lon", size: "omzet", label: "kota" })
```

Ukuran gelembung sebanding dengan omzet. Arahkan kursor ke gelembung untuk melihat nilainya; gulir atau tekan **+** dan **−** untuk memperbesar.

Bila datamu tidak punya koordinat, sebut saja nama wilayahnya:

```slak
const trx = await sl.read_csv("toko-nusantara.csv")
const perKota = trx.groupby("kota").agg({ omzet: ["total", "sum"], transaksi: ["id_transaksi", "nunique"] })
sl.map(perKota, { region: "kota", size: "omzet", color: "transaksi", label: "kota" })
```

Slak mencari titik tengah setiap kota dari daftar 514 kabupaten/kota yang dibawanya.

Perhatikan catatan di bawah peta: **1 wilayah tidak dikenali: Jakarta**. Bukan salah Slak. Jakarta adalah provinsi yang terdiri dari lima kota administrasi (Jakarta Pusat, Jakarta Utara, dan seterusnya), jadi "Jakarta" tidak bisa dicocokkan dengan satu kota. Perbaikannya: tulis nama kotanya, misalnya "Jakarta Pusat", atau pakai koordinat seperti contoh sebelumnya. Inilah alasan analis lebih suka menyimpan koordinat atau kode wilayah daripada nama.

> **API Slak baru**
> - `sl.map(df, { lat, lon, size, color, label })` menggambar titik atau gelembung.
> - `sl.map(df, { region: "kolom" })` mencari lokasi dari nama wilayah.
> - Opsi lain: `heatmap: true` (peta kepadatan), `cluster: true` (titik yang berdekatan dikumpulkan), `route: { arrows: true }` (garis sesuai urutan baris), `tiles: "osm"` (latar OpenStreetMap, **butuh internet**).

## 23.4 Rute

Bayangkan rute pengiriman barang dari gudang di Surabaya ke cabang-cabang di timur. Baris data digambar berurutan sebagai garis:

```slak
const cabang = await sl.read_csv("cabang.csv")
const urutan = ["Surabaya", "Denpasar", "Kupang", "Makassar", "Ambon", "Sorong", "Manokwari", "Jayapura"]
const rute = urutan.map(k => cabang.filter(r => r.kota === k).to_records()[0])
sl.map(rute, { lat: "lat", lon: "lon", label: "kota", route: { arrows: true } })
```

## 23.5 Peta warna wilayah (choropleth)

**Choropleth** mewarnai setiap wilayah sesuai nilainya. Cocok untuk membandingkan provinsi.

```slak
const trx = await sl.read_csv("toko-nusantara.csv")
const perProvinsi = trx.groupby("provinsi").agg({ omzet: ["total", "sum"] })
sl.choropleth(perProvinsi, { region: "provinsi", value: "omzet", labels: true, title: "Omzet per provinsi, 2023–2024" })
```

Provinsi tanpa cabang tampil abu-abu. Peta seperti ini langsung menjawab pertanyaan strategis: provinsi mana yang belum terjangkau?

Untuk tingkat kabupaten/kota, tambahkan `level: "kabkota"`. Batas poligonnya dimuat otomatis dari `slak-peta-kab.js`:

```slak
const contoh = sl.DataFrame([
  { wilayah: "Kota Jayapura", pelanggan: 88 }, { wilayah: "Kab. Jayapura", pelanggan: 31 },
  { wilayah: "Kab. Keerom", pelanggan: 12 }, { wilayah: "Kab. Sarmi", pelanggan: 6 }
])
sl.choropleth(contoh, { region: "wilayah", value: "pelanggan", level: "kabkota", labels: true })
```

> **API Slak baru**
> - `sl.choropleth(df, { region, value, labels, level, bins })` mewarnai wilayah. `level: "kabkota"` untuk kabupaten/kota.

> **Peta dan kejujuran.** Wilayah yang luas, seperti provinsi-provinsi di Papua, tampak dominan di peta walau penduduknya sedikit. Untuk data seperti omzet atau jumlah pelanggan, pertimbangkan nilai **per penduduk** atau tampilkan juga grafik batang di sampingnya.

## 23.6 Nama wilayah yang berantakan

Nama wilayah di data nyata jarang seragam: "Jaypura", "Kab. Mimika", "Timika", "Jabar". Slak mengenalinya dengan toleran: singkatan, awalan (Prov., Kab., Kota), nama lama, ibu kota kabupaten, dan salah ketik ringan.

```slak
for (const nama of ["Jaypura", "Timika", "Jabar", "Kota Sorong", "Manokwari"]) {
  const m = sl.geo.match(nama)
  sl.write(`${nama} → ${m ? `${m.nama} (${m.provinsi || "provinsi"})` : "tidak dikenali"}`)
}
```

Perhatikan "Timika" dikenali sebagai Kabupaten Mimika (Timika adalah ibu kotanya), dan "Manokwari" sebagai Kabupaten Manokwari. Selalu periksa hasil pencocokan untuk nama yang bisa berarti dua wilayah, misalnya kota dan kabupaten bernama sama. Wilayah yang tidak dikenali dilaporkan di bawah peta.

Untuk satu kolom sekaligus, `sl.geo.geocode` menambahkan nama baku dan koordinatnya:

```slak
const alamat = sl.DataFrame([{ kota: "Manokwari" }, { kota: "Ambon" }, { kota: "Kupang" }])
sl.dataframe(sl.geo.geocode(alamat, "kota"))
```

## 23.7 Jarak

```slak
const cabang = (await sl.read_csv("cabang.csv")).to_records()
const jyp = cabang.find(c => c.kota === "Jayapura")
const jarak = cabang
  .filter(c => c.kota !== "Jayapura")
  .map(c => ({ kota: c.kota, km: Math.round(sl.geo.distance([jyp.lat, jyp.lon], [c.lat, c.lon])) }))
  .sort((a, b) => a.km - b.km)
sl.bar_chart(jarak, { x: "kota", y: "km", horizontal: true, labels: true, title: "Jarak garis lurus dari Jayapura (km)" })
```

`sl.geo.distance` menghitung jarak garis lurus di permukaan bumi (rumus *haversine*), bukan jarak tempuh jalan atau laut.

> **API Slak baru**
> - `sl.geo.match(nama)` mencocokkan satu nama wilayah dan mengembalikan nama baku, provinsi, dan koordinatnya.
> - `sl.geo.geocode(df, kolom)` menambah kolom `wilayah_baku`, `lat`, dan `lon`.
> - `sl.geo.distance([lat1, lon1], [lat2, lon2])` menghitung jarak dalam km.
> - `sl.geo.province_of(lat, lon)` dan `sl.geo.kabkota_of(lat, lon)` menebak wilayah dari koordinat.

### Peta tiga dimensi

Untuk peta data besar dan tampilan tiga dimensi, Slak menyediakan `sl.pydeck_chart`, yang memakai pustaka deck.gl dengan spesifikasi yang sama seperti pydeck di Python. Pustakanya diunduh saat dipakai, jadi fitur ini **butuh internet**.

> **Coba di playground**
> Di contoh 23.3, tambahkan `tiles: "osm"` ke opsi peta (butuh internet). Bandingkan dengan peta luring bawaan.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Titik muncul di laut atau di luar negeri | `lat` dan `lon` tertukar | Lintang Indonesia sekitar −11 sampai 6, bujur 95 sampai 141 |
| Ada wilayah tidak dikenali di bawah peta | Ejaan terlalu jauh dari nama baku | Perbaiki dengan kamus (Bab 13) atau `sl.geo.match` |
| Peta kosong | `slak-peta.js` belum dimuat | Tambahkan `<script src="slak-peta.js">` |
| Provinsi baru Papua tidak berwarna | Data memakai nama sebelum 2022 | Pakai nama 38 provinsi terbaru, misalnya Papua Barat Daya |

## Mini-proyek: peta penjualan Toko Nusantara

```slak

# Bab 24 · Merapikan dan Menguji Kode

> **Tujuan belajar**
> - Memahami mengapa satu berkas besar menyulitkan, dan cara merapikannya.
> - Memisahkan fungsi pembersihan, analisis, dan tampilan.
> - Memakai berkas JavaScript tambahan, dan mengenal `import`/`export` ES Modules, tanpa build.
> - Membuat class sederhana untuk membungkus logika yang dipakai ulang.
> - Menguji aplikasi dengan `sl.testing` supaya angka laporan tetap benar setiap kali kode diubah.
> - Menulis komentar dan nama yang membantu dirimu sendiri enam bulan lagi.

Laporan di Bab 17 sekitar 50 baris. Dasbor di Bab 25 akan jauh lebih panjang. Kode yang panjang tanpa susunan seperti gudang tanpa rak: semuanya ada, tetapi tidak ada yang bisa ditemukan. Bab ini tentang menyusun rak.

## 24.1 Tanda-tanda kode perlu dirapikan

- Kamu menyalin-tempel potongan kode yang sama di dua tempat.
- Kamu takut mengubah satu baris karena tidak tahu apa lagi yang ikut rusak.
- Kamu harus menggulir jauh untuk menemukan sesuatu.
- Nama variabel seperti `x2`, `data3`, atau `tmp` bertebaran.

Obatnya satu prinsip: **satu bagian, satu tugas.** Pisahkan kode yang **menyiapkan data**, yang **menghitung**, dan yang **menampilkan**.

## 24.2 Rapi di dalam satu berkas

Langkah pertama tidak butuh berkas baru. Kelompokkan fungsi ke dalam objek bernama, sehingga jelas fungsi mana untuk apa:

```slak
// ---------- Data ----------
const Data = {
  async muat() {
    const df = await sl.read_csv("toko-nusantara.csv")
    return df.assign({ tahun: () => df.tanggal.dt.year })
  }
}

// ---------- Analisis ----------
const Analisis = {
  ringkas(df) {
    return { omzet: df.total.sum(), transaksi: df.shape[0], pelanggan: df.pelanggan_id.nunique() }
  },
  perKategori(df) {
    return df.groupby("kategori").agg({ omzet: ["total", "sum"] }).sort_values("omzet", { ascending: false })
  }
}

// ---------- Tampilan ----------
const Tampilan = {
  kartu(ring) {
    const [a, b, c] = sl.columns(3)
    a.metric("Omzet", ring.omzet, null, { format: "rp" })
    b.metric("Transaksi", ring.transaksi)
    c.metric("Pelanggan", ring.pelanggan)
  }
}

// ---------- Aplikasi ----------
const df = await Data.muat()
const tahun = sl.segmented_control("Tahun", [2023, 2024], { default: 2024 })
const terpilih = df.filter(r => r.tahun === tahun)
Tampilan.kartu(Analisis.ringkas(terpilih))
sl.bar_chart(Analisis.perKategori(terpilih), { x: "kategori", y: "omzet", format: "compact" })
```

Bagian **Aplikasi** di bawah kini hanya lima baris dan bisa dibaca seperti kalimat. Kalau angka omzet salah, kamu tahu harus mencari di `Analisis`. Kalau tampilan kartu kurang bagus, cari di `Tampilan`.

Di Slak Studio, ganti garis pemisah `// ----------` dengan `// %% Data`, `// %% Analisis`, dan seterusnya. Kode yang sama sekaligus menjadi sel-sel di **mode sel** (Bab 1): data cukup dimuat sekali, lalu bagian tampilan bisa diubah berkali-kali dengan cepat.

## 24.3 Berkas JavaScript tambahan

Fungsi yang dipakai di beberapa aplikasi sebaiknya tinggal di berkas sendiri. Cara paling sederhana, dan yang paling setia pada **Write and Run**, adalah berkas JavaScript biasa yang dimuat dengan tag `<script>`:

```js
// toko-analisis.js
window.TokoAnalisis = {
  saring(df, { tahun, cabang = [], kanal = "Semua" } = {}) {
    return df
      .filter(r => tahun == null || r.tanggal.getFullYear() === tahun)
      .filter(r => cabang.length === 0 || cabang.includes(r.cabang))
      .filter(r => kanal === "Semua" || r.kanal === kanal)
  },
  ringkas(df) {
    return { omzet: df.total.sum(), transaksi: df.shape[0], pelanggan: df.pelanggan_id.nunique(),
             rata: df.shape[0] ? df.total.sum() / df.shape[0] : 0 }
  },
  banding(a, b) {
    if (!a) return null
    return new Intl.NumberFormat("id-ID", { style: "percent", maximumFractionDigits: 1, signDisplay: "always" }).format(b / a - 1)
  }
}
```

```html
<script src="slak.js"><\/script>
<script src="slak-data.js"><\/script>
<script src="toko-analisis.js"><\/script>
<script type="text/slak">
  const df = await sl.read_csv("toko-nusantara.csv")
  const r = TokoAnalisis.ringkas(TokoAnalisis.saring(df, { tahun: 2024 }))
  sl.metric("Omzet 2024", r.omzet, null, { format: "rp" })
<\/script>
```

- Semua fungsi dikumpulkan di **satu objek** `TokoAnalisis`, supaya namanya tidak bertabrakan dengan nama lain.
- `window.TokoAnalisis = ...` membuat objek itu bisa dipakai di mana saja di halaman.
- Cara ini jalan di semua tempat: klik dua kali, Slak Studio, dan hosting.
- Parameter `{ tahun, cabang = [], kanal = "Semua" } = {}` adalah destructuring dengan nilai bawaan (Bab 5 dan 7): fungsi boleh dipanggil hanya dengan sebagian pilihan.

`toko-analisis.js` ada di folder bahan buku, dan halaman buku ini sudah memuatnya, jadi contoh berikut bisa dijalankan di sini:

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const ini = TokoAnalisis.ringkas(TokoAnalisis.saring(df, { tahun: 2024, kanal: "Online" }))
const lalu = TokoAnalisis.ringkas(TokoAnalisis.saring(df, { tahun: 2023, kanal: "Online" }))
sl.metric("Omzet online 2024", ini.omzet, TokoAnalisis.banding(lalu.omzet, ini.omzet), { format: "rp" })
```

## 24.4 ES Modules: import dan export

JavaScript modern punya cara resmi untuk berbagi kode antarberkas: **ES Modules**. Sebuah berkas menandai apa yang dibagikan dengan `export`, dan berkas lain mengambilnya dengan `import`. Tidak perlu build: browser memahaminya langsung.

```js
// toko-analisis.mjs
export function ringkas(df) {
  return { omzet: df.total.sum(), transaksi: df.shape[0], pelanggan: df.pelanggan_id.nunique() }
}
export const rupiah = (x) =>
  new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(x)
```

Di skrip Slak, ambil modul dengan `await import(...)`:

```slak
try {
  const { ringkas, rupiah } = await import(new URL("toko-analisis.mjs", location.href))
  const df = await sl.read_csv("toko-nusantara.csv")
  sl.write(`Omzet seluruhnya: ${rupiah(ringkas(df).omzet)}`)
} catch (e) {
  sl.warning("Modul tidak bisa dimuat. ES Modules hanya jalan lewat hosting atau server lokal, tidak saat halaman dibuka dengan klik dua kali. " + e.message)
}
```

- `new URL("toko-analisis.mjs", location.href)` membuat alamat lengkap berkas modul di folder halaman. Skrip Slak dijalankan dari dalam Slak, jadi alamat relatif saja tidak cukup.
- `const { ringkas, rupiah } = ...` mengambil dua fungsi yang di-`export` sekaligus.

**Batasnya:** browser tidak mengizinkan modul dimuat dari halaman yang dibuka dengan klik dua kali (alamat `file://`). Karena itu buku ini menganjurkan:

| Cara | Klik dua kali | Hosting | Kapan dipakai |
|---|---|---|---|
| Objek di berkas yang sama | ✓ | ✓ | Aplikasi kecil sampai menengah |
| Berkas `.js` biasa dengan `<script src>` | ✓ | ✓ | Fungsi yang dipakai di beberapa aplikasi |
| ES Modules `import`/`export` | ✗ | ✓ | Proyek yang pasti diterbitkan ke hosting, atau saat bekerja dengan pustaka modern |

Mengenal `import` dan `export` tetap penting: hampir semua kode JavaScript modern di internet ditulis dengan cara ini, dan kamu akan sering membacanya.

## 24.5 Class

Kadang data dan fungsi yang mengolahnya selalu berpasangan. **Class** membungkus keduanya menjadi satu "cetakan" yang bisa dibuat berkali-kali.

```slak
class Cabang {
  constructor(nama, df) {
    this.nama = nama
    this.data = df.filter(r => r.cabang === nama)
  }
  get omzet() { return this.data.total.sum() }
  omzetTahun(t) { return this.data.filter(r => r.tanggal.getFullYear() === t).total.sum() }
  pertumbuhan() { return this.omzetTahun(2024) / this.omzetTahun(2023) - 1 }
  toString() { return `${this.nama}: tumbuh ${(this.pertumbuhan() * 100).toLocaleString("id-ID", { maximumFractionDigits: 1 })}%` }
}

const df = await sl.read_csv("toko-nusantara.csv")
const semua = df.cabang.unique().map(n => new Cabang(n, df))
const tercepat = semua.reduce((a, c) => c.pertumbuhan() > a.pertumbuhan() ? c : a)
sl.write(`Tumbuh paling cepat: ${tercepat}`)
sl.dataframe(semua.map(c => ({ cabang: c.nama, omzet: c.omzet, tumbuh: c.pertumbuhan() })), { format: { omzet: "rupiah", tumbuh: "percent" } })
```

| Bagian | Arti |
|---|---|
| `class Cabang { ... }` | Cetakan bernama `Cabang` |
| `constructor(...)` | Dijalankan saat objek dibuat dengan `new Cabang(...)` |
| `this.nama` | Properti milik objek ini |
| `get omzet()` | Properti yang dihitung; dibaca tanpa kurung: `c.omzet` |
| `omzetTahun(t)` | Metode: fungsi milik objek |

Kamu sudah memakai class sejak Bab 14: `sl.DataFrame` dan `sl.ml.KMeans` adalah class. Untuk aplikasi analisis, fungsi dan objek biasa sering sudah cukup; pakai class bila kamu membuat **banyak objek sejenis** yang masing-masing punya data dan perilaku.

## 24.6 Menguji aplikasi

Di Bab 9 kamu menguji fungsi. Kini uji **aplikasinya**: jalankan aplikasi di balik layar, ubah widgetnya dari kode, lalu periksa apa yang tampil.

```slak
const aplikasi = `
const df = await sl.read_csv("toko-nusantara.csv")
const tahun = Number(sl.selectbox("Tahun", ["2024", "2023"]))
const kanal = sl.radio("Kanal", ["Semua", "Toko", "Online"])
const data = df.filter(r => r.tanggal.getFullYear() === tahun && (kanal === "Semua" || r.kanal === kanal))
sl.metric("Omzet", data.total.sum())
sl.metric("Transaksi", data.shape[0])
`

const { test, expect } = sl.testing
const df = await sl.read_csv("toko-nusantara.csv")

await test("bawaan menampilkan 2024", async () => {
  const at = await sl.testing.run(aplikasi)
  expect(at.metric("Transaksi").value).toBe(df.filter(r => r.tanggal.getFullYear() === 2024).shape[0])
})

await test("filter Online 2023 benar", async () => {
  const at = await sl.testing.run(aplikasi)
  await at.selectbox("Tahun").set_value("2023").run()
  await at.radio("Kanal").set_value("Online").run()
  const harapan = df.filter(r => r.tanggal.getFullYear() === 2023 && r.kanal === "Online").total.sum()
  expect(at.metric("Omzet").value).toBe(harapan)
})

await test("Toko + Online = Semua", async () => {
  const at = await sl.testing.run(aplikasi)
  const semua = at.metric("Omzet").value
  await at.radio("Kanal").set_value("Toko").run()
  const toko = at.metric("Omzet").value
  await at.radio("Kanal").set_value("Online").run()
  expect(toko + at.metric("Omzet").value).toBe(semua)
})
```

Uji ketiga menarik: ia tidak tahu angka pastinya, tetapi tahu **hubungan** yang harus selalu benar. Uji seperti ini menangkap kesalahan filter yang paling sering terjadi.

> **API Slak baru**
> - `await sl.testing.run(kode)` menjalankan aplikasi tersembunyi dan mengembalikan objek uji `at`.
> - `at.selectbox("Label").set_value(...)`, `at.button("Label").click()`, lalu `await ... .run()` untuk menjalankan ulang.
> - `at.metric("Label").value`, `at.dataframe[0].value`, `at.exception` untuk memeriksa hasil.
> - `sl.testing.from_string(kode)`, `from_file("app.slak")`, dan `from_function(fn)` membuat objek uji tanpa langsung menjalankannya.

### Berkas uji di Slak Studio

Di Slak Studio, simpan uji di berkas `nama.uji.slak` di samping aplikasinya, misalnya `laporan.uji.slak` untuk `laporan.slak`:

```slak tanpa-jalan lewati
const { test, expect } = sl.testing

await test("laporan jalan tanpa galat", async () => {
  const at = await sl.testing.run("laporan.slak")
  expect(at.exception).toHaveLength(0)
})
```

Panel **Uji** di bilah kiri Slak Studio menjalankan semua berkas uji di folder itu. **Uji cepat** memastikan berkas yang sedang dibuka jalan tanpa galat, dan **Buat berkas uji** membuat kerangkanya. Di luar Slak Studio, buka `slak-test.html` dari paket Slak.

Jalankan uji setiap kali selesai mengubah kode. Bila semuanya hijau, kamu boleh yakin perubahanmu tidak merusak yang lama.

## 24.7 Komentar dan nama untuk dirimu enam bulan lagi

Kode dibaca jauh lebih sering daripada ditulis, dan pembaca yang paling sering adalah dirimu sendiri, beberapa bulan kemudian, yang sudah lupa semuanya.

**Nama yang baik menjelaskan isinya:**

| Kurang jelas | Lebih jelas |
|---|---|
| `d`, `data2`, `tmp` | `transaksi2024`, `omzetPerKota` |
| `hitung()` | `hitungMarginKotor()` |
| `f` (boolean) | `sudahLunas`, `adaStok` |
| `x > 35000000` | `omzet >= TARGET_OMZET_BULANAN` |

**Komentar menjelaskan mengapa, bukan apa.** Kode sudah mengatakan *apa* yang dikerjakan.

```js
// Kurang berguna: mengulang yang sudah jelas dari kode
// kurangi 1 dari umur
umur--

// Berguna: menjelaskan alasan yang tidak terlihat dari kode
// Belum berulang tahun tahun ini, jadi umurnya belum bertambah
if (!sudahUlangTahun) umur--
```

Tulis juga satu komentar di atas setiap fungsi penting: apa yang diterima, apa yang dikembalikan. Lihat lagi `toko-analisis.js` di bahan buku sebagai contoh.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| `TokoAnalisis is not defined` | Berkas `.js` belum dimuat, atau dimuat sesudah skrip Slak | `<script src>` di `<head>`, sebelum `<script type="text/slak">` |
| `Failed to fetch dynamically imported module` | Modul dimuat dari halaman klik dua kali | Pakai berkas `.js` biasa, atau buka lewat hosting |
| `Failed to resolve module specifier` | Alamat modul relatif | `import(new URL("x.mjs", location.href))` |
| Lupa `new` saat membuat objek class | `Cabang("x", df)` | `new Cabang("x", df)` |
| Uji lulus padahal aplikasi salah | Uji hanya memeriksa ada tidaknya, bukan nilainya | Periksa nilai, atau hubungan antarnilai |

# Bab 25 · Proyek Akhir: Dasbor Portofolio Multi-Halaman

> **Tujuan belajar**
> - Merancang dasbor dari pertanyaan bisnis.
> - Menyusun aplikasi multi-halaman dengan `sl.navigation` dan `sl.page`.
> - Membuat filter global yang berlaku di semua halaman.
> - Melindungi satu halaman dengan login dan peran.
> - Menambahkan halaman "Tentang Saya" untuk portofolio.
> - Menerbitkan dasbor sebagai aplikasi yang bisa dipasang di ponsel.

Inilah puncak perjalananmu. Dasbor ini menggabungkan hampir semua yang kamu pelajari: membaca dan menggabungkan empat tabel (Bab 11, 18), meringkas (Bab 15), grafik (Bab 16), deret waktu (Bab 20), Pareto dan prakiraan (Bab 22), peta (Bab 23), dan kode yang rapi (Bab 24). Hasilnya adalah karya portofolio yang bisa kamu lampirkan saat melamar kerja.

## 25.1 Dari pertanyaan ke halaman

Tulis pertanyaan bisnisnya dulu, lalu jadikan setiap kelompok pertanyaan satu halaman:

| Halaman | Pertanyaan yang dijawab | Bab rujukan |
|---|---|---|
| Ringkasan | Bagaimana kinerja tahun ini dibanding tahun lalu? Apa tiga temuan utamanya? | 15, 17 |
| Penjualan | Cabang, kategori, dan hari apa yang paling ramai? | 15, 16 |
| Produk | Produk mana yang paling penting dan paling menguntungkan? | 18, 22 |
| Wilayah | Di mana penjualan terkonsentrasi? | 23 |
| Prakiraan | Berapa omzet beberapa bulan ke depan? | 20, 22 |
| Target | Cabang mana yang mencapai target? (khusus manajer) | 18 |
| Tentang Saya | Siapa pembuatnya, apa keahliannya, dan metode apa yang dipakai? | |

## 25.2 Aplikasi multi-halaman

Setiap halaman ditulis sebagai **fungsi** yang menerima `sl`. `sl.page` mendaftarkannya, dan `sl.navigation` membuat menunya:

```slak tanpa-jalan
const beranda = (sl) => { sl.title("Beranda"); sl.write("Selamat datang!") }
const data = (sl) => { sl.title("Data"); sl.dataframe([{ kota: "Jayapura", omzet: 41 }]) }

await sl.navigation([
  sl.page("Beranda", beranda, { icon: "🏠" }),
  sl.page("Data", data, { icon: "📊" })
]).run()
```

- `sl.navigation([...])` menampilkan menu di sidebar dan memilih halaman yang sedang dibuka; `.run()` menjalankan fungsinya.
- Setiap halaman punya alamat sendiri, misalnya `#/data`, sehingga tombol Back browser bekerja dan halaman bisa dibagikan langsung.
- Menu bisa dikelompokkan: `sl.navigation({ "Analisis": [...], "Profil": [...] })`.
- Berpindah halaman dari kode: `sl.switch_page("Data")`. Tautan ke halaman lain: `sl.page_link("Data")`.

Contoh di bab ini tidak dijalankan di halaman buku, karena halaman buku sendiri sudah memakai navigasi untuk daftar bab. Jalankan di playground atau Slak Studio.

> **API Slak baru**
> - `sl.navigation(daftarHalaman, { position })` dan `sl.page(judul, fungsi, { icon, url, default })` membuat aplikasi multi-halaman. `position`: `"sidebar"` (bawaan), `"top"`, atau `"hidden"`.
> - `sl.switch_page(judul)` dan `sl.page_link(judul)` berpindah halaman.

## 25.3 Filter global

Kode di luar fungsi halaman berjalan di **semua** halaman. Itulah tempat yang tepat untuk membaca data sekali dan menaruh filter yang berlaku di mana-mana:

```js
sl.sidebar.header("Filter")
const tahun = Number(sl.sidebar.selectbox("Tahun", ["2024", "2023"], { key: "f_tahun" }))
const kanal = sl.sidebar.radio("Kanal", ["Semua", "Toko", "Online"], { key: "f_kanal" })

const saring = (df) => df.filter(r => kanal === "Semua" || r.kanal === kanal)
const ini = saring(semua.filter(r => r.tahun === tahun))
```

Variabel `ini` lalu dipakai oleh setiap fungsi halaman. Karena filter ditulis sebelum `sl.navigation`, ia tampil di sidebar semua halaman, dan `key` menjaga pilihannya saat pengguna berpindah halaman.

## 25.4 Satu halaman khusus manajer

Halaman **Target** berisi angka internal yang tidak untuk semua orang. `sl.login` di dalam fungsi halaman itu menampilkan formulir masuk hanya saat halaman itu dibuka; halaman lain tetap terbuka untuk umum.

```js
async function halTarget(sl) {
  await sl.login({
    users: {
      manajer: { password: "$2y$10$h9g8XzzwmQwTu8Biy2kxzur5ioPnQbi.AzHsPpTxCIVMQ7GQN65T6", name: "Manajer Wilayah", role: "manajer" },
      staf: { password: "$2y$10$dIcMwFfIEjs3i5STBTCIO.k88fjSkemiaIxaT1b20blp4rYaqmeKK", name: "Staf Toko", role: "staf" }
    },
    title: "Halaman ini khusus manajer"
  })
  sl.require_role("manajer")
  sl.title("Capaian Target")
  sl.caption(`Masuk sebagai ${sl.user.name}`)
  // ...
}
```

- Password tidak pernah ditulis apa adanya, melainkan sebagai **hash bcrypt**. Buat hash-nya dengan `await sl.crypto.hash_password("passwordmu")`, atau di Slak Studio lewat **Alat › Lindungi password untuk sl.login**. Di contoh ini, password `manajer` adalah `manajer123` dan password `staf` adalah `staf123`.
- `sl.require_role("manajer")` menghentikan halaman dengan pesan bila pengguna yang masuk bukan manajer. Coba masuk sebagai `staf`.
- `sl.user` berisi `name`, `role`, dan `has_role()`. `sl.logout()` keluar.

> **API Slak baru**
> - `await sl.login({ users, title })`, `sl.require_role(peran)`, `sl.user`, `sl.logout()`.

> **Batas login di browser.** Login ini berjalan sepenuhnya di browser. Ia cocok untuk memisahkan tampilan manajer dan staf, tetapi **tidak menyembunyikan data** dari orang yang membuka kode halaman: data target tetap ikut terkirim ke browser pengunjung. Untuk data yang benar-benar rahasia dibutuhkan server, misalnya `slak-bridge.php` (Bab 26). Di portofolio, pakai data fiktif atau yang sudah dianonimkan.

const [trx, produk, cabang, target] = await Promise.all([
  sl.read_csv("toko-nusantara.csv"), sl.read_csv("produk.csv"), sl.read_csv("cabang.csv"), sl.read_csv("target.csv")
])
const semua = trx
  .merge(produk.select(["produk", "harga_pokok"]), { on: "produk", how: "left" })
  .assign({
    laba: r => r.total - r.jumlah * r.harga_pokok,
    tahun: r => r.tanggal.getFullYear(),
    bulan: r => sl.strftime(r.tanggal, "%Y-%m")

const banding = (a, b) => a ? persen.format(b / a - 1) : null
const ringkas = (df) => ({
  omzet: df.total.sum(), laba: df.laba.sum(),
  transaksi: df.shape[0], pelanggan: df.pelanggan_id.nunique()

const pilihCabang = sl.sidebar.multiselect("Cabang", semua.cabang.unique().sort(), { key: "f_cabang", placeholder: "Semua cabang" })

const saring = (df) => df
  .filter(r => kanal === "Semua" || r.kanal === kanal)
  .filter(r => pilihCabang.length === 0 || pilihCabang.includes(r.cabang))
const ini = saring(semua.filter(r => r.tahun === tahun))
const lalu = saring(semua.filter(r => r.tahun === tahun - 1))
const keterangan = `${tahun} · ${pilihCabang.length ? pilihCabang.length + " cabang" : "semua cabang"} · kanal ${kanal.toLowerCase()}`

// ======================================================================
// 4. Halaman
// ======================================================================

  sl.caption(keterangan)
  const r = ringkas(ini), r0 = ringkas(lalu)
  const [a, b, c, d] = sl.columns(4)
  a.metric("Omzet", r.omzet, banding(r0.omzet, r.omzet), { format: "rp" })
  b.metric("Laba kotor", r.laba, banding(r0.laba, r.laba), { format: "rp" })
  c.metric("Transaksi", r.transaksi, banding(r0.transaksi, r.transaksi))
  d.metric("Pelanggan", r.pelanggan, banding(r0.pelanggan, r.pelanggan))

  const bulanan = ini.resample("tanggal", "M").agg({ omzet: ["total", "sum"] })
  sl.line_chart(bulanan, { x: "tanggal", y: "omzet", format: "compact", title: "Omzet bulanan" })

  const kat = ini.groupby("kategori").agg({ omzet: ["total", "sum"] }).sort_values("omzet", { ascending: false }).to_records()
  const cab = ini.groupby("cabang").agg({ omzet: ["total", "sum"] }).sort_values("omzet", { ascending: false }).to_records()
  const online = ini.filter(x => x.kanal === "Online").total.sum() / (r.omzet || 1)
  sl.markdown(`
1. Omzet ${tahun} ${r0.omzet ? (r.omzet >= r0.omzet ? "naik" : "turun") + " " + banding(r0.omzet, r.omzet).replace(/^[+-]/, "") + " dibanding " + (tahun - 1) : "tercatat"} menjadi **Rp ${r.omzet.toLocaleString("id-ID")}**.
2. Kategori **${kat[0] ? kat[0].kategori : "-"}** menyumbang omzet terbesar, dan cabang **${cab[0] ? cab[0].cabang : "-"}** memimpin.
3. Kanal online menyumbang **${(online * 100).toLocaleString("id-ID", { maximumFractionDigits: 1 })}%** omzet.
`)
}

function halPenjualan(sl) {

  sl.caption(keterangan)
  const [t1, t2, t3] = sl.tabs(["Per cabang", "Per kategori", "Per hari"])

Dasbor sebesar ini wajib diuji. Uji berikut membuka setiap halaman dan memastikan tidak ada galat. Simpan sebagai `dasbor.uji.slak` di samping `dasbor.slak`, lalu jalankan dari panel **Uji** di Slak Studio:

```slak tanpa-jalan lewati
const { test, expect } = sl.testing
for (const hal of ["Ringkasan", "Penjualan", "Produk", "Wilayah", "Prakiraan", "Target", "Tentang Saya"]) {
  await test(`halaman ${hal} tanpa galat`, async () => {
    const at = await sl.testing.run("dasbor.slak", { timeout: 20000 })
    if (hal !== "Ringkasan") { at.switch_page(hal); await at.run({ timeout: 20000 }) }
    expect(at.exception).toHaveLength(0)
  })
}
await test("filter 2023 Online tanpa galat", async () => {
  const at = await sl.testing.run("dasbor.slak", { timeout: 20000 })
  await at.selectbox("Tahun").set_value("2023").run()
  await at.radio("Kanal").set_value("Online").run()
  expect(at.exception).toHaveLength(0)
})
```

## 25.8 Menerbitkan sebagai aplikasi

Terbitkan dasbormu dengan cara di Bab 17.6. Dua hal tambahan untuk proyek akhir:

1. **Bisa dipasang dan jalan tanpa internet.** Di jendela **Terbitkan** Slak Studio, centang **Bisa dipasang dan jalan offline (PWA)**. Setelah diterbitkan di alamat https, Chrome dan Edge menampilkan tombol **Pasang**, dan di ponsel Android ada pilihan **Tambahkan ke layar utama**. Ikon aplikasinya diambil dari `page_icon` di `sl.set_page_config`. Setelah dibuka sekali, dasbor tetap terbuka tanpa internet.
2. **Bagikan tautannya** di CV, profil LinkedIn, dan README GitHub-mu. Tuliskan satu kalimat temuan di samping tautan, misalnya: "Dasbor penjualan 10 cabang: omzet 2024 naik 27,6%, dengan kerajinan sebagai penyumbang terbesar."

## Latihan

**Latihan 25.1 (mudah).** Tambahkan halaman **Pelanggan** yang menampilkan segmen RFM (Bab 22.4) untuk data terpilih, lalu daftarkan di kelompok "Analisis".

**Latihan 25.2 (sedang).** Tambahkan pilihan **"Bandingkan dengan"** di sidebar berisi "Tahun lalu" dan "Target", lalu ubah metrik Omzet di halaman Ringkasan agar perubahannya dihitung terhadap pilihan itu.

**Latihan 25.3 (tantangan).** Tambahkan ke `dasbor.uji.slak` satu uji yang memastikan **jumlah omzet semua cabang di halaman Penjualan sama dengan metrik Omzet di halaman Ringkasan**, untuk setiap kombinasi tahun dan kanal.

Ketiga latihan ini sengaja tidak punya satu jawaban benar. Contoh solusinya ada di Lampiran D, tetapi dasbormu boleh berbeda. Justru di situlah nilainya sebagai karya portofolio: dasbormu menunjukkan caramu berpikir.

## Selamat!

Kamu memulai buku ini dengan `sl.title("Halo, dunia!")`. Kini kamu punya dasbor multi-halaman yang membaca empat tabel, menggabungkan, meringkas, menggambar, meramal, memetakan, melindungi satu halaman dengan login, dan teruji otomatis. Semuanya ditulis dengan JavaScript, berjalan di browser, tanpa build.

<script type="text/markdown" id="bab-26">
# Bab 26 · Langkah Berikutnya

> **Tujuan belajar**
> - Memahami apa yang dikerjakan Slak untukmu, dan apa batas JavaScript untuk analisis data.
> - Mengenal jembatan ke Python di browser dengan `sl.python`.
> - Mengetahui cara terhubung ke database server.
> - Mengenal komponen kustom dan dokumentasi proyek dengan `Slak.docs`.
> - Menyusun peta jalan belajar dan portofolio berikutnya.

## 26.1 Apa yang dikerjakan Slak untukmu

Di Bab 10 kamu melihat penghitung klik dengan JavaScript biasa. Kini bandingkan sesuatu yang lebih besar: penggeser angka yang mengubah grafik batang.

Dengan Slak:

```slak
const n = sl.slider("Banyak bulan", 1, 12, 6)
sl.bar_chart(Array.from({ length: n }, (_, i) => ({ bulan: i + 1, omzet: (i + 1) * 10 })), { x: "bulan", y: "omzet" })
```

Dengan JavaScript biasa, tanpa pustaka apa pun:

```html
<label for="n">Banyak bulan: <span id="nilai">6</span></label>
<input id="n" type="range" min="1" max="12" value="6">
<svg id="grafik" width="400" height="200"></svg>
<script>
  const masukan = document.getElementById("n")
  const nilai = document.getElementById("nilai")
  const svg = document.getElementById("grafik")

  function gambar() {
    const n = Number(masukan.value)
    nilai.textContent = n
    const data = Array.from({ length: n }, (_, i) => (i + 1) * 10)
    const maks = Math.max(...data)
    const lebar = 400 / n
    svg.innerHTML = ""
    data.forEach((v, i) => {
      const tinggi = v / maks * 180
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect")
      r.setAttribute("x", i * lebar + 4)
      r.setAttribute("y", 200 - tinggi)
      r.setAttribute("width", lebar - 8)
      r.setAttribute("height", tinggi)
      r.setAttribute("fill", "teal")
      svg.append(r)
    })
  }
  masukan.addEventListener("input", gambar)
  gambar()
<\/script>
```

Versi kedua masih belum punya sumbu, label, warna tema gelap, tooltip, tombol unduh PNG, teks untuk pembaca layar, atau tampilan ponsel. Semua itu dikerjakan Slak di balik `sl.bar_chart`. Kini kamu bisa **membaca** kode seperti ini: `document.getElementById` mencari elemen halaman, `addEventListener` memasang fungsi yang menunggu kejadian, dan `createElementNS` membuat elemen gambar. Semuanya JavaScript yang sudah kamu pelajari, ditambah sedikit pengetahuan tentang **DOM**, struktur halaman web.

Kamu tidak terkunci pada Slak. Bila suatu hari kamu ingin membuat situs web biasa, JavaScript yang kamu kuasai tetap berlaku sepenuhnya. Langkah berikutnya untuk jalur itu adalah mempelajari HTML, CSS, dan DOM.

## 26.2 Batas JavaScript untuk analisis data

Slak Data membawa JavaScript sangat jauh. Tetapi ada hal yang memang lebih baik dikerjakan di tempat lain:

| Kebutuhan | Di Slak | Bila melewati batas |
|---|---|---|
| Data di atas 1 juta baris | DuckDB (Bab 21) | Database server, BigQuery |
| Data puluhan GB | Di luar kemampuan browser | Python di komputer, database server |
| Gradient boosting, deep learning, pengolahan teks | Tidak tersedia | Python: scikit-learn, XGBoost, PyTorch |
| Model statistik lanjut (model campuran, ARIMA lengkap) | Sebagian lewat `sl.python` | Python atau R |
| Laporan terjadwal yang dikirim otomatis | Tidak ada server | Penjadwal di server |
| Login sungguhan dan data pribadi banyak pengguna | Login di browser saja | slak-bridge di hosting |

Batas ini bukan kekurangan yang memalukan, melainkan keputusan desain: Slak memilih **tanpa server, tanpa instalasi, tanpa build**. Untuk portofolio, laporan internal, alat bantu kecil, dan belajar, pilihan itu tepat. Untuk data perusahaan besar, analis memakai alat lain, dan kamu kini punya dasar untuk mempelajarinya.

## 26.3 Python di browser

Slak menyediakan jembatan ke **Python** lewat Pyodide, Python yang berjalan di dalam browser. Kamu mengirim DataFrame Slak, menulis kode pandas, dan menerima hasilnya kembali.

> **Butuh internet:** Python (puluhan MB) diunduh saat pertama dipakai. Python tidak tersedia di halaman yang dibuka dengan klik dua kali; jalankan lewat Slak Studio, playground, atau hosting.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
try {
  const hasil = await sl.spinner("Memuat Python…", () => sl.python(`
import pandas as pd
df.groupby("kategori")["total"].sum().sort_values(ascending=False)
`, { data: { df } }))
  sl.write(hasil)
} catch (e) {
  sl.warning("Python belum bisa dimuat: " + e.message)
}
```

- `{ data: { df } }` mengirim DataFrame Slak ke Python dengan nama `df`, sebagai DataFrame pandas.
- Nilai baris terakhir kode Python dikembalikan ke Slak. DataFrame pandas kembali sebagai DataFrame Slak.
- Hasil `print()` dan grafik matplotlib ikut tampil.

Bandingkan kode pandas di atas dengan versi Slak Data dari Bab 15:

| pandas (Python) | Slak Data (JavaScript) |
|---|---|
| `df.groupby("kategori")["total"].sum()` | `df.groupby("kategori").agg({ omzet: ["total", "sum"] })` |
| `df[df.total > 100000]` | `df.query("total > 100000")` |
| `df.sort_values("total", ascending=False)` | `df.sort_values("total", { ascending: false })` |
| `pd.merge(a, b, on="k", how="left")` | `a.merge(b, { on: "k", how: "left" })` |

Karena nama-namanya dibuat sama, beralih ke Python terasa seperti belajar logat baru dari bahasa yang sudah kamu kuasai.

> **API Slak baru**
> - `await sl.python(kode, { data })` menjalankan Python di browser. `await sl.pyplot(kode, { df })` khusus untuk grafik matplotlib.

## 26.4 Database server

Data perusahaan tinggal di database server: PostgreSQL, MySQL, MariaDB, SQL Server, libSQL/Turso, atau Google BigQuery. Slak menyediakan dua jalan:

**1. Jendela Database di Slak Studio.** Tekan **Ctrl+Shift+D** (atau menu **Alat › Database**). Dari sana kamu bisa terhubung ke SQLite, IndexedDB, PostgreSQL (termasuk Supabase dan Neon), MySQL, MariaDB, SQL Server, DuckDB, libSQL/Turso, dan BigQuery; menjalankan SQL dengan saran nama kolom; melihat diagram relasi tabel; mengimpor dan mengekspor data; dan mengambil salinan data untuk aplikasimu. Password koneksi disimpan terenkripsi oleh sistem operasi.

**2. slak-bridge untuk aplikasi yang diterbitkan.** Aplikasi di browser tidak boleh menyimpan password database, karena kodenya bisa dibaca siapa saja. Karena itu, password tinggal di server dalam berkas `slak-bridge.php` (untuk hosting cPanel) atau `slak-bridge.js` (untuk Node.js), dan aplikasimu bertanya lewat jembatan itu:

```slak tanpa-jalan lewati
const db = sl.connection("toko", { type: "bridge", url: "slak-bridge.php" })
const df = await db.query("SELECT kota, SUM(total) AS omzet FROM penjualan WHERE tahun = ? GROUP BY kota", { params: [2024] })
sl.dataframe(df)
```

Bawaannya jembatan **hanya membaca**, dan perintah berbahaya seperti `DROP` selalu ditolak. Jembatan yang sama juga bisa memeriksa login dan jawaban kuis di server, sehingga kunci jawaban dan password benar-benar tersembunyi. Berkas jembatannya bisa dibuat langsung dari jendela Database: klik kanan koneksi › **Pakai di kode Slak** › **Buat slak-bridge.php**.

Kueri SQL yang kamu tulis di Bab 21 dengan gaya portabel langsung berlaku di PostgreSQL. Itulah sebabnya buku ini menekankan `to_char`, `EXTRACT`, dan `COALESCE`.

## 26.5 Komponen kustom

Bila Slak belum punya widget yang kamu butuhkan, kamu bisa membuatnya sendiri dari HTML dan JavaScript. Slak juga membawa galeri 10 komponen siap pakai di `slak-komponen.js`: rating bintang, sketsa tanda tangan, rentang tanggal, kalender heatmap, kanban, titik di peta, editor kode, pengatur waktu, papan skor, dan tombol suara.

```slak
const nilai = sl.component("rating", { label: "Nilai pelayanan cabang", max: 5, key: "rating-cabang" })
sl.write(nilai ? `Terima kasih atas nilai ${nilai} bintang!` : "Beri nilai dengan mengeklik bintang.")
```

Komponen buatan sendiri dibuat dengan `sl.component(html, { args, key, default })`, dan komponen yang sudah jadi di sebuah folder dipakai dengan `sl.components.declare_component(nama, { url })`. Slak memakai protokol yang sama dengan Streamlit, jadi banyak komponen Streamlit bisa dipakai langsung.

## 26.6 Mendokumentasikan proyekmu dengan Slak.docs

Proyek yang baik punya dokumentasi. Berkas tambahan `slak-docs.js` membuat situs dokumentasi dari Markdown, dengan Slak sendiri. Edisi web buku yang sedang kamu baca dibuat dengan cara ini.

~~~html
<script src="slak.js"><\/script>
<script src="slak-docs.js"><\/script>

<script type="text/markdown" id="bab-1">
# Proyek Analisis Toko Nusantara

Penjelasan proyekmu, lengkap dengan contoh yang langsung dijalankan:

```slak
sl.write("Hasil contoh tampil di sini")
```
<\/script>

<script type="text/slak">
await Slak.docs.site(sl, {
  judul: "Dokumentasi Proyekku",
  bab: { "Pengantar": [{ judul: "Tentang proyek", elemen: "bab-1" }] }
})
<\/script>
~~~

`Slak.docs.site` membuat menu bab, alamat per halaman, tombol Sebelumnya/Berikutnya, daftar isi, dan pencarian dengan **Ctrl+K**. Blok kode berbahasa `slak` dijalankan dan hasilnya tampil di bawahnya, lengkap dengan tautan **Buka di Playground**. Blok yang ditandai `slak tanpa-jalan` hanya ditampilkan.

> **API Slak baru** (dari `slak-docs.js`, versi 0.1, berlabel eksperimental)
> - `Slak.docs.site(sl, { judul, bab })` membuat situs dokumentasi lengkap.
> - `Slak.docs.markdown(sl, teks)` menampilkan satu bab Markdown dengan contoh yang dijalankan.
> - Perhatikan awalannya: `Slak.docs`, bukan `sl.docs`, dan `sl` dikirim sebagai argumen pertama. `slak-docs.js` tidak menambah nama apa pun ke `sl`.

## 26.7 Peta jalan belajar

Kamu kini **analis data tingkat menengah** dengan JavaScript. Berikut arah yang bisa kamu tempuh:

| Arah | Yang dipelajari berikutnya | Kenapa |
|---|---|---|
| **Analis data lanjut** | Python (pandas, scikit-learn), statistik inferensial lebih dalam | Standar industri untuk analisis dan machine learning |
| **Analis bisnis / BI** | SQL lanjutan, PostgreSQL atau BigQuery, desain dasbor | Data perusahaan tinggal di database |
| **Pengembang web** | HTML, CSS, DOM, lalu kerangka kerja web | JavaScript-mu langsung terpakai |
| **Insinyur data** | Database, pipeline data, penjadwalan | Menyiapkan data untuk para analis |

Apa pun arahnya, tiga kebiasaan dari buku ini tetap berlaku: **mulai dari pertanyaan**, **bersihkan dan periksa datanya**, dan **uji hasilmu**.

## 26.8 Membangun portofolio

Satu dasbor sudah bagus. Tiga sampai lima proyek yang beragam jauh lebih meyakinkan. Ide proyek berikutnya, semuanya bisa dibuat dengan yang sudah kamu pelajari:

1. **Data terbuka Indonesia.** Ambil data dari Bank Dunia (Bab 12) atau portal data pemerintah, lalu ceritakan perkembangan satu indikator di beberapa provinsi.
2. **Analisis uji A/B.** Pakai dataset bawaan `ab_test` (Bab 19): rancang laporan keputusan "luncurkan versi B atau tidak?".
3. **Prediksi churn.** Pakai dataset `pelanggan` (Bab 22): bandingkan beberapa model dan buat demo dengan `sl.ml_demo`.
4. **Data milik komunitasmu.** Koperasi, sekolah, gereja, masjid, atau UMKM di sekitarmu pasti punya data yang belum dianalisis. Ini proyek paling berharga, asal datanya dianonimkan dan pemiliknya setuju.

Untuk setiap proyek, tulis di halaman *Tentang* atau README: **pertanyaan**, **data dan sumbernya**, **cara membersihkan**, **temuan**, dan **rekomendasi**. Perekrut membaca cara berpikirmu, bukan hanya grafiknya.

Terakhir: **bagikan karyamu.** Terbitkan, tulis satu unggahan singkat tentang temuanmu, dan minta masukan. Setiap pemrogram dan analis yang hebat pernah memulai dari aplikasi kecil yang diperlihatkan kepada orang lain.

Selamat menulis dan menjalankan. **Write and Run.**

<script type="text/markdown" id="lampiran-a-ringkasan-api">
# Lampiran A · Ringkasan API Slak di Buku Ini

Daftar ini merangkum setiap fungsi Slak yang dikenalkan di buku, beserta bab tempat ia pertama dijelaskan. Semua nama `sl.*` dan `Slak.*` di sini tercantum di daftar API stabil Slak 1.9 (API-STABIL.md) dan dijamin tetap ada sampai Slak 2.0, kecuali yang ditandai berasal dari berkas tambahan.

| Berkas | Isi | Dimuat oleh playground |
|---|---|---|
| `slak.js` | Inti: teks, widget, tata letak, grafik, state, form, navigasi, login, `sl.testing`, `sl.crypto` | ✓ |
| `slak-data.js` | Slak Data: DataFrame, statistik, ML, deret waktu, analisis bisnis, dataset | ✓ |
| `slak-sql.js` | SQLite: `sl.sql`, `sl.sqlite` | ✓ |
| `slak-peta.js` (+ `slak-peta-kab.js`) | Peta: `sl.map`, `sl.choropleth`, `sl.geo` | ✓ |
| `slak-komponen.js` | Galeri 10 komponen untuk `sl.component` | ✓ |
| `slak-duckdb.js` | DuckDB: `sl.duckdb`, `sl.read_parquet` (mesin diunduh saat pertama dipakai) | ✗ |
| `slak-docs.js` | `Slak.docs` untuk situs dokumentasi (versi 0.1, eksperimental) | ✗ |

## Bab 1

| Fungsi | Kegunaan |
|---|---|
| `sl.title(teks)` | Menampilkan judul besar di bagian atas. |
| `sl.write(nilai)` | Menampilkan apa saja: teks, angka, tabel, atau objek. Teks boleh memakai Markdown, misalnya `**tebal**`. |
| `sl.set_page_config({ page_title, page_icon, layout })` | Mengatur judul tab, ikon, dan tata letak. `layout: "wide"` membuat konten lebih lebar. |
| `Slak.share.link(kode, alamat)` | Membuat tautan playground yang berisi kode. Perhatikan awalannya `Slak.`, bukan `sl.`: ini fungsi milik Slak sebagai alat, bukan perintah untuk menampilkan sesuatu. |
| `sl.code(teks)` | Menampilkan teks sebagai kode. |

## Bab 2

| Fungsi | Kegunaan |
|---|---|
| `sl.markdown(teks)` | Menampilkan teks berformat Markdown: tebal, miring, daftar, tabel, tautan, dan warna `:green[...]`, `:red[...]`, `:blue[...]`, `:orange[...]`, `:violet[...]`, `:gray[...]`. |
| `sl.text(teks)` | Menampilkan teks persis seperti ditulis. |

## Bab 3

| Fungsi | Kegunaan |
|---|---|
| `sl.success(teks)`, `sl.info(teks)`, `sl.warning(teks)`, `sl.error(teks)` | Menampilkan kotak pesan hijau, biru, kuning, dan merah. |
| `sl.text_input(label, nilaiAwal)` | Mengembalikan teks. Nilainya dipakai setelah kamu menekan Enter atau pindah ke kotak lain. |
| `sl.number_input(label, { min, max, value, step })` | Mengembalikan angka. |
| `sl.button(label)` | Mengembalikan `true` pada satu jalan ulang setelah diklik, lalu `false` lagi. |

## Bab 4

| Fungsi | Kegunaan |
|---|---|
| `sl.slider(label, min, max, nilaiAwal, langkah)` | Mengembalikan angka yang dipilih. Urutan argumennya: label, nilai terkecil, nilai terbesar, nilai awal, lalu langkah (boleh dilewati). |

## Bab 5

| Fungsi | Kegunaan |
|---|---|
| `sl.selectbox(label, pilihan)` | Menampilkan daftar pilihan dan mengembalikan pilihan yang dipilih. |
| `sl.columns(n)` | Membagi baris menjadi `n` kolom dan mengembalikan larik kolom. Setiap kolom punya semua fungsi tampilan, misalnya `kiri.write(...)`. |
| `sl.metric(label, nilai)` | Menampilkan angka besar dengan label. Kamu akan sering memakainya untuk dasbor. |

## Bab 6

| Fungsi | Kegunaan |
|---|---|
| `sl.multiselect(label, pilihan, { default })` | Mengembalikan **larik** berisi pilihan yang dipilih. |

## Bab 7

| Fungsi | Kegunaan |
|---|---|
| `sl.table(data)` | Menampilkan tabel statis. |
| `sl.dataframe(data)` | Menampilkan tabel interaktif: kolomnya bisa diurutkan dengan mengeklik judul, dan ada tombol unduh CSV. |
| `sl.metric(label, nilai, delta)` | Menampilkan angka besar. Argumen ketiga (opsional) adalah perubahan, misalnya `"+12%"`, yang tampil hijau atau merah. |
| `sl.dataset(nama)` | Mengembalikan dataset contoh sebagai DataFrame, yaitu tabel milik Slak Data (Bab 14). |
| `sl.checkbox(label)` | Mengembalikan `true` atau `false`. |

## Bab 8

| Fungsi | Kegunaan |
|---|---|
| `sl.date_input(label, nilaiAwal)` | Mengembalikan tanggal sebagai **teks** `"YYYY-MM-DD"`. Ubah dengan `new Date(tgl)` bila ingin menghitung. |
| `sl.strftime(tanggal, pola)` | Memformat tanggal dengan pola seperti `%d`, `%B`, `%Y`, `%A`. |

## Bab 9

| Fungsi | Kegunaan |
|---|---|
| `sl.warning(teks)` | Menampilkan kotak peringatan kuning. |
| `sl.exception(galat)` | Menampilkan galat lengkap dengan tombol **Detail** berisi stack trace, tanpa menghentikan aplikasi. |
| `sl.testing.expect(nilai)` | Membuat pernyataan yang diperiksa, misalnya `.toBe(...)`. |

## Bab 10

| Fungsi | Kegunaan |
|---|---|
| `sl.session_state` | Menyimpan nilai selama halaman terbuka. Isinya hilang bila halaman dimuat ulang. |
| `sl.local_state` | Seperti `session_state`, tetapi permanen. Data disimpan per browser dan hanya cocok untuk data JSON: angka, teks, boolean, larik, dan objek biasa. |
| `sl.clear_local_state()` | Mengosongkannya. |
| `sl.form(key, { clear_on_submit })` | Membuat formulir. Widget di dalamnya ditulis dengan awalan formulir, misalnya `f.text_input(...)`, dan tidak memicu jalan ulang sampai tombol kirim ditekan. |
| `sl.crypto.quiz_hash(jawaban)` | Membuat kode pelindung. Bisa juga larik beberapa jawaban yang sama-sama benar. |
| `sl.crypto.quiz_check(jawaban, kode)` | Mengembalikan `true` bila jawaban cocok. |

## Bab 11

| Fungsi | Kegunaan |
|---|---|
| `sl.json(objek)` | Menampilkan objek atau larik dengan rapi dan bisa dilipat. |
| `sl.file_uploader(label, { type })` | Mengembalikan objek berkas (`name`, `size`, `text`, `bytes`) atau `null` bila belum ada berkas. Berkasnya tidak pernah dikirim ke server mana pun; semuanya diproses di browser. |

## Bab 12

| Fungsi | Kegunaan |
|---|---|
| `sl.open_data(id)`, `sl.open_data.list()`, `sl.github(jalur)`, `sl.worldbank(indikator, { negara, tahun })`, `sl.huggingface(dataset, { file })`, `sl.kaggle(dataset, { file })` | Mengambil dataset terbuka sebagai DataFrame. Semuanya ada di `slak-data.js`. |
| `sl.datasets()` | Menampilkan daftar dataset bawaan. |
| `sl.line_chart(data, { x, y, title })` | Menggambar grafik garis. Grafik dibahas di Bab 16. |
| `sl.progress(nilai, teks)` | Menampilkan bilah kemajuan berskala 0–100. Perbarui dengan `.progress(nilai, teks)`. |

## Bab 13

| Fungsi | Kegunaan |
|---|---|
| `sl.data_editor(data, { num_rows })` | Menampilkan tabel yang bisa diedit, lalu mengembalikan larik hasil editan. `num_rows: "dynamic"` mengizinkan pengguna menambah dan menghapus baris. |

## Bab 14

<script type="text/markdown" id="lampiran-b-cheat-sheet-javascript">
# Lampiran B · Cheat Sheet JavaScript untuk Data

Ringkasan JavaScript yang dipakai di buku ini, dalam urutan yang sama dengan Tahap 1.

## Variabel dan tipe

```js
const nama = "Kopi Wamena"   // tidak bisa diganti
let stok = 24                // bisa diganti
typeof 25000                 // "number"   (juga "string", "boolean", "object", "undefined")
Number("1250")  String(1250)  parseFloat("3.75 kg")  parseInt("12 buah")
Number.isNaN(x)              // memeriksa NaN
null  undefined  NaN         // "sengaja kosong", "belum diisi", "hitungan gagal"
```

## Operator

| Jenis | Operator |
|---|---|
| Aritmetika | `+ - * / % **` |
| Penugasan | `= += -= *= /= ++ --` |
| Perbandingan | `=== !== < > <= >=` (hindari `==`) |
| Logika | `&& \|\| !` |
| Pilihan singkat | `syarat ? a : b` |
| Aman untuk nilai kosong | `obj?.prop`, `nilai ?? cadangan` |

## Percabangan dan perulangan

```js
if (a) { ... } else if (b) { ... } else { ... }
switch (kode) { case "JYP": ...; break; default: ... }

for (let i = 0; i < n; i++) { ... }
for (const x of larik) { ... }
while (syarat) { ... }
break    continue
```

## Fungsi

```js
function luas(p, l = 1) { return p * l }
const pajak = harga => harga * 0.11
const ongkir = (kg, kota) => { const t = 8000; return Math.ceil(kg) * t }
async function ambil() { const r = await fetch(url); return r.json() }
```

## Larik

| Metode | Hasil | Contoh |
|---|---|---|
| `push`, `pop` | Tambah/ambil di akhir (mengubah larik) | `a.push(5)` |
| `slice(a, b)` | Potongan baru | `a.slice(0, 3)` |
| `includes`, `indexOf` | Ada? Di mana? | `a.includes("Ambon")` |
| `map(fn)` | Larik baru, setiap isi diubah | `a.map(x => x * 2)` |
| `filter(fn)` | Larik baru, yang memenuhi syarat | `a.filter(x => x > 10)` |
| `reduce(fn, awal)` | Satu nilai ringkasan | `a.reduce((s, x) => s + x, 0)` |
| `sort(fn)` | Urut (mengubah larik) | `[...a].sort((x, y) => x - y)` |
| `find`, `findIndex` | Isi/indeks pertama yang cocok | `a.find(x => x.id === 3)` |
| `some`, `every` | Ada yang / semua memenuhi? | `a.some(x => x === 0)` |
| `join(sep)` | Teks | `a.join(", ")` |
| `at(-1)` | Isi terakhir | `a.at(-1)` |
| `[...new Set(a)]` | Nilai unik | |
| `Math.max(...a)` | Terbesar | |

## Objek

```js
const p = { nama: "Sagu", harga: 30000 }
p.nama   p["harga"]   p.stok = 40   delete p.stok   "stok" in p
Object.keys(p)   Object.values(p)   Object.entries(p)   Object.fromEntries(pasangan)
const { nama, harga } = p              // destructuring
const salinan = { ...p, harga: 32000 } // spread
const peta = new Map([["JYP", "Jayapura"]]); peta.get("JYP"); peta.has("SOQ")
```

## Teks

```js
s.trim()  s.toLowerCase()  s.toUpperCase()  s.includes("x")  s.startsWith("Papua")
s.split(",")  s.replace("a", "b")  s.replaceAll("-", "/")  s.padStart(4, "0")  s.slice(0, 7)
`Total ${n}`                         // template literal
s.replace(/[^0-9]/g, "")             // buang semua yang bukan angka
s.match(/^(\d{4})-(\d{2})-(\d{2})$/) // tangkap bagian-bagian
a.localeCompare(b, "id")             // pembanding teks untuk sort
```

## Angka dan tanggal

```js
Math.round(x)  Math.floor(x)  Math.ceil(x)  x.toFixed(2)  // toFixed menghasilkan teks
new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(x)
new Intl.NumberFormat("id-ID", { style: "percent", maximumFractionDigits: 1 }).format(0.123)
(1250000).toLocaleString("id-ID")

new Date("2024-04-10")       new Date(2024, 3, 10)   // bulan dari 0!
d.getFullYear()  d.getMonth() + 1  d.getDate()  d.getDay()   // 0 = Minggu
(b - a) / (24 * 60 * 60 * 1000)                               // selisih hari
new Intl.DateTimeFormat("id-ID", { dateStyle: "long" }).format(d)
d.toISOString().slice(0, 10)
```

## Galat dan async

```js
try { ... } catch (e) { e.message } finally { ... }
throw new Error("Pesan")
await sl.sleep(500)
const [a, b] = await Promise.all([ambilA(), ambilB()])
```

## JSON

```js
JSON.parse(teks)          // teks → objek
JSON.stringify(obj)       // objek → teks
JSON.stringify(obj, null, 1)
```

## Class

```js
class Cabang {
  constructor(nama) { this.nama = nama }
  get label() { return "Nusantara " + this.nama }
  sapa() { return `Halo dari ${this.nama}` }
}
const c = new Cabang("Ambon")
```

<script type="text/markdown" id="lampiran-c-cheat-sheet-sql">
# Lampiran C · Cheat Sheet SQL

Semua kueri di lampiran ini memakai gaya yang jalan di SQLite (`sl.sql`, `sl.sqlite`), DuckDB (`sl.duckdb`), dan PostgreSQL.

## Kerangka kueri

```sql
SELECT kolom, FUNGSI(kolom) AS nama_baru     -- 5. pilih kolom
FROM tabel                                   -- 1. ambil tabel
WHERE syarat_baris                           -- 2. saring baris
GROUP BY kolom                               -- 3. kelompokkan
HAVING syarat_kelompok                       -- 4. saring kelompok
ORDER BY nama_baru DESC                      -- 6. urutkan
LIMIT 10                                     -- 7. batasi
```

## Menyaring

```sql
WHERE kota = 'Ambon'                         -- teks memakai kutip tunggal
WHERE total BETWEEN 100000 AND 500000
WHERE kota IN ('Jayapura', 'Sorong')
WHERE produk LIKE 'Kopi%'                    -- diawali "Kopi"
WHERE kanal IS NULL
WHERE tanggal >= '2024-01-01'
WHERE kota = :kota                           -- parameter dari widget (Bab 21.3)
```

## Fungsi ringkasan

`COUNT(*)`, `COUNT(DISTINCT pelanggan_id)`, `SUM(total)`, `AVG(total)`, `MIN(...)`, `MAX(...)`, `ROUND(x, 0)`.

## Tanggal (portabel)

```sql
EXTRACT(YEAR FROM tanggal)        -- tahun
EXTRACT(MONTH FROM tanggal)       -- bulan 1–12
EXTRACT(DOW FROM tanggal)         -- hari: 0 Minggu … 6 Sabtu
to_char(tanggal, 'YYYY-MM')       -- teks bulan
date_trunc('month', tanggal)      -- awal bulan
```

## Kondisi

```sql
CASE WHEN total >= 500000 THEN 'besar'
     WHEN total >= 100000 THEN 'sedang'
     ELSE 'kecil' END AS ukuran
COALESCE(kanal, 'Tidak diketahui')
SUM(CASE WHEN kanal = 'Online' THEN total ELSE 0 END)   -- jumlah bersyarat
```

## JOIN

```sql
SELECT t.produk, p.pemasok, t.total - t.jumlah * p.harga_pokok AS laba
FROM jual AS t
LEFT JOIN produk AS p ON p.produk = t.produk
```

| Jenis | Hasil |
|---|---|
| `JOIN` / `INNER JOIN` | Hanya yang cocok di kedua tabel |
| `LEFT JOIN` | Semua baris kiri |
| `RIGHT JOIN` | Semua baris kanan |
| `FULL OUTER JOIN` | Semua baris dari keduanya |

## CTE

```sql
WITH bulanan AS (
  SELECT to_char(tanggal, 'YYYY-MM') AS bulan, SUM(total) AS omzet
  FROM jual GROUP BY 1
)
SELECT * FROM bulanan WHERE omzet > 10000000
```

## Window function

```sql
RANK()       OVER (PARTITION BY kota ORDER BY omzet DESC)   -- peringkat per kota
ROW_NUMBER() OVER (ORDER BY tanggal)                         -- nomor urut
LAG(omzet)   OVER (PARTITION BY kota ORDER BY bulan)         -- nilai sebelumnya
LEAD(omzet)  OVER (PARTITION BY kota ORDER BY bulan)         -- nilai sesudahnya
SUM(omzet)   OVER (PARTITION BY kota ORDER BY bulan)         -- total berjalan
AVG(omzet)   OVER (ORDER BY bulan ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)  -- rata-rata 3 bulan
```

## Khusus SQLite yang sebaiknya dihindari

| Hindari | Pakai |
|---|---|
| `strftime('%Y-%m', t)` | `to_char(t, 'YYYY-MM')` |
| `strftime('%Y', t)` | `EXTRACT(YEAR FROM t)` |
| `IFNULL(x, 0)` | `COALESCE(x, 0)` |
| `GROUP_CONCAT(x)` | `string_agg(x, ', ')` |

Periksa kuerimu dengan `sl.sql.check(kueri)`.

## Di Slak

```js
await sl.sql(kueri, { jual: df }, { params: { kota } })     // SQLite atas DataFrame
const db = await sl.sqlite({ name: "tokoku" }); db.query(kueri, [nilai])   // SQLite tersimpan
await sl.duckdb(kueri, { jual: df })                        // DuckDB (slak-duckdb.js)
await sl.duckdb("SELECT ... FROM 'berkas.parquet'")         // DuckDB membaca berkas
await sl.report(teksMarkdownDenganSQL, { tables: { jual: df } })
```

</script>
<script type="text/markdown" id="lampiran-d-kunci-jawaban">
# Lampiran D · Kunci Jawaban Latihan

Lampiran ini berisi jawaban lengkap untuk latihan tingkat **mudah** dan **sedang**, jawaban mini-proyek Bab 9, dan **petunjuk** untuk latihan tingkat **tantangan**. Latihan tantangan sengaja tidak diberi jawaban lengkap: uji otomatis di setiap latihan sudah memberi tahu apakah jawabanmu benar.

Setiap jawaban di bawah memuat ujinya, jadi saat dijalankan semua kotaknya hijau. Jawabanmu tidak harus sama persis; yang penting ujinya lulus.

## Bab 1

**Latihan 1.1.** Jawaban bebas, misalnya:

```slak solusi-bebas
sl.title("Rina Wenda")
sl.write("Hobi saya membaca novel dan bersepeda di tepi Danau Sentani.")
```

**Latihan 1.2.**

```slak solusi
const hargaBuku = 45000
const hargaPena = 7500
const total = 2 * hargaBuku + 3 * hargaPena
sl.write("Total: " + total)

await sl.testing.test("total belanja benar", () => sl.testing.expect(total).toBe(112500))
```

**Latihan 1.3 (petunjuk).** `let tautan = await Slak.share.link('sl.title("Kuis Ibu Kota")', "https://slak.studio/playground/")`. Jangan lupa `await`.

## Bab 2

**Latihan 2.1.**

```slak solusi
const produk = "Sagu Lempeng 1kg"
const harga = 30000
const kalimat = `${produk} harganya ${harga}`
sl.write(kalimat)

await sl.testing.test("kalimat benar", () => sl.testing.expect(kalimat).toBe("Sagu Lempeng 1kg harganya 30000"))
```

**Latihan 2.2.**

```slak solusi
const jumlahTeks = "4"
const hargaTeks = "22000"
const total = Number(jumlahTeks) * Number(hargaTeks)

sl.write(total)
await sl.testing.test("total berupa angka", () => sl.testing.expect(typeof total).toBe("number"))
await sl.testing.test("total = 88000", () => sl.testing.expect(total).toBe(88000))
```

**Latihan 2.3 (petunjuk).** `Number(isian)` menghasilkan `NaN` bila isian bukan angka. `Number.isNaN(...)` bernilai `true` untuk `NaN`, jadi `sah` adalah kebalikannya: pakai `!`.

## Bab 3

**Latihan 3.1.**

```slak solusi
function lulus(nilai) {
  if (nilai >= 75) return "Lulus"
  return "Belum lulus"
}

await sl.testing.test("80 lulus", () => sl.testing.expect(lulus(80)).toBe("Lulus"))
await sl.testing.test("75 lulus", () => sl.testing.expect(lulus(75)).toBe("Lulus"))
await sl.testing.test("74 belum lulus", () => sl.testing.expect(lulus(74)).toBe("Belum lulus"))
```

**Latihan 3.2.**

```slak solusi
function diskon(total, anggota) {
  if (total >= 500000 || anggota) return total * 0.1
  return 0
}

await sl.testing.test("600 ribu, bukan anggota", () => sl.testing.expect(diskon(600000, false)).toBe(60000))
await sl.testing.test("200 ribu, anggota", () => sl.testing.expect(diskon(200000, true)).toBe(20000))
await sl.testing.test("200 ribu, bukan anggota", () => sl.testing.expect(diskon(200000, false)).toBe(0))
```

**Latihan 3.3 (petunjuk).** Periksa dari syarat yang paling khusus: habis dibagi 400 → kabisat; habis dibagi 100 → bukan; habis dibagi 4 → kabisat; selain itu bukan. "Habis dibagi 4" ditulis `tahun % 4 === 0`.

## Bab 4

**Latihan 4.1.**

```slak solusi
let jumlah = 0
for (let i = 1; i <= 100; i++) jumlah += i

sl.write(jumlah)
await sl.testing.test("1 + 2 + ... + 100 = 5050", () => sl.testing.expect(jumlah).toBe(5050))
```

**Latihan 4.2.**

```slak solusi
const omzet = [1250000, 980000, 1430000, 1100000, 1675000, 2010000, 1890000]
let hariRamai = 0
for (const x of omzet) {
  if (x > 1500000) hariRamai++
}

sl.write(hariRamai)
await sl.testing.test("ada 3 hari ramai", () => sl.testing.expect(hariRamai).toBe(3))
```

**Latihan 4.3 (petunjuk).** Simpan dua hal di luar perulangan: nilai terendah sejauh ini dan posisinya. Pakai `for (let i = 0; i < omzet2.length; i++)` supaya kamu punya indeks `i`.

## Bab 5

**Latihan 5.1.**

```slak solusi
function luasPersegiPanjang(p, l) {
  return p * l
}

await sl.testing.test("4 × 5 = 20", () => sl.testing.expect(luasPersegiPanjang(4, 5)).toBe(20))
await sl.testing.test("2,5 × 2 = 5", () => sl.testing.expect(luasPersegiPanjang(2.5, 2)).toBe(5))
```

**Latihan 5.2.**

**Mini-proyek Bab 9: kelima bug kasir.**

1. `subtotal` menjumlah, padahal seharusnya mengalikan: `item.harga * item.jumlah`.
2. Harga gelang tersimpan sebagai teks `"40000"`: ubah dengan `Number(item.harga)`.
3. Perulangan di `totalBelanja` mulai dari `i = 1`, sehingga barang pertama terlewat: mulai dari `0`.
4. Diskon seharusnya berlaku **mulai tepat** 250.000: pakai `>=`, bukan `>`.
5. PPN 11% adalah `× 0,11`, bukan `× 11`.

```slak solusi
sl.title("Kasir Toko Nusantara :convenience_store:")

const keranjang = [
  { produk: "Kopi Arabika Wamena 250g", harga: 85000, jumlah: 2 },
  { produk: "Keripik Keladi 200g", harga: 22000, jumlah: 3 },
  { produk: "Gelang Manik Papua", harga: "40000", jumlah: 1 }
]

function subtotal(item) {
  return Number(item.harga) * item.jumlah
}

function totalBelanja(daftar) {
  let total = 0
  for (let i = 0; i < daftar.length; i++) total += subtotal(daftar[i])
  return total
}

function diskon(total) {
  if (total >= 250000) return total * 0.05
  return 0
}

function ppn(setelahDiskon) {
  return setelahDiskon * 0.11
}

const total = totalBelanja(keranjang)
const pot = diskon(total)
const pajak = ppn(total - pot)

sl.dataframe(keranjang)
sl.metric("Total", total, null, { format: "rp" })
sl.metric("Bayar", total - pot + pajak, null, { format: "rp" })

const { test, expect } = sl.testing
await test("subtotal kopi = 170000", () => expect(subtotal(keranjang[0])).toBe(170000))
await test("subtotal gelang = 40000", () => expect(subtotal(keranjang[2])).toBe(40000))
await test("total belanja = 276000", () => expect(totalBelanja(keranjang)).toBe(276000))
await test("diskon 5% mulai tepat 250000", () => expect(diskon(250000)).toBe(12500))
await test("PPN 11% dari 100000 = 11000", () => expect(ppn(100000)).toBe(11000))
```
