<script type="text/markdown" id="bab-09">
# Bab 9 · Galat dan Debugging

> **Tujuan belajar**
> - Mengenali tiga jenis galat: sintaks, referensi, dan tipe.
> - Membaca pesan galat di playground, Slak Studio, dan DevTools browser.
> - Menangani galat dengan `try`, `catch`, `finally`, dan `throw`.
> - Mencari kesalahan dengan teknik yang teratur.
> - Menguji fungsi secara otomatis dengan `sl.testing`.

## 9.1 Galat itu teman

Setiap pemrogram, dari pemula sampai yang berpengalaman puluhan tahun, membuat kesalahan setiap hari. Bedanya hanya satu: yang berpengalaman tahu cara membaca pesan galat. Pesan galat bukan hukuman. Ia petunjuk yang menunjuk ke baris yang perlu kamu perbaiki.

## 9.2 Tiga jenis galat

| Jenis | Kapan terjadi | Contoh pesan | Penyebab umum |
|---|---|---|---|
| **SyntaxError** | Sebelum program jalan | `Unexpected token`, `missing ) after argument list` | Kurung, kutip, atau kurawal tidak berpasangan |
| **ReferenceError** | Saat program jalan | `total is not defined` | Salah ketik nama variabel, atau variabel dipakai di luar wilayahnya |
| **TypeError** | Saat program jalan | `Cannot read properties of undefined`, `x.map is not a function` | Memakai nilai dengan cara yang tidak cocok dengan tipenya |

Galat sintaks menghentikan program sebelum satu baris pun dijalankan. Dua jenis lainnya menghentikan program di baris tempat galat terjadi; baris di atasnya tetap sudah jalan.

## 9.3 Membaca galat di Slak

Saat kode salah, Slak menampilkan kotak galat merah di pratinjau, lengkap dengan tombol **Detail** untuk melihat urutan pemanggilannya (*stack trace*).

Slak Studio menunjukkan masalah yang sama di empat tempat sekaligus:

1. Baris yang bermasalah diberi latar merah muda di editor.
2. Pratinjau menampilkan kotak galat.
3. Konsol mencatat galat dalam bahasa aslinya, lalu menambahkan baris 💡 berisi penjelasan dalam bahasa Indonesia.
4. Bilah status menampilkan nomor baris dan penjelasannya. Klik untuk melompat ke baris itu.

Untuk salah ketik nama fungsi, Slak Studio bahkan menebak maksudmu, misalnya "Fungsi sl.metrik tidak ada. Maksudmu sl.metric?". Saat kamu mengetik `sl.`, editor menampilkan saran fungsi lengkap dengan urutan argumennya, dan panel **Referensi** (tekan **F1**) berisi semua fungsi Slak beserta contohnya.

Di playground atau browser biasa, buka **DevTools** dengan **F12**, lalu pilih tab **Console**. Pesan dari `console.log` dan galat muncul di sana.

## 9.4 Dua kesalahan klasik pemula

**Satu `=` yang seharusnya tiga.**

```slak tanpa-jalan lewati
const status = "lunas"
if (status = "belum") {          // salah: mengisi, bukan membandingkan
  sl.warning("Tagih pembayaran")
}
```

Karena `status` dibuat dengan `const`, JavaScript menolak mengisinya dan muncul galat **Assignment to constant variable**. Pesan itu adalah petunjuk: kamu menulis `=` padahal maksudnya `===`. Bila variabelnya dibuat dengan `let`, tidak ada galat sama sekali. Kondisinya diam-diam selalu benar, dan kesalahan seperti ini jauh lebih sulit ditemukan. Satu alasan lagi untuk memilih `const`.

**Membaca properti dari sesuatu yang tidak ada.**

```slak
const produk = [{ nama: "Kopi Wamena", harga: 85000 }]
const dicari = produk.find(p => p.nama === "Kopi Toraja")   // tidak ketemu: undefined

try {
  sl.write(dicari.harga)
} catch (e) {
  sl.error(e.message)
}

sl.write(dicari?.harga)          // aman: undefined, tanpa galat
sl.write(dicari?.harga ?? 0)     // aman, dengan nilai cadangan 0
```

- `?.` (*optional chaining*) berhenti dengan tenang bila nilai di kirinya `undefined` atau `null`.
- `??` memberi nilai cadangan bila nilai di kirinya `undefined` atau `null`.

Kedua operator ini sangat berguna untuk data nyata yang penuh lubang.

## 9.5 try, catch, finally

Bungkus kode yang mungkin gagal dengan `try`. Bila terjadi galat, program tidak berhenti, melainkan lompat ke `catch`.

```slak
const teksJson = '{"kota": "Ambon", "omzet": 1800000'   // kurung tutup hilang

try {
  const data = JSON.parse(teksJson)
  sl.write(data)
} catch (e) {
  sl.warning("Data tidak bisa dibaca: " + e.message)
} finally {
  sl.caption("Pemeriksaan selesai.")   // selalu dijalankan, ada galat atau tidak
}
```

`JSON.parse` mengubah teks JSON menjadi objek. Bab 11 membahasnya.

Kamu juga bisa **melempar** galat sendiri dengan `throw`, misalnya saat masukan tidak masuk akal:

```slak galat-sengaja
function hargaSatuan(total, jumlah) {
  if (jumlah <= 0) throw new Error("Jumlah harus lebih dari 0")
  return total / jumlah
}

try {
  sl.write(hargaSatuan(170000, 2))
  sl.write(hargaSatuan(170000, 0))
} catch (e) {
  sl.exception(e)
}
```

> **API Slak baru**
> - `sl.warning(teks)` menampilkan kotak peringatan kuning.
> - `sl.exception(galat)` menampilkan galat lengkap dengan tombol **Detail** berisi stack trace, tanpa menghentikan aplikasi.

## 9.6 Teknik mencari kesalahan

Saat hasil program salah tetapi tidak ada pesan galat, gunakan langkah-langkah ini:

1. **Baca pesannya sampai habis.** Nomor baris dan nama variabel biasanya sudah menjawab.
2. **Intip isi variabel.** Tulis `console.log(x)` atau `sl.write(x)` sebelum baris yang dicurigai. Apakah isinya seperti dugaanmu? Apakah tipenya benar?
3. **Perkecil masalahnya.** Jadikan baris yang dicurigai komentar (**Ctrl+/** di Slak Studio) satu per satu, sampai galatnya hilang.
4. **Coba dengan data kecil.** Lebih mudah memeriksa 3 baris daripada 3.000 baris.
5. **Jelaskan kodenya keras-keras**, baris demi baris, seolah kepada teman. Sering kali kesalahannya terlihat saat dijelaskan.

Di DevTools browser, kamu juga bisa memasang **breakpoint**: klik nomor baris di tab **Sources**, dan program berhenti di sana supaya isi setiap variabel bisa diperiksa. Cara yang lebih cepat: tulis `debugger` di baris mana pun, dan program berhenti di situ selama DevTools terbuka.

## 9.7 Menguji kode secara otomatis

Memeriksa hasil dengan mata melelahkan dan mudah terlewat. Slak punya `sl.testing`, alat uji yang sama yang dipakai latihan di buku ini.

```slak
function diskonAnggota(total) {
  return total >= 500000 ? total * 0.1 : 0
}

const { test, expect } = sl.testing

await test("600 ribu dapat diskon 60 ribu", () => expect(diskonAnggota(600000)).toBe(60000))
await test("tepat 500 ribu dapat diskon", () => expect(diskonAnggota(500000)).toBe(50000))
await test("200 ribu tidak dapat diskon", () => expect(diskonAnggota(200000)).toBe(0))
```

Setiap `test` menampilkan kotak hijau bila lulus, atau merah beserta nilai yang diharapkan dan nilai sebenarnya bila gagal.

| Pernyataan | Lulus bila |
|---|---|
| `expect(x).toBe(y)` | `x` sama persis dengan `y` (angka, teks, boolean) |
| `expect(x).toEqual(y)` | Isi larik atau objek `x` sama dengan `y` |
| `expect(x).toBeCloseTo(y, 2)` | `x` mendekati `y` sampai 2 desimal (untuk pecahan) |
| `expect(x).toBeGreaterThan(y)` | `x > y` |
| `expect(x).toContain(y)` | Larik atau teks `x` memuat `y` |
| `expect(x).toHaveLength(n)` | Panjang `x` adalah `n` |
| `expect(fn).toThrow()` | Memanggil `fn` melempar galat |
| `expect(x).not.toBe(y)` | Kebalikan dari pernyataan sesudahnya |

> **API Slak baru**
> - `await sl.testing.test(judul, fungsi)` menjalankan satu uji dan menampilkan hasilnya.
> - `sl.testing.expect(nilai)` membuat pernyataan yang diperiksa, misalnya `.toBe(...)`.

Mengapa `toBeCloseTo` perlu? Ingat Bab 2: `0.1 + 0.2` tidak tepat sama dengan `0.3`.

```slak
await sl.testing.test("0,1 + 0,2 mendekati 0,3", () => sl.testing.expect(0.1 + 0.2).toBeCloseTo(0.3, 10))
```

Kebiasaan menulis uji untuk setiap fungsi penting akan sangat berguna di Bab 24, saat kodemu tumbuh besar.

> **Coba di playground**
> Ubah fungsi `diskonAnggota` menjadi `total > 500000` (tanpa `=`). Uji mana yang menjadi merah?

## Kesalahan umum

| Pesan | Arti | Perbaikan |
|---|---|---|
| `x is not defined` | Variabel `x` belum dibuat atau salah ketik | Periksa ejaan dan huruf besar-kecil |
| `Cannot read properties of undefined (reading 'y')` | Kamu menulis `sesuatu.y`, padahal `sesuatu` kosong | Periksa asal `sesuatu`; pakai `?.` bila memang bisa kosong |
| `x.map is not a function` | `x` bukan larik | Lihat isi `x` dengan `sl.write(x)` |
| `Unexpected end of input` | Kurung kurawal atau kurung biasa belum ditutup | Hitung pasangan `{ }` dan `( )` |
| `Assignment to constant variable` | Mengisi ulang variabel `const`, sering karena `=` yang seharusnya `===` | Ganti `===`, atau pakai `let` bila memang perlu diganti |

## Latihan

**Latihan 9.1 (mudah).** Fungsi ini seharusnya mengembalikan nama hari, tetapi ada satu kesalahan. Temukan dan perbaiki.

```slak latihan
function namaHari(nomor) {
  const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"]
  return hari[nomor + 1]
}

await sl.testing.test("0 = Minggu", () => sl.testing.expect(namaHari(0)).toBe("Minggu"))
await sl.testing.test("5 = Jumat", () => sl.testing.expect(namaHari(5)).toBe("Jumat"))
```

**Latihan 9.2 (sedang).** Lengkapi `bacaHarga(teks)` agar mengembalikan objek hasil `JSON.parse` bila teksnya JSON yang sah, dan `null` bila tidak, tanpa menghentikan program.

```slak latihan
function bacaHarga(teks) {
  return JSON.parse(teks)
}

await sl.testing.test("JSON sah terbaca", () => sl.testing.expect(bacaHarga('{"harga": 5000}')).toEqual({ harga: 5000 }))
await sl.testing.test("JSON rusak menjadi null", () => sl.testing.expect(bacaHarga('{"harga": ')).toBeNull())
```

**Latihan 9.3 (tantangan).** Tulis fungsi `persen(bagian, keseluruhan)` yang mengembalikan persentase dibulatkan satu desimal, dan **melempar galat** bila `keseluruhan` bernilai 0.

```slak latihan
function persen(bagian, keseluruhan) {
  return 0
}

await sl.testing.test("25 dari 200 = 12.5", () => sl.testing.expect(persen(25, 200)).toBe(12.5))
await sl.testing.test("1 dari 3 = 33.3", () => sl.testing.expect(persen(1, 3)).toBe(33.3))
await sl.testing.test("pembagi 0 melempar galat", () => sl.testing.expect(() => persen(5, 0)).toThrow())
```

## Mini-proyek: perbaiki aplikasi kasir

Aplikasi kasir kecil ini berisi **lima bug**. Programnya tetap jalan, tetapi hasilnya salah. Lima uji di bagian bawah menunjukkan apa yang seharusnya terjadi. Temukan dan perbaiki semua bug sampai kelima uji lulus. Jawabannya ada di Lampiran D.

```slak latihan
sl.title("Kasir Toko Nusantara :convenience_store:")

const keranjang = [
  { produk: "Kopi Arabika Wamena 250g", harga: 85000, jumlah: 2 },
  { produk: "Keripik Keladi 200g", harga: 22000, jumlah: 3 },
  { produk: "Gelang Manik Papua", harga: "40000", jumlah: 1 }
]

// Bug ada di fungsi-fungsi berikut
function subtotal(item) {
  return item.harga + item.jumlah
}

function totalBelanja(daftar) {
  let total = 0
  for (let i = 1; i < daftar.length; i++) total += subtotal(daftar[i])
  return total
}

function diskon(total) {
  if (total > 250000) return total * 0.05
  return 0
}

function ppn(setelahDiskon) {
  return setelahDiskon * 11
}

const total = totalBelanja(keranjang)
const pot = diskon(total)
const pajak = ppn(total - pot)

sl.dataframe(keranjang)
sl.metric("Total", total, null, { format: "rp" })
sl.metric("Bayar", total - pot + pajak, null, { format: "rp" })

const { test, expect } = sl.testing
await test("subtotal kopi = 170000", () => expect(subtotal(keranjang[0])).toBe(170000))
await test("subtotal gelang = 40000", () => expect(subtotal(keranjang[2])).toBe(40000))
await test("total belanja = 276000", () => expect(totalBelanja(keranjang)).toBe(276000))
await test("diskon 5% mulai tepat 250000", () => expect(diskon(250000)).toBe(12500))
await test("PPN 11% dari 100000 = 11000", () => expect(ppn(100000)).toBe(11000))
```

<script type="text/markdown" id="bab-10">
# Bab 10 · Cara Slak Menjalankan Skrip

> **Tujuan belajar**
> - Memahami jalan ulang: setiap interaksi menjalankan ulang seluruh skrip dari atas.
> - Menyimpan nilai antar-interaksi dengan `sl.session_state` dan `key`.
> - Menyimpan data permanen di browser dengan `sl.local_state`.
> - Mengumpulkan beberapa isian sekaligus dengan `sl.form`.
> - Membandingkan cara Slak dengan event listener JavaScript biasa.
> - Menyembunyikan kunci jawaban kuis dengan `sl.crypto`.

## 10.1 Jalan ulang

Sejak Bab 3 kamu sudah merasakannya: setiap kali widget diubah, hasil di layar ikut berubah. Di balik itu, Slak melakukan satu hal sederhana: **menjalankan ulang seluruh skrip dari baris pertama**, kali ini dengan nilai widget yang baru. Lalu Slak membandingkan hasil baru dengan tampilan lama dan hanya mengubah bagian yang berbeda, sehingga posisi gulir dan kursor tetap terjaga.

Akibatnya, kode Slak bisa dibaca seperti resep dari atas ke bawah. Tetapi ada satu akibat yang sering mengejutkan pemula:

```slak
let klik = 0
if (sl.button("Tambah")) klik++
sl.write(`Klik: ${klik}`)
```

Klik tombolnya beberapa kali. Angkanya tidak pernah lebih dari 1. Mengapa? Setiap kali tombol diklik, skrip dijalankan ulang dari atas, dan baris pertama mengembalikan `klik` ke 0. Variabel biasa **lupa** setiap jalan ulang.

## 10.2 session_state: ingatan selama halaman terbuka

`sl.session_state` adalah objek yang isinya **bertahan antar-jalan ulang** selama halaman terbuka.

```slak
const ss = sl.session_state
if (!("skor" in ss)) ss.skor = 0     // isi nilai awal hanya bila belum ada

if (sl.button("Tambah skor")) ss.skor++
if (sl.button("Reset skor")) ss.skor = 0
sl.metric("Skor", ss.skor)
```

Pola `if (!("skor" in ss)) ss.skor = 0` sangat penting. Tanpa `if`, nilai awal akan menimpa skor di setiap jalan ulang, dan kamu kembali ke masalah 10.1.

> **API Slak baru**
> - `sl.session_state` menyimpan nilai selama halaman terbuka. Isinya hilang bila halaman dimuat ulang.

### key: widget yang ikut tersimpan

Widget yang diberi `key` otomatis menyimpan nilainya di `session_state` dengan nama itu:

```slak
sl.text_input("Nama pelanggan", { key: "pelanggan" })
sl.write(`Halo, ${sl.session_state.pelanggan || "pelanggan"}!`)
```

`key` juga memberi widget identitas tetap. Tanpa `key`, Slak mengenali widget dari jenis dan labelnya, jadi mengganti label membuat widget dianggap baru dan nilainya kembali ke awal. Setiap `key` harus unik; memakai `key` yang sama dua kali menghasilkan galat "Key widget dipakai lebih dari sekali".

### Callback: on_click

Tombol bisa diberi fungsi yang dipanggil **sebelum** skrip dijalankan ulang. Cara ini membuat perubahan langsung terlihat di jalan ulang yang sama.

```slak
const s = sl.session_state
if (!s.keranjang) s.keranjang = []

const tambah = (nama) => { s.keranjang.push(nama) }
const kosongkan = () => { s.keranjang = [] }

const [k1, k2, k3] = sl.columns(3)
k1.button("+ Kopi", { on_click: tambah, args: ["Kopi"] })
k2.button("+ Sagu", { on_click: tambah, args: ["Sagu"] })
k3.button("Kosongkan", { on_click: kosongkan })

sl.write(`Keranjang (${s.keranjang.length}): ${s.keranjang.join(", ") || "kosong"}`)
```

`args` adalah larik argumen yang dikirim ke fungsi callback.

## 10.3 local_state: ingatan permanen di browser

`session_state` hilang saat halaman dimuat ulang. Untuk data yang harus bertahan, misalnya catatan atau pengaturan, pakai `sl.local_state`. Cara pakainya sama, tetapi isinya disimpan di browser dan tetap ada besok.

```slak
const ls = sl.local_state
if (!("kunjungan" in ls)) ls.kunjungan = 0
if (sl.button("Catat kunjungan")) ls.kunjungan++
sl.metric("Kunjungan tercatat", ls.kunjungan)
sl.caption("Muat ulang halaman: angkanya tetap.")
```

> **API Slak baru**
> - `sl.local_state` seperti `session_state`, tetapi permanen. Data disimpan per browser dan hanya cocok untuk data JSON: angka, teks, boolean, larik, dan objek biasa.
> - `sl.clear_local_state()` mengosongkannya.

Dua hal yang perlu kamu tahu:

- Data tersimpan **di browser pengguna**, bukan di server. Pengguna lain tidak melihatnya, dan data hilang bila pengguna menghapus data situs.
- Jangan menyimpan password atau data rahasia di sana. Siapa pun yang memakai komputer itu bisa membacanya.

## 10.4 Form: kirim sekaligus

Setiap perubahan widget memicu jalan ulang. Untuk formulir dengan banyak isian, itu tidak perlu: kita ingin semua isian diproses sekali saat tombol **Kirim** ditekan. Gunakan `sl.form`.

```slak
const f = sl.form("tamu", { clear_on_submit: true })
const namaTamu = f.text_input("Nama tamu")
const asal = f.selectbox("Asal", ["Jayapura", "Sorong", "Manokwari", "Lainnya"])
const kirim = f.form_submit_button("Kirim")

if (kirim) {
  if (!namaTamu) sl.error("Nama wajib diisi.")
  else sl.success(`Terima kasih, ${namaTamu} dari ${asal}!`)
}
```

> **API Slak baru**
> - `sl.form(key, { clear_on_submit })` membuat formulir. Widget di dalamnya ditulis dengan awalan formulir, misalnya `f.text_input(...)`, dan tidak memicu jalan ulang sampai tombol kirim ditekan.
> - `f.form_submit_button(label)` bernilai `true` sekali setelah ditekan. `clear_on_submit: true` mengosongkan isian setelah dikirim.

## 10.5 Bandingkan dengan JavaScript biasa

Bagaimana cara membuat penghitung klik tanpa Slak? Dengan JavaScript biasa di browser, kamu bekerja dengan **DOM** (struktur halaman) dan **event listener** (fungsi yang menunggu kejadian):

```html
<button id="tombol">Tambah</button>
<p id="hasil">Klik: 0</p>
<script>
  let klik = 0
  const tombol = document.getElementById("tombol")
  const hasil = document.getElementById("hasil")
  tombol.addEventListener("click", () => {
    klik++
    hasil.textContent = "Klik: " + klik
  })
<\/script>
```

| | JavaScript biasa | Slak |
|---|---|---|
| Alur | Pasang fungsi yang menunggu kejadian | Skrip dijalankan ulang dari atas |
| Variabel bertahan? | Ya, skrip hanya jalan sekali | Tidak; pakai `session_state` |
| Mengubah tampilan | Kamu sendiri yang mengubah DOM | Slak menggambar ulang yang berubah |
| Cocok untuk | Situs dan aplikasi web umum | Aplikasi data, dasbor, alat kecil |

Keduanya JavaScript yang sama. Slak hanya memilih gaya yang lebih mudah untuk aplikasi data: kamu memikirkan **apa yang ditampilkan**, bukan **kapan harus mengubah tampilan**. Di Bab 26 kamu akan melihat seberapa banyak yang dikerjakan Slak untukmu.

## 10.6 Menyembunyikan kunci jawaban kuis

Kode aplikasi Slak bisa dibaca siapa saja yang membuka halamannya. Bila kunci jawaban kuis ditulis apa adanya, peserta bisa mengintipnya. `sl.crypto.quiz_hash` mengubah jawaban menjadi kode yang tidak bisa dibaca, dan `sl.crypto.quiz_check` memeriksa jawaban peserta terhadap kode itu.

Langkah pertama, buat kodenya sekali (di playground atau Slak Studio):

```slak
sl.code(sl.crypto.quiz_hash("Jayapura"))
```

Setiap kali dijalankan, kodenya berbeda karena ada bumbu acak, tetapi semuanya sama-sama cocok dengan "Jayapura". Salin hasilnya ke aplikasi kuis:

```slak
const KUNCI = "sq1$1dfd355a$dEQmiN6xy_-AgzCbOolSOwc5"   // jawaban asli tidak tertulis di kode
const jawab = sl.text_input("Ibu kota Provinsi Papua?")
if (jawab) {
  if (sl.crypto.quiz_check(jawab, KUNCI)) sl.success("Benar!")
  else sl.error("Belum tepat, coba lagi.")
}
```

`quiz_check` mengabaikan huruf besar-kecil, spasi berlebih, dan titik di akhir, jadi "jayapura" dan "Jayapura." juga benar.

> **API Slak baru**
> - `sl.crypto.quiz_hash(jawaban)` membuat kode pelindung. Bisa juga larik beberapa jawaban yang sama-sama benar.
> - `sl.crypto.quiz_check(jawaban, kode)` mengembalikan `true` bila jawaban cocok.

Hash menyembunyikan jawaban dari mata, bukan dari tebakan. Untuk pilihan ganda dengan empat opsi, peserta tetap bisa mencoba semuanya. Pakai untuk isian singkat.

> **Coba di playground**
> Buat kode untuk dua jawaban yang sama-sama benar: `sl.crypto.quiz_hash(["Jakarta", "DKI Jakarta"])`. Lalu periksa keduanya dengan `quiz_check`.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Penghitung tidak pernah lebih dari 1 | Memakai variabel biasa | Simpan di `sl.session_state` |
| Nilai kembali ke awal setiap klik | Menulis `ss.skor = 0` tanpa `if` | `if (!("skor" in ss)) ss.skor = 0` |
| Isian widget hilang setelah label diubah | Widget dianggap baru | Beri `key` yang tetap |
| `Key widget dipakai lebih dari sekali` | Dua widget memakai `key` sama | Buat setiap `key` unik |
| Data `local_state` berupa tanggal berubah menjadi teks | `local_state` hanya menyimpan JSON | Simpan tanggal sebagai teks ISO |

## Mini-proyek 1: daftar tugas yang tidak hilang

```slak
sl.title("Daftar Tugas :white_check_mark:")

const ls = sl.local_state
if (!ls.tugas) ls.tugas = []

const f = sl.form("tugas-baru", { clear_on_submit: true })
const judul = f.text_input("Tugas baru")
if (f.form_submit_button("Tambah") && judul.trim()) {
  ls.tugas = [...ls.tugas, { judul: judul.trim(), selesai: false }]
}

const ubah = (i) => {
  ls.tugas = ls.tugas.map((t, j) => j === i ? { ...t, selesai: !t.selesai } : t)
}
const hapusSelesai = () => { ls.tugas = ls.tugas.filter(t => !t.selesai) }

ls.tugas.forEach((t, i) => {
  sl.checkbox(t.judul, { value: t.selesai, key: "tugas-" + i, on_change: ubah, args: [i] })
})

const sisa = ls.tugas.filter(t => !t.selesai).length
sl.caption(`${sisa} tugas belum selesai`)
sl.button("Hapus yang sudah selesai", { on_click: hapusSelesai })
```

Tutup halamannya, buka lagi besok: tugasmu masih ada.

Perhatikan bahwa `ls.tugas` selalu diganti dengan larik baru (`[...ls.tugas, ...]`, `map`, `filter`), bukan diubah di tempat. Mengganti nilainya memastikan Slak menyimpan perubahan ke browser.

<script type="text/markdown" id="bab-11">
# Bab 11 · Dari Data Mentah ke Struktur

> **Tujuan belajar**
> - Mengenal format data yang paling sering ditemui analis: CSV, JSON, dan spreadsheet.
> - Membaca CSV secara manual dengan `split`, lalu mengubah teks menjadi angka.
> - Membaca dan menulis JSON dengan `JSON.parse` dan `JSON.stringify`.
> - Membaca berkas dengan `sl.read_csv` dan berkas unggahan pengguna.
> - Memahami cara Slak membaca berkas saat halaman dibuka dengan klik dua kali, dan batas ukuran data di browser.

Selamat datang di Tahap 2. Mulai bab ini, kamu bekerja dengan data Toko Nusantara: 2.929 transaksi dari sepuluh cabang selama 2023–2024.

## 11.1 Tiga format data

| Format | Bentuk | Contoh pemakaian |
|---|---|---|
| **CSV** | Teks; setiap baris satu rekaman, kolom dipisah koma atau titik koma | Ekspor dari Excel, sistem kasir, portal data pemerintah |
| **JSON** | Teks dengan bentuk persis seperti objek dan larik JavaScript | Data dari API di internet, berkas pengaturan |
| **Excel (.xlsx)** | Berkas biner berisi beberapa lembar | Laporan kantor sehari-hari |

CSV adalah format yang paling sering dipakai analis karena sederhana dan bisa dibuka program apa pun. Inilah lima baris pertama `cabang.csv` dari bahan buku:

```
kode,cabang,kota,provinsi,lat,lon,tanggal_buka
JYP,Nusantara Jayapura,Jayapura,Papua,-2.5337,140.7181,2019-03-01
SOQ,Nusantara Sorong,Sorong,Papua Barat Daya,-0.8762,131.2558,2020-07-15
MKW,Nusantara Manokwari,Manokwari,Papua Barat,-0.8615,134.062,2021-02-01
MKS,Nusantara Makassar,Makassar,Sulawesi Selatan,-5.1477,119.4327,2019-09-10
```

Baris pertama adalah **kepala** (nama kolom). Baris berikutnya adalah data.

## 11.2 Membaca CSV dengan tangan

Sebelum memakai alat jadi, mari membaca CSV dengan JavaScript murni. Semua yang dibutuhkan sudah kamu pelajari: `split`, `map`, dan objek.

```slak
const teksCsv = `kode,kota,omzet,buka
JYP,Jayapura,4200000,2019-03-01
SOQ,Sorong,3100000,2020-07-15
MKW,Manokwari,1800000,2021-02-01`

const baris = teksCsv.trim().split("\n")       // pecah per baris
const kepala = baris[0].split(",")             // nama kolom
const data = baris.slice(1).map(b => {
  const sel = b.split(",")
  const obj = {}
  kepala.forEach((k, i) => { obj[k] = sel[i] })
  return obj
})

sl.write(data)
sl.write(typeof data[0].omzet)
```

Hasilnya larik objek, persis seperti di Bab 7. Tetapi perhatikan baris terakhir: `omzet` masih **teks**. CSV tidak menyimpan tipe data; semua isinya teks. Tugas pertama analis adalah mengubah setiap kolom ke tipe yang benar.

```slak
const mentah = [
  { kode: "JYP", kota: "Jayapura", omzet: "4200000", buka: "2019-03-01" },
  { kode: "SOQ", kota: "Sorong", omzet: "3100000", buka: "2020-07-15" }
]

const rapi = mentah.map(r => ({
  ...r,
  omzet: Number(r.omzet),
  buka: new Date(r.buka)
}))

sl.write(rapi[0].omzet + rapi[1].omzet)
sl.write(rapi[0].buka.getFullYear() < rapi[1].buka.getFullYear())
```

Cara manual ini cukup untuk CSV sederhana. Sayangnya CSV dunia nyata jarang sederhana:

- Teks berisi koma diapit tanda kutip: `"Kopi, Teh, dan Gula"`. `split(",")` akan memotongnya di tempat yang salah.
- Berkas dari Excel Indonesia memakai titik koma dan desimal koma: `1.250.000,50`.
- Sel kosong, tanda `-`, atau tulisan `NA` berarti "tidak ada data".

Karena itu, untuk berkas sungguhan kita memakai pembaca CSV milik Slak.

## 11.3 sl.read_csv

```slak
const df = await sl.read_csv("toko-nusantara.csv")
sl.write(df.shape)            // [banyak baris, banyak kolom]
sl.dataframe(df.head(5))
```

> **API Slak baru**
> - `await sl.read_csv(nama)` membaca berkas CSV atau TSV dan mengembalikan **DataFrame**, tabel milik Slak Data. Butuh `slak-data.js`.
> - `df.head(n)` mengambil `n` baris pertama. `df.shape` berisi `[banyak baris, banyak kolom]`.

Kata `await` wajib di depannya karena membaca berkas butuh waktu. Bab 12 menjelaskannya.

`read_csv` mengerjakan semua yang tadi kita lakukan dengan tangan, dan lebih banyak lagi:

- Mengenali pemisah koma, titik koma, atau tab.
- Mengubah kolom angka menjadi angka dan kolom tanggal ISO menjadi tanggal.
- Mengenali format Indonesia `1.250.000,50` dan tanggal `31/12/2024` atau `5 Januari 2024`.
- Menganggap sel kosong, `NA`, `-`, dan `null` sebagai nilai kosong.

```slak
const toko = await sl.read_csv("toko-nusantara.csv")
sl.write(toko.dtypes)    // tipe setiap kolom
```

Kamu belum perlu memahami DataFrame. Sampai Bab 13 kita mengubahnya menjadi larik objek biasa dengan `to_records()`, lalu mengolahnya dengan JavaScript murni:

```slak
const rows = (await sl.read_csv("toko-nusantara.csv")).to_records()
const total = rows.reduce((a, r) => a + r.total, 0)
sl.metric("Omzet 2023–2024", total, null, { format: "rp" })
sl.write(rows[0].tanggal instanceof Date)
```

Baris terakhir menunjukkan bahwa kolom `tanggal` sudah menjadi objek `Date`, siap dihitung.

### Opsi yang sering dipakai

```slak
const sebagian = await sl.read_csv("toko-nusantara.csv", { usecols: ["tanggal", "kota", "total"], nrows: 100 })
sl.write(sebagian.shape)
```

| Opsi | Fungsi |
|---|---|
| `sep` | Pemisah kolom, misalnya `";"` |
| `decimal` | Tanda desimal, misalnya `","` |
| `usecols` | Hanya membaca kolom tertentu |
| `nrows` | Hanya membaca sejumlah baris pertama |
| `dtype` | Memaksa tipe kolom, misalnya `{ kode: "str" }` |
| `parse_dates` | Kolom yang harus dibaca sebagai tanggal |

## 11.4 Di mana Slak mencari berkas

Browser melarang halaman yang dibuka dengan klik dua kali membaca berkas lain di komputer. Slak mengakalinya tanpa kamu mengubah kode. Saat kamu menulis `sl.read_csv("toko-nusantara.csv")`, Slak mencari berurutan:

1. **Berkas yang dibungkus**: `toko-nusantara.csv.js` di folder yang sama. Buat lewat Slak Studio (**Alat › Bungkus data**) atau `bungkus.html` dari paket Slak.
2. **Data di dalam halaman**, misalnya `<script type="text/csv" id="toko-nusantara.csv">`. Ekspor HTML Slak Studio memakai cara ini.
3. **Folder proyek**, saat kodemu dijalankan di Slak Studio.
4. **Hosting** atau server lokal, dengan cara biasa.
5. **Tombol pilih berkas.** Bila semua gagal, Slak meminta pengguna memilih berkasnya sekali dan mengingatnya di browser itu.

Folder bahan buku sudah berisi berkas `.csv.js` yang dibungkus, jadi semua contoh buku tetap jalan saat halaman buku dibuka dengan klik dua kali.

> **Catatan untuk pengguna playground**
> Playground tidak punya folder proyek. Saat contoh yang membaca `toko-nusantara.csv` dibuka di playground, Slak akan memintamu memilih berkasnya (bila playground dibuka dari komputer), atau kamu bisa mengunggahnya dengan `sl.file_uploader` seperti di 11.6. Cara paling nyaman untuk Tahap 2 dan 3 adalah halaman buku ini sendiri atau Slak Studio dengan folder bahan buku.

## 11.5 JSON

JSON (*JavaScript Object Notation*) adalah teks yang bentuknya persis seperti objek dan larik JavaScript. Karena itu JSON adalah format bawaan internet: hampir semua layanan data mengirim JSON.

```slak
const teks = '{"kota": "Ambon", "omzet": 1800000, "produk": ["Kopi", "Pala"]}'
const obj = JSON.parse(teks)          // teks → objek
sl.write(obj.produk[1])

const kembali = JSON.stringify({ kota: "Kupang", omzet: 950000 })   // objek → teks
sl.write(kembali)
sl.json(obj)
```

> **API Slak baru**
> - `sl.json(objek)` menampilkan objek atau larik dengan rapi dan bisa dilipat.
> - `await sl.read_json(nama)` membaca berkas JSON menjadi DataFrame.

Perbedaan JSON dengan objek JavaScript: nama properti **wajib** diapit tanda kutip ganda, dan tidak boleh ada fungsi, `undefined`, atau koma di akhir.

## 11.6 Berkas dari pengguna

Aplikasi analisis yang baik membiarkan pengguna memakai datanya sendiri.

```slak
const berkas = sl.file_uploader("Unggah CSV", { type: ["csv"] })
if (berkas) {
  const data = await sl.read_csv(berkas)
  sl.success(`${berkas.name}: ${data.shape[0]} baris, ${data.shape[1]} kolom`)
  sl.dataframe(data.head(10))
} else {
  sl.info("Pilih sebuah berkas CSV, misalnya cabang.csv dari bahan buku.")
}
```

> **API Slak baru**
> - `sl.file_uploader(label, { type })` mengembalikan objek berkas (`name`, `size`, `text`, `bytes`) atau `null` bila belum ada berkas. Berkasnya tidak pernah dikirim ke server mana pun; semuanya diproses di browser.

## 11.7 Seberapa besar data yang sanggup diolah browser?

Slak berjalan di browser, jadi memori yang tersedia adalah memori komputer atau ponsel pengunjung. Slak Data menetapkan batas resmi:

| Banyak baris | Rasanya |
|---|---|
| Sampai 100.000 baris (sekitar 5 MB CSV) | Nyaman, juga di laptop murah dan ponsel |
| 100.000 sampai 1.000.000 baris | Berat; Slak menampilkan peringatan dan menyarankan DuckDB atau SQL |
| Di atas 1.000.000 baris | Ringkas dulu dengan DuckDB (Bab 21), atau di luar Slak |

Data Toko Nusantara yang kita pakai jauh di bawah batas nyaman. Versi besarnya (250 ribu baris) dipakai di Bab 12 dan Bab 21 untuk merasakan bedanya.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| `await is only valid in async functions` | `await` dipakai di dalam fungsi biasa | Tambah `async` di depan fungsinya (Bab 12) |
| Muncul permintaan memilih berkas | Halaman dibuka dengan klik dua kali dan tidak ada `.csv.js` | Bungkus datanya, atau buka lewat Slak Studio atau hosting |
| Semua angka terbaca sebagai teks di cara manual | CSV tidak menyimpan tipe | Ubah dengan `Number(...)`, atau pakai `sl.read_csv` |
| `Unexpected token` di `JSON.parse` | Teks bukan JSON yang sah, misalnya kutip tunggal | Periksa kutip ganda dan koma |

## Latihan

**Latihan 11.1 (mudah).** Ubah teks CSV berikut menjadi larik objek `produk`, dengan kolom `harga` berupa angka.

```slak latihan
const csv = `nama,harga
Kopi Wamena,85000
Sagu Lempeng,30000
Sambal Roa,45000`

const produk = []   // ganti

sl.write(produk)
await sl.testing.test("ada 3 produk", () => sl.testing.expect(produk).toHaveLength(3))
await sl.testing.test("harga berupa angka", () => sl.testing.expect(produk[1]).toEqual({ nama: "Sagu Lempeng", harga: 30000 }))
```

**Latihan 11.2 (sedang).** Baca `cabang.csv`, lalu buat larik `kotaPapua` berisi nama kota cabang yang provinsinya diawali kata "Papua".

```slak latihan

const kotaPapua = []   // ganti

sl.write(kotaPapua)
await sl.testing.test("tiga kota di tanah Papua", () => sl.testing.expect(kotaPapua).toEqual(["Jayapura", "Sorong", "Manokwari"]))
```

**Latihan 11.3 (tantangan).** Simpan objek `laporan` sebagai teks JSON di `teks`, lalu baca kembali ke `salinan`. Pastikan `salinan` setara dengan aslinya tetapi bukan objek yang sama.

```slak latihan
const laporan = { bulan: "2024-04", omzet: 48250000, cabang: ["Jayapura", "Sorong"] }
const teks = ""
const salinan = null

await sl.testing.test("teks adalah JSON", () => sl.testing.expect(teks.startsWith("{")).toBe(true))
await sl.testing.test("isi salinan sama", () => sl.testing.expect(salinan).toEqual(laporan))
await sl.testing.test("bukan objek yang sama", () => sl.testing.expect(salinan === laporan).toBe(false))

`JSON.parse(JSON.stringify(x))` adalah cara singkat menyalin objek sampai ke isi terdalamnya.

## Mini-proyek: penampil CSV apa pun

```slak
sl.title("Penampil CSV :page_facing_up:")

const unggahan = sl.file_uploader("Pilih berkas CSV", { type: ["csv", "tsv", "txt"] })
const contoh = sl.checkbox("Pakai contoh: toko-nusantara.csv", { value: !unggahan })

let df = null
if (unggahan) df = await sl.read_csv(unggahan)
else if (contoh) df = await sl.read_csv("toko-nusantara.csv")

if (!df) {
  sl.info("Unggah berkas, atau centang contoh di atas.")
} else {
  const rows = df.to_records()
  const kolom = df.columns

  const [a, b, c] = sl.columns(3)
  a.metric("Baris", rows.length)
  b.metric("Kolom", kolom.length)
  c.metric("Sel kosong", rows.reduce((n, r) => n + kolom.filter(k => r[k] == null).length, 0))

  const dipilih = sl.multiselect("Kolom yang ditampilkan", kolom, { default: kolom.slice(0, 6) })
  const banyak = sl.slider("Banyak baris", 5, 100, 20, 5)
  sl.dataframe(rows.slice(0, banyak).map(r => Object.fromEntries(dipilih.map(k => [k, r[k]]))))
}
```

`df.columns` berisi larik nama kolom. `Object.fromEntries` adalah kebalikan dari `Object.entries`: larik pasangan `[nama, nilai]` menjadi objek.

<script type="text/markdown" id="bab-12">
# Bab 12 · Asinkron dan Mengambil Data

> **Tujuan belajar**
> - Memahami mengapa sebagian pekerjaan tidak selesai seketika.
> - Memakai Promise, `async`, dan `await`.
> - Mengambil data dari internet dengan `fetch` dan `sl.read_url`.
> - Memakai dataset bawaan Slak dan dataset terbuka: GitHub, Kaggle, Hugging Face, Bank Dunia, dan katalog data terbuka.
> - Membaca Google Sheets dan berkas Excel.
> - Menampilkan proses yang lama dengan `sl.spinner` dan `sl.progress`, serta mengenal `sl.worker`.

## 12.1 Memesan makanan

Bayangkan kamu memesan kopi di kedai. Kasir tidak menyuruhmu berdiri diam di depan mesin sampai kopinya jadi. Kamu diberi **nomor antrean**, lalu bebas duduk. Saat kopinya siap, nomormu dipanggil.

Mengambil data dari internet atau membaca berkas besar bekerja dengan cara yang sama. Pekerjaannya butuh waktu, dan JavaScript tidak mau seluruh halaman membeku selama menunggu. Maka fungsi seperti `fetch` tidak langsung mengembalikan data. Ia mengembalikan **Promise**, semacam nomor antrean: janji bahwa hasilnya akan datang nanti.

```slak
const janji = sl.sleep(500)   // menunggu setengah detik, mengembalikan Promise
sl.write(janji instanceof Promise)
```

## 12.2 await: tunggu sampai siap

`await` berarti "tunggu janji ini terpenuhi, lalu berikan hasilnya".

```slak
sl.write("Memesan kopi…")
await sl.sleep(1000)
sl.write("Kopi siap :coffee:")
```

Tanpa `await`, baris ketiga langsung jalan tanpa menunggu.

Di skrip Slak, `await` boleh langsung dipakai di tingkat atas. Di dalam fungsi, fungsinya harus ditandai `async`:

```slak
async function hargaKopi() {
  await sl.sleep(300)          // pura-pura bertanya ke server
  return 85000
}

const harga = await hargaKopi()
sl.write(`Harga kopi: ${harga}`)
```

Fungsi `async` **selalu** mengembalikan Promise, jadi pemanggilnya juga perlu `await`.

### Menunggu beberapa hal sekaligus

Bila tiga pesanan tidak saling bergantung, jangan tunggu satu per satu. `Promise.all` menunggu semuanya bersamaan:

```slak
const t0 = performance.now()
const [a, b, c] = await Promise.all([sl.sleep(400), sl.sleep(400), sl.sleep(400)])
sl.write(`Selesai dalam ${Math.round(performance.now() - t0)} md, bukan 1200 md`)
```

## 12.3 fetch: mengambil dari internet

`fetch` adalah fungsi bawaan browser untuk mengambil apa pun dari internet. Contoh berikut **butuh internet**: ia mengambil jumlah penduduk Indonesia dari API Bank Dunia.

```slak
try {
  const url = "https://api.worldbank.org/v2/country/IDN/indicator/SP.POP.TOTL?format=json&date=2019:2023"
  const respons = await fetch(url)
  const json = await respons.json()      // dua kali menunggu: header, lalu isi
  const baris = json[1].map(r => ({ tahun: r.date, penduduk: r.value }))
  sl.table(baris)
} catch (e) {
  sl.warning("Tidak bisa mengambil data: " + e.message)
}
```

Perhatikan dua `await`: pertama menunggu jawaban server datang, kedua menunggu isinya selesai dibaca. Bungkus selalu dengan `try...catch`, karena internet bisa putus kapan saja.

Untuk CSV, JSON, Excel, atau zip di alamat mana pun, `sl.read_url` lebih praktis karena langsung menghasilkan DataFrame:

```slak
try {
  const df = await sl.read_url("https://raw.githubusercontent.com/plotly/datasets/master/2014_usa_states.csv")
  sl.write(`${df.shape[0]} baris`)
  sl.dataframe(df.head(5))
} catch (e) {
  sl.warning(e.message)
}
```

> **API Slak baru**
> - `await sl.read_url(alamat)` membaca CSV, TSV, JSON, Excel, atau zip dari alamat web dan mengembalikan DataFrame.

Beberapa server menolak dibaca dari halaman web lain (aturan keamanan browser bernama CORS). Bila itu terjadi, Slak menampilkan pesan yang menjelaskannya.

## 12.4 Dataset bawaan dan dataset terbuka

Slak menyediakan dua jenis sumber data siap pakai.

**Dataset bawaan** ada di dalam `slak-data.js`, selalu tersedia tanpa internet:

```slak
sl.dataframe(sl.datasets())
```

**Dataset terbuka** diunduh dari sumbernya saat dipakai, lalu disimpan di browser selama 7 hari sehingga tetap jalan saat internet putus:

| Fungsi | Sumber | Contoh |
|---|---|---|
| `sl.open_data` | Katalog 15 dataset pilihan beserta lisensinya | `await sl.open_data("penguins")` |
| `sl.github` | Berkas di GitHub | `await sl.github("plotly/datasets/2014_usa_states.csv")` |
| `sl.worldbank` | Indikator Bank Dunia | `await sl.worldbank("SP.POP.TOTL", { negara: ["IDN"] })` |
| `sl.huggingface` | Dataset Hugging Face | `await sl.huggingface("scikit-learn/iris", { file: "Iris.csv" })` |
| `sl.kaggle` | Dataset Kaggle | `await sl.kaggle("uciml/iris", { file: "Iris.csv" })` |

```slak
try {
  const katalog = sl.open_data.list()
  sl.dataframe(katalog.select(["id", "judul", "baris", "lisensi"]))
} catch (e) {
  sl.warning(e.message)
}
```

Selalu periksa kolom **lisensi** sebelum memakai data untuk tujuan komersial atau portofolio. Beberapa dataset klasik tidak menyatakan lisensi di sumbernya.

Kaggle tidak mengizinkan browser mengunduh langsung. Di Slak Studio, unduhan berjalan biasa. Di browser biasa, Slak memintamu memilih berkas zip yang kamu unduh sendiri dari situs Kaggle, lalu mengingatnya.

### Bank Dunia untuk Indonesia

```slak
try {
  const wb = await sl.worldbank("NY.GDP.PCAP.CD", { negara: ["IDN"], tahun: [2010, 2023] })
  const rows = wb.to_records().filter(r => r.nilai != null)
  sl.line_chart(rows, { x: "tahun", y: "nilai", title: "PDB per kapita Indonesia (US$)" })
} catch (e) {
  sl.warning("Butuh internet: " + e.message)
}
```

> **API Slak baru**
> - `sl.open_data(id)`, `sl.open_data.list()`, `sl.github(jalur)`, `sl.worldbank(indikator, { negara, tahun })`, `sl.huggingface(dataset, { file })`, `sl.kaggle(dataset, { file })` mengambil dataset terbuka sebagai DataFrame. Semuanya ada di `slak-data.js`.
> - `sl.datasets()` menampilkan daftar dataset bawaan.
> - `sl.line_chart(data, { x, y, title })` menggambar grafik garis. Grafik dibahas di Bab 16.

Supaya aplikasi tetap jalan di komputer mana pun tanpa internet, tambahkan `sl.offline_button()`. Tombol itu mengunduh data sebagai berkas `.csv.js`; taruh di folder halaman, dan data dibaca dari sana.

## 12.5 Google Sheets dan Excel

Banyak data kantor tinggal di Google Sheets. Bagikan lembarnya sebagai **Siapa saja yang memiliki link dapat melihat**, lalu:

```slak tanpa-jalan lewati
const df = await sl.read_sheets("https://docs.google.com/spreadsheets/d/ID-LEMBAR-KAMU/edit")
sl.dataframe(df)
```

`sl.read_sheets` tetap jalan saat halaman dibuka dengan klik dua kali, asalkan ada internet.

Berkas Excel dibaca tanpa pustaka tambahan:

```slak tanpa-jalan lewati
const laporan = await sl.read_excel("laporan.xlsx", { sheet: "Penjualan" })
const lembar = await sl.excel_sheets("laporan.xlsx")   // daftar nama lembar
```

## 12.6 Memberi tahu pengguna bahwa kamu sedang bekerja

Pengguna yang melihat layar diam akan mengira aplikasimu rusak. Tunjukkan bahwa sesuatu sedang dikerjakan.

```slak
const angka = await sl.spinner("Menghitung omzet…", async () => {
  await sl.sleep(800)
  return 48250000
})
sl.metric("Omzet", angka, null, { format: "rp" })
```

```slak
if (sl.button("Proses data")) {
  const bar = sl.progress(0, "Mulai…")
  const langkah = ["Membaca", "Membersihkan", "Meringkas", "Menggambar"]
  for (let i = 0; i < langkah.length; i++) {
    await sl.sleep(400)
    bar.progress((i + 1) * 25, langkah[i])
  }
  sl.success("Selesai")
}
```

> **API Slak baru**
> - `await sl.spinner(teks, fungsiAsync)` menampilkan putaran selama fungsi bekerja, lalu mengembalikan hasilnya.
> - `sl.progress(nilai, teks)` menampilkan bilah kemajuan berskala 0–100. Perbarui dengan `.progress(nilai, teks)`.

## 12.7 Pekerjaan berat di latar belakang

JavaScript di halaman bekerja di satu jalur. Saat ada hitungan berat, misalnya memproses ratusan ribu baris, halaman ikut membeku: tombol tidak bisa diklik, penggeser tidak bisa digeser.

Kabar baiknya, `sl.read_csv` sudah menangani ini sendiri. Untuk berkas di atas 5 MB, pekerjaan mengurai teks, angka, dan tanggal otomatis dipindah ke **Web Worker**, jalur kedua di belakang layar. Hasilnya sama persis, dan halaman hanya membeku sesaat.

```slak
if (sl.button("Muat 250 ribu transaksi")) {
  const t0 = performance.now()
  const besar = await sl.spinner("Membaca toko-nusantara-besar.csv…", () => sl.read_csv("toko-nusantara-besar.csv"))
  sl.success(`${besar.shape[0].toLocaleString("id-ID")} baris dibaca dalam ${((performance.now() - t0) / 1000).toFixed(1)} detik`)
}
```

Contoh ini butuh `toko-nusantara-besar.csv` (29 MB) dari bahan buku di folder yang sama. Berkas itu tidak dibungkus menjadi `.csv.js` karena terlalu besar; buka halaman buku lewat Slak Studio atau hosting, atau pilih berkasnya saat diminta.

> **Fitur eksperimental: `sl.worker`**
> Untuk hitunganmu sendiri, Slak 1.9 menyediakan `sl.worker(fungsi, ...data)`. Di daftar API stabil, fungsi ini berlabel **eksperimental**: cara pakainya boleh berubah sebelum Slak 2.0. Pakai bila memang butuh, dan periksa catatan rilis saat memperbarui Slak.
>
> Aturannya: fungsi dikirim ke worker sebagai teks, jadi ia **tidak boleh memakai variabel dari luar fungsi**, termasuk `sl`. Semua yang dibutuhkan dikirim sebagai argumen. DataFrame dikirim sebagai larik objek. Bila browser menolak worker, fungsinya dijalankan biasa.

```slak
const df = sl.dataset("penjualan")
const besarSekali = await sl.worker((rows, batas) => rows.filter(r => r.total > batas), df, 500000)
sl.write(`${besarSekali.length} transaksi di atas 500 ribu`)
sl.dataframe(sl.DataFrame(besarSekali).head(5))
```

> **Coba di playground**
> Ganti `penguins` di contoh katalog dengan `id` lain dari daftar `sl.open_data.list()`, lalu lihat kolom-kolomnya.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Muncul `[object Promise]` | Lupa `await` | Tulis `await` di depan pemanggilan |
| `await is only valid in async functions` | `await` di dalam fungsi biasa | Tandai fungsinya `async` |
| `Failed to fetch` | Tidak ada internet, alamat salah, atau server menolak (CORS) | Periksa alamat; bungkus dengan `try...catch` |
| `sl.worker`: `x is not defined` | Fungsi worker memakai variabel dari luar | Kirim semua yang dibutuhkan sebagai argumen |

## Latihan

**Latihan 12.1 (mudah).** Fungsi `ambilStok` mengembalikan Promise. Ambil hasilnya ke `stok`.

```slak latihan
async function ambilStok() {
  await sl.sleep(100)
  return 24
}
const stok = ambilStok()   // perbaiki

sl.write(stok)
await sl.testing.test("stok = 24", () => sl.testing.expect(stok).toBe(24))
```

**Latihan 12.2 (sedang).** Jalankan ketiga fungsi bersamaan dengan `Promise.all`, lalu jumlahkan hasilnya ke `total`. Uji kedua memeriksa bahwa waktunya kurang dari 500 md.

```slak latihan
const omzetCabang = async (n) => { await sl.sleep(300); return n }
const t0 = performance.now()

const total = 0   // ganti: tunggu omzetCabang(100), omzetCabang(200), omzetCabang(300) bersamaan

const lama = performance.now() - t0
await sl.testing.test("total = 600", () => sl.testing.expect(total).toBe(600))
await sl.testing.test("berjalan bersamaan", () => sl.testing.expect(lama).toBeLessThan(500))
```

**Latihan 12.3 (tantangan).** Lengkapi `ambilAman(fn)` yang menjalankan fungsi async `fn` dan mengembalikan hasilnya, atau `null` bila `fn` melempar galat.

```slak latihan
async function ambilAman(fn) {
  return await fn()
}

const berhasil = async () => "data"
const gagal = async () => { throw new Error("internet putus") }

await sl.testing.test("berhasil → data", async () => sl.testing.expect(await ambilAman(berhasil)).toBe("data"))
await sl.testing.test("gagal → null", async () => sl.testing.expect(await ambilAman(gagal)).toBeNull())
```

## Mini-proyek: Indonesia dalam angka

Aplikasi ini **butuh internet**. Ia mengambil tiga indikator Bank Dunia sekaligus, lalu menampilkan perkembangan Indonesia dibanding negara tetangga.

```slak
sl.title("Indonesia dalam Angka :earth_asia:")

const INDIKATOR = {
  "PDB per kapita (US$)": "NY.GDP.PCAP.CD",
  "Penduduk": "SP.POP.TOTL",
  "Pengguna internet (% penduduk)": "IT.NET.USER.ZS"
}

const pilih = sl.selectbox("Indikator", Object.keys(INDIKATOR))
const negara = sl.multiselect("Bandingkan dengan", ["MYS", "PHL", "THA", "VNM"], { default: ["MYS", "VNM"] })

try {
  const df = await sl.spinner("Mengambil data Bank Dunia…", () =>
    sl.worldbank(INDIKATOR[pilih], { negara: ["IDN", ...negara], tahun: [2005, 2023] }))
  const rows = df.to_records().filter(r => r.nilai != null)

  const idn = rows.filter(r => r.kode === "IDN").sort((a, b) => a.tahun - b.tahun)
  const awal = idn[0], akhir = idn[idn.length - 1]
  sl.metric(`${pilih}, ${akhir.tahun}`, Math.round(akhir.nilai * 10) / 10,
    `${((akhir.nilai / awal.nilai - 1) * 100).toFixed(0)}% sejak ${awal.tahun}`)

  sl.line_chart(rows, { x: "tahun", y: "nilai", color: "negara" })
  sl.caption("Sumber: Bank Dunia, World Development Indicators.")
} catch (e) {
  sl.warning("Data tidak bisa diambil. Periksa koneksi internet. " + e.message)
}
```

Kode negara yang dipakai Bank Dunia: IDN Indonesia, MYS Malaysia, PHL Filipina, THA Thailand, VNM Vietnam.

<script type="text/markdown" id="bab-13">
# Bab 13 · Membersihkan Data dengan JavaScript Murni

> **Tujuan belajar**
> - Memeriksa kualitas data: nilai kosong, duplikat, format campur, salah ketik, dan pencilan.
> - Menulis fungsi pembersih yang bisa dipakai ulang dengan JavaScript murni.
> - Menyeragamkan teks, angka, dan tanggal.
> - Memperbaiki sel secara manual dengan tabel yang bisa diedit.

Kata orang, 80% pekerjaan analis data adalah membersihkan data. Angka itu tidak berlebihan. Data dari kasir, formulir, atau gabungan beberapa cabang hampir selalu berantakan, dan analisis dari data kotor menghasilkan kesimpulan yang salah.

Di bab ini kamu membersihkan `toko-nusantara-kotor.csv` dengan JavaScript murni: `map`, `filter`, objek, dan teks. Di bab berikutnya kamu mengulang semua langkah ini dengan Slak Data, dalam jauh lebih sedikit baris.

## 13.1 Kenali dulu kotorannya

```slak
const mentah = (await sl.read_csv("toko-nusantara-kotor.csv")).to_records()
sl.write(`${mentah.length} baris`)
sl.code(JSON.stringify(mentah.slice(0, 6), null, 1))
```

`JSON.stringify(x, null, 1)` menampilkan isi data **apa adanya**, termasuk spasi dan tanda kutip, sehingga kotorannya terlihat jelas. Tabel `sl.dataframe` sengaja merapikan tampilan, jadi untuk memeriksa data mentah, lihat teksnya.

Mari menghitung masalahnya satu per satu:

```slak
const data = (await sl.read_csv("toko-nusantara-kotor.csv")).to_records()
const kolom = Object.keys(data[0])

const kosong = {}
for (const k of kolom) kosong[k] = data.filter(r => r[k] == null || r[k] === "").length
sl.write("Nilai kosong per kolom:")
sl.json(kosong)

const id = data.map(r => r.id_transaksi)
sl.write(`ID ganda: ${id.length - new Set(id).size}`)

const ejaanKota = [...new Set(data.map(r => r.kota))]
sl.write(`Ejaan kota yang berbeda: ${ejaanKota.length}`)
sl.code(JSON.stringify(ejaanKota))

const contohHarga = [...new Set(data.map(r => typeof r.harga))]
sl.write(`Tipe kolom harga: ${contohHarga.join(", ")}`)
```

- `new Set(larik)` membuat himpunan: nilai yang sama hanya disimpan sekali. `set.size` adalah banyaknya nilai unik.
- `[...new Set(larik)]` mengubahnya kembali menjadi larik berisi nilai-nilai unik.

Hanya tiga kota, tetapi ejaannya lebih dari sepuluh. Ada transaksi ganda, nilai kosong, dan harga yang sebagian berupa teks `"Rp 42.000"`. Daftar pekerjaan kita:

1. Rapikan teks: spasi berlebih dan huruf besar-kecil.
2. Seragamkan nama kota, termasuk salah ketik.
3. Ubah harga menjadi angka.
4. Ubah tanggal menjadi `Date`, dari tiga format berbeda.
5. Tangani nilai kosong.
6. Buang transaksi ganda.
7. Tangani pencilan.

## 13.2 Fungsi pembersih teks

```slak
function rapikan(teks) {
  if (teks == null) return null
  return String(teks).trim().replace(/\s+/g, " ")
}

function hurufJudul(teks) {
  if (teks == null) return null
  return rapikan(teks).toLowerCase().split(" ")
    .map(kata => kata.charAt(0).toUpperCase() + kata.slice(1))
    .join(" ")
}

sl.write(`[${rapikan("  Kopi   Wamena ")}]`)
sl.write(hurufJudul("  GELANG manik papua "))
```

`/\s+/g` adalah pola untuk "satu atau lebih spasi". Menggantinya dengan satu spasi merapikan spasi ganda di tengah teks.

## 13.3 Menyeragamkan nama kota

Setelah huruf judul, sisa masalahnya adalah salah ketik. Untuk itu, buat **kamus perbaikan**: objek yang memetakan ejaan salah ke ejaan benar.

```slak
const PERBAIKAN_KOTA = { Jayapra: "Jayapura", Makasar: "Makassar", Surabya: "Surabaya" }

function normalKota(teks) {
  if (teks == null) return null
  const t = teks.trim().toLowerCase().replace(/^\w/, c => c.toUpperCase())
  return PERBAIKAN_KOTA[t] || t
}

for (const k of ["jayapura", " Jayapura", "JAYAPURA", "Jayapra", "makassar ", "Makasar", " SURABAYA "]) {
  sl.write(`"${k}" → ${normalKota(k)}`)
}
```

`PERBAIKAN_KOTA[t] || t` berarti "ambil perbaikannya bila ada, bila tidak pakai `t` itu sendiri". Kamus seperti ini lebih mudah dirawat daripada deretan `if`: menambah perbaikan baru cukup menambah satu pasangan.

## 13.4 Angka dari teks

Kamu sudah menulis fungsi ini di Latihan 8.2. Kini tambahkan penanganan nilai kosong:

```slak
function keAngka(x) {
  if (x == null || x === "") return null
  if (typeof x === "number") return x
  const bersih = String(x).replace(/[^0-9,-]/g, "").replace(",", ".")
  const n = Number(bersih)
  return Number.isNaN(n) ? null : n
}

sl.write(keAngka("Rp 42.000"))
sl.write(keAngka(31500))
sl.write(keAngka("Rp 1.250.000,50"))
sl.write(keAngka(""))
```

Titik ribuan dibuang, dan koma desimal diganti titik supaya dipahami JavaScript.

## 13.5 Tanggal dari tiga format

Kolom `tanggal` berisi tiga gaya: `2024-02-14`, `14/02/2024`, dan `14 Februari 2024`. Fungsi berikut mengenali ketiganya dan selalu mengembalikan `Date`.

```slak
const BULAN = ["januari", "februari", "maret", "april", "mei", "juni", "juli",
               "agustus", "september", "oktober", "november", "desember"]

function keTanggal(teks) {
  if (teks == null || teks === "") return null
  const t = String(teks).trim()
  let m
  if ((m = t.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return new Date(+m[1], +m[2] - 1, +m[3])
  if ((m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return new Date(+m[3], +m[2] - 1, +m[1])
  if ((m = t.match(/^(\d{1,2}) (\w+) (\d{4})$/))) {
    const b = BULAN.indexOf(m[2].toLowerCase())
    if (b >= 0) return new Date(+m[3], b, +m[1])
  }
  return null
}

const fmt = new Intl.DateTimeFormat("id-ID", { dateStyle: "medium" })
for (const x of ["2024-02-14", "14/02/2024", "14 Februari 2024", "kemarin"]) {
  const d = keTanggal(x)
  sl.write(`${x} → ${d ? fmt.format(d) : "tidak dikenali"}`)
}
```

Hal baru di sini:

- `t.match(pola)` mencocokkan teks dengan pola dan mengembalikan bagian-bagiannya. `\d{4}` berarti empat angka, dan bagian dalam kurung biasa ditangkap ke `m[1]`, `m[2]`, dan seterusnya.
- `+m[1]` adalah cara singkat mengubah teks menjadi angka, sama dengan `Number(m[1])`.
- `new Date(tahun, bulan, tanggal)` membuat tanggal di zona waktu setempat. Ingat, bulannya dihitung dari 0.

Fungsi yang tidak mengenali format mengembalikan `null`, bukan menebak. Lebih baik jujur "tidak tahu" daripada diam-diam salah.

## 13.6 Nilai kosong, duplikat, dan pencilan

Untuk nilai kosong, tidak ada satu jawaban yang selalu benar. Pilih sesuai arti kolomnya:

| Kolom | Keputusan | Alasan |
|---|---|---|
| `kanal` kosong | Isi `"Tidak diketahui"` | Transaksinya tetap sah; kanalnya saja yang tidak tercatat |
| `jumlah` kosong | Buang barisnya | Tanpa jumlah, omzetnya tidak bisa dihitung |
| `harga` tidak terbaca | Buang barisnya | Sama seperti di atas |

Transaksi ganda dikenali dari `id_transaksi`. Simpan yang pertama, buang sisanya:

```slak
function buangGanda(data, kunci) {
  const sudah = new Set()
  return data.filter(r => {
    if (sudah.has(r[kunci])) return false
    sudah.add(r[kunci])
    return true
  })
}

const contoh = [{ id: "A", n: 1 }, { id: "B", n: 2 }, { id: "A", n: 1 }]
sl.write(buangGanda(contoh, "id"))
```

**Pencilan** (outlier) adalah nilai yang jauh berbeda dari kebanyakan data. Di data kita ada beberapa transaksi dengan `jumlah` 250, padahal pembeli biasanya membeli 1 sampai 5 barang. Kemungkinan besar salah ketik. Untuk sekarang kita pakai aturan sederhana: jumlah di atas 50 dianggap salah dan dibuang. Bab 19 mengajarkan cara menentukan batasnya secara statistik dengan metode IQR.

Selalu **catat** keputusan pembersihanmu. Orang yang membaca laporanmu berhak tahu berapa baris yang dibuang dan mengapa.

## 13.7 Menyatukan semuanya

```slak
const BLN = ["januari", "februari", "maret", "april", "mei", "juni", "juli", "agustus", "september", "oktober", "november", "desember"]
const KOTA = { Jayapra: "Jayapura", Makasar: "Makassar", Surabya: "Surabaya" }

const rapi = t => t == null ? null : String(t).trim().replace(/\s+/g, " ")
const judul = t => t == null ? null : rapi(t).toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase())
const kota = t => { const j = judul(t); return KOTA[j] || j }
const angka = x => {
  if (x == null || x === "") return null
  if (typeof x === "number") return x
  const n = Number(String(x).replace(/[^0-9,-]/g, "").replace(",", "."))
  return Number.isNaN(n) ? null : n
}
const tanggal = t => {
  if (t == null) return null
  const s = String(t).trim(); let m
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return new Date(+m[1], +m[2] - 1, +m[3])
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return new Date(+m[3], +m[2] - 1, +m[1])
  if ((m = s.match(/^(\d{1,2}) (\w+) (\d{4})$/)) && BLN.includes(m[2].toLowerCase())) return new Date(+m[3], BLN.indexOf(m[2].toLowerCase()), +m[1])
  return null
}

function bersihkan(data) {
  const catatan = []
  let hasil = data.map(r => ({
    id_transaksi: rapi(r.id_transaksi),
    tanggal: tanggal(r.tanggal),
    kota: kota(r.kota),
    kanal: rapi(r.kanal) || "Tidak diketahui",
    kategori: rapi(r.kategori),
    produk: judul(r.produk),
    jumlah: angka(r.jumlah),
    harga: angka(r.harga)
  }))

  const n0 = hasil.length
  hasil = hasil.filter(r => r.jumlah != null && r.harga != null && r.tanggal != null)
  catatan.push(`${n0 - hasil.length} baris dibuang karena jumlah, harga, atau tanggal kosong`)

  const n1 = hasil.length
  const sudah = new Set()
  hasil = hasil.filter(r => !sudah.has(r.id_transaksi) && sudah.add(r.id_transaksi))
  catatan.push(`${n1 - hasil.length} transaksi ganda dibuang`)

  const n2 = hasil.length
  hasil = hasil.filter(r => r.jumlah <= 50)
  catatan.push(`${n2 - hasil.length} pencilan jumlah (> 50) dibuang`)

  hasil = hasil.map(r => ({ ...r, total: r.jumlah * r.harga }))
  return { hasil, catatan }
}

const mentah = (await sl.read_csv("toko-nusantara-kotor.csv")).to_records()
const { hasil, catatan } = bersihkan(mentah)

sl.write(`Dari ${mentah.length} baris menjadi ${hasil.length} baris bersih.`)
for (const c of catatan) sl.markdown(`- ${c}`)
sl.write(`Kota: ${[...new Set(hasil.map(r => r.kota))].join(", ")}`)
sl.dataframe(hasil.slice(0, 8))
```

Dua trik di dalam `bersihkan`:

- `.replace(/(^|\s)\S/g, c => c.toUpperCase())` membesarkan huruf pertama setiap kata dalam satu langkah.
- `!sudah.has(id) && sudah.add(id)` memeriksa sekaligus mencatat. `add` mengembalikan himpunannya sendiri, yang selalu dianggap benar.

Fungsi `bersihkan` bisa dipakai ulang untuk data bulan depan dengan format yang sama. Itulah gunanya menulis pembersihan sebagai fungsi, bukan langkah sekali jalan.

## 13.8 Memperbaiki dengan tangan

Kadang perbaikan paling cepat adalah mengedit beberapa sel langsung, seperti di Excel. `sl.data_editor` menampilkan tabel yang bisa diedit dan mengembalikan data hasil editan.

```slak
const stokAwal = [
  { produk: "Kopi Arabika Wamena 250g", stok: 24, rak: "A1" },
  { produk: "Keripik keladi", stok: null, rak: "B3" },
  { produk: "Sabun Sereh Wangi", stok: 50, rak: "" }
]

const diedit = sl.data_editor(stokAwal, { num_rows: "dynamic", key: "edit-stok" })
const belumLengkap = diedit.filter(r => r.stok == null || !r.rak).length
sl.caption(belumLengkap ? `${belumLengkap} baris belum lengkap` : "Semua baris lengkap")
```

> **API Slak baru**
> - `sl.data_editor(data, { num_rows })` menampilkan tabel yang bisa diedit, lalu mengembalikan larik hasil editan. `num_rows: "dynamic"` mengizinkan pengguna menambah dan menghapus baris.

Klik dua kali sel kosong, isi nilainya, lalu tekan Enter. Keterangan di bawahnya langsung berubah.

> **Coba di playground**
> Tambahkan `"Surabya": "Surabaya"` yang sudah ada di kamus dengan ejaan salah baru, misalnya `"Jaya Pura": "Jayapura"`. Ingat bahwa kuncinya harus ditulis dalam bentuk setelah `hurufJudul`.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Kota yang sama terhitung dua kali | Beda spasi atau huruf besar-kecil | Rapikan dan seragamkan sebelum mengelompokkan |
| Hasil penjumlahan menjadi `NaN` | Ada satu harga yang tidak terbaca | Ubah dengan fungsi yang mengembalikan `null`, lalu saring |
| Tanggal 03/04 terbaca 4 Maret | Format bulan-hari ala Amerika | Tentukan sendiri urutannya, seperti di `keTanggal` |
| Baris hilang terlalu banyak | Aturan pembersihan terlalu ketat | Hitung dan catat yang dibuang di setiap langkah |

const { test, expect } = sl.testing

**Latihan 13.2 (sedang).** Lengkapi `buangGanda(data)` yang membuang baris dengan `id` ganda, **menyimpan yang terakhir**, bukan yang pertama. Urutan hasil boleh mengikuti kemunculan terakhir.

```slak latihan
function buangGanda(data) {
  return data
}

const d = [{ id: 1, v: "lama" }, { id: 2, v: "x" }, { id: 1, v: "baru" }]
await sl.testing.test("tersisa 2 baris", () => sl.testing.expect(buangGanda(d)).toHaveLength(2))

**Latihan 13.3 (tantangan).** Tambahkan format keempat ke `keTanggal`: `"2024.02.14"` (titik). Fungsi harus tetap mengenali format ISO.

```slak latihan
function keTanggal(t) {
  let m
  if ((m = t.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return new Date(+m[1], +m[2] - 1, +m[3])
  return null
}

const iso = d => d ? `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}` : null
await sl.testing.test("ISO tetap jalan", () => sl.testing.expect(iso(keTanggal("2024-02-14"))).toBe("2024-2-14"))

## Mini-proyek: laporan sebelum dan sesudah

Buat laporan yang menunjukkan kualitas data sebelum dan sesudah dibersihkan, lengkap dengan dampaknya pada angka omzet. Laporan seperti ini membuat atasan atau klien percaya pada analisismu.

```slak
sl.title("Laporan Kebersihan Data :broom:")

const KAMUS = { Jayapra: "Jayapura", Makasar: "Makassar", Surabya: "Surabaya" }
const judul = t => t == null ? null : String(t).trim().replace(/\s+/g, " ").toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase())
const angka = x => x == null || x === "" ? null : typeof x === "number" ? x : Number(String(x).replace(/[^0-9]/g, ""))

const mentah = (await sl.read_csv("toko-nusantara-kotor.csv")).to_records()

const sudah = new Set()
const bersih = mentah
  .map(r => ({ id: r.id_transaksi, kota: KAMUS[judul(r.kota)] || judul(r.kota), jumlah: angka(r.jumlah), harga: angka(r.harga) }))
  .filter(r => r.jumlah != null && r.harga != null)
  .filter(r => !sudah.has(r.id) && sudah.add(r.id))
  .filter(r => r.jumlah <= 50)
  .map(r => ({ ...r, total: r.jumlah * r.harga }))

const omzetMentah = mentah.reduce((a, r) => a + (Number(r.jumlah) || 0) * (angka(r.harga) || 0), 0)
const omzetBersih = bersih.reduce((a, r) => a + r.total, 0)

const [a, b, c] = sl.columns(3)
a.metric("Baris", bersih.length, `${bersih.length - mentah.length} dari mentah`)
b.metric("Ejaan kota", new Set(bersih.map(r => r.kota)).size, `${new Set(bersih.map(r => r.kota)).size - new Set(mentah.map(r => r.kota)).size}`)
c.metric("Omzet", omzetBersih, null, { format: "rp" })

sl.warning(`Bila data tidak dibersihkan, omzet terhitung ${Math.round((omzetMentah / omzetBersih - 1) * 100)}% lebih tinggi dari sebenarnya, karena transaksi ganda dan salah ketik jumlah.`)

const perKota = {}
for (const r of bersih) perKota[r.kota] = (perKota[r.kota] || 0) + r.total
sl.table(Object.entries(perKota).map(([kota, omzet]) => ({ kota, omzet })))
```

Kalimat peringatan di laporan ini adalah temuan yang sesungguhnya. Data kotor tidak hanya jelek dilihat; ia membuat angka keputusan menjadi salah.

<script type="text/markdown" id="bab-14">
# Bab 14 · Dari JavaScript Murni ke Slak Data

> **Tujuan belajar**
> - Mengenal `sl.DataFrame` dan `sl.Series`, tabel dan kolom gaya pandas.
> - Mengulang semua langkah Bab 13 dengan Slak Data.
> - Memilih kolom, menyaring, mengurutkan, dan menambah kolom.
> - Melihat isi dan ringkasan data dengan `head`, `info`, `describe`, dan `shape`.
> - Menimbang kapan memakai JavaScript murni dan kapan memakai Slak Data.

## 14.1 DataFrame dan Series

Sejak Bab 11, `sl.read_csv` mengembalikan **DataFrame** dan kita langsung mengubahnya menjadi larik objek dengan `to_records()`. Kini saatnya mengenal DataFrame itu sendiri.

- **DataFrame** adalah tabel: setiap kolom punya nama dan tipe.
- **Series** adalah satu kolom: deretan nilai bertipe sama.

Namanya sengaja dibuat sama dengan **pandas**, pustaka analisis data paling terkenal di Python. Bila suatu hari kamu belajar Python, sebagian besar yang kamu pelajari di sini langsung berlaku.

```slak
const df = sl.DataFrame([
  { kota: "Jayapura", omzet: 4200000, cabang: 1 },
  { kota: "Sorong", omzet: 3100000, cabang: 1 },
  { kota: "Manokwari", omzet: 1800000, cabang: 1 }
])

sl.write(df.shape)            // [baris, kolom]
sl.write(df.columns)          // nama kolom
sl.write(df.omzet.sum())      // satu kolom adalah Series
sl.write(df.omzet.mean())
sl.dataframe(df)
```

> **API Slak baru**
> - `sl.DataFrame(larikObjek)` membuat DataFrame dari larik objek. Kebalikannya: `df.to_records()`.
> - `df.namaKolom` atau `df["nama kolom"]` mengambil satu kolom sebagai Series.
> - Series punya ringkasan siap pakai: `sum()`, `mean()`, `median()`, `min()`, `max()`, `std()`, `nunique()`, `quantile(0.9)`.

### sl. atau nama tabel?

Satu aturan yang perlu kamu ingat sepanjang Tahap 2 dan 3:

- Awalan **`sl.`** dipakai untuk menyuruh Slak **menampilkan** sesuatu, **membuat widget**, atau **memuat data**: `sl.dataframe(df)`, `sl.slider(...)`, `sl.read_csv(...)`.
- **Nama tabel** dipakai untuk **mengolah** tabel itu: `df.groupby(...)`, `df.query(...)`.

Nama `df` hanyalah kebiasaan; tabelmu boleh bernama `penjualan`. Bila awalannya tertukar, misalnya `sl.groupby(...)`, Slak memberi pesan yang menunjuk tulisan yang benar.

## 14.2 Mengenal data dalam empat perintah

```slak
const toko = await sl.read_csv("toko-nusantara.csv")
sl.dataframe(toko.head())     // 5 baris pertama
sl.dataframe(toko.info())     // tipe, terisi, kosong, unik per kolom
sl.dataframe(toko.describe()) // statistik ringkas kolom angka
sl.dataframe(toko.value_counts("kota"))
```

Empat baris ini adalah langkah pertama setiap analisis. Dalam semenit kamu tahu banyaknya baris, tipe setiap kolom, ada tidaknya nilai kosong, dan sebaran angkanya. Bandingkan dengan Bab 13.1, yang butuh beberapa perulangan untuk sebagian kecil informasi ini.

## 14.3 Bab 13 dalam beberapa baris

Inilah pembersihan Bab 13, langkah demi langkah, berdampingan dengan versi JavaScript murninya:

| Langkah | JavaScript murni (Bab 13) | Slak Data |
|---|---|---|
| Rapikan spasi | `map` + `trim` + regex | `df.strip_strings()` |
| Huruf judul | `split` + `map` + `join` | `df.kota.str.title()` |
| Salah ketik | kamus + `KAMUS[t] \|\| t` | `.replace({ Jayapra: "Jayapura", ... })` |
| Harga dari teks | fungsi `keAngka` dengan regex | `df.to_numeric("harga")` |
| Tanggal tiga format | fungsi `keTanggal` dengan `match` | `df.to_datetime("tanggal")` |
| Isi nilai kosong | `r.kanal \|\| "Tidak diketahui"` | `df.fillna({ kanal: "Tidak diketahui" })` |
| Buang baris kosong | `filter(r => r.jumlah != null)` | `df.dropna({ subset: ["jumlah"] })` |
| Buang ganda | `Set` + `filter` | `df.drop_duplicates({ subset: ["id_transaksi"] })` |
| Tambah kolom | `map(r => ({ ...r, total }))` | `df.assign({ total: r => r.jumlah * r.harga })` |

```slak
const SALAH_KETIK = { Jayapra: "Jayapura", Makasar: "Makassar", Surabya: "Surabaya" }

let df = await sl.read_csv("toko-nusantara-kotor.csv")
df = df.strip_strings()
df = df.assign({
  kota: () => df.kota.str.title().replace(SALAH_KETIK),
  produk: () => df.produk.str.title()
})
df = df.to_numeric("harga").to_datetime("tanggal")
df = df.fillna({ kanal: "Tidak diketahui" }).dropna({ subset: ["jumlah", "harga", "tanggal"] })
df = df.drop_duplicates({ subset: ["id_transaksi"] })
df = df.filter(df.jumlah.le(50))
df = df.assign({ total: r => r.jumlah * r.harga })

sl.write(`${df.shape[0]} baris bersih, omzet ${df.total.sum().toLocaleString("id-ID")}`)
sl.write(df.kota.unique())
sl.dataframe(df.head(8))
```

Hasilnya sama persis dengan Bab 13: 362 baris dengan omzet yang sama. Bedanya, kode ini bisa dibaca seperti daftar langkah, dan setiap langkahnya sudah teruji.

Hal-hal yang perlu diperhatikan:

- **Setiap perintah menghasilkan DataFrame baru.** Data asli tidak berubah. Karena itu hasilnya selalu disimpan lagi: `df = df.strip_strings()`.
- Di `assign`, fungsi tanpa parameter `() => df.kota...` mengembalikan **Series** untuk seluruh kolom, sedangkan fungsi dengan parameter `r => r.jumlah * r.harga` dipanggil **per baris**, seperti `map`.
- `df.jumlah.le(50)` menghasilkan Series benar/salah: *le* artinya *less or equal*, kurang dari atau sama dengan. Ada juga `lt`, `gt`, `ge`, `eq`, dan `ne`.

> **API Slak baru**
> - Membersihkan: `strip_strings()`, `clean_names()` (merapikan nama kolom), `to_numeric(kolom)`, `to_datetime(kolom)`, `fillna({ kolom: nilai })`, `dropna({ subset })`, `drop_duplicates({ subset })`, `missing()` (nilai kosong per kolom).
> - Teks per kolom lewat `.str`: `.str.title()`, `.str.lower()`, `.str.upper()`, `.str.contains()`, `.str.replace()`.
> - `series.replace({ lama: baru })` mengganti nilai lewat kamus.

## 14.4 Memilih, menyaring, mengurutkan

```slak
const t = await sl.read_csv("toko-nusantara.csv")

const kecil = t.select(["tanggal", "kota", "produk", "total"])   // pilih kolom
const papua = kecil.filter(r => ["Jayapura", "Sorong", "Manokwari"].includes(r.kota))
const besar = papua.query("total >= 300000")
const urut = besar.sort_values("total", { ascending: false })

sl.write(`${urut.shape[0]} transaksi besar di tanah Papua`)
sl.dataframe(urut.head(10))
```

Ada tiga cara menyaring, pilih yang paling mudah dibaca untukmu:

| Cara | Contoh | Cocok untuk |
|---|---|---|
| Fungsi per baris | `df.filter(r => r.kanal === "Online")` | Logika apa pun, gaya JavaScript |
| Series benar/salah | `df.filter(df.total.gt(100000))` | Syarat sederhana pada satu kolom |
| Ekspresi teks | `df.query("total > 100000 and kota in ['Ambon', 'Kupang']")` | Syarat panjang, gaya pandas |

`query` bisa memakai nilai dari variabel atau widget dengan awalan `@`:

```slak
const t2 = await sl.read_csv("toko-nusantara.csv")
const minimal = sl.number_input("Total minimal", { value: 500000, step: 50000 })
const hasil = t2.query("total >= @minimal", { minimal })
sl.write(`${hasil.shape[0]} transaksi`)
```

> **API Slak baru**
> - `select([kolom])`, `filter(syarat)`, `query("ekspresi")`, `sort_values(kolom, { ascending })`, `head(n)`, `tail(n)`, `sample(n)`.
> - Ekspresi `query` mendukung `and`, `or`, `not`, `in [...]`, `between ... and ...`, `is null`, serta fungsi `contains`, `startswith`, `lower`, `year`, `month`, `quarter`, `isna`, dan `len`.

## 14.5 Menambah kolom

```slak
const tk = await sl.read_csv("toko-nusantara.csv")
const lengkap = tk.assign({
  pajak: r => Math.round(r.total * 0.11),
  bulan: () => tk.tanggal.dt.month,
  hari: () => tk.tanggal.dt.day_name(),
  ukuran: () => sl.cut(tk.total, [0, 50000, 200000, Infinity], { labels: ["kecil", "sedang", "besar"] })
})
sl.dataframe(lengkap.select(["tanggal", "hari", "bulan", "total", "pajak", "ukuran"]).head(8))
```

- `.dt` memberi akses ke bagian tanggal: `year`, `month`, `day`, `quarter`, `weekday` (0 = Senin), `day_name()` ("Senin"), `month_name()` ("Januari"), dan `strftime("%Y-%m")`.
- `sl.cut(series, batas, { labels })` memasukkan angka ke dalam kelompok.

## 14.6 Bisakah hasilnya dipercaya?

Pertanyaan wajar: Slak Data ditulis dalam JavaScript, bukan pandas. Apakah angkanya benar?

Slak Data diuji akurasinya terhadap pustaka Python yang dipakai di seluruh dunia: **pandas, scipy, statsmodels, dan scikit-learn**. Pengujiannya mencakup 150 kasus, dan hasilnya cocok, kecuali dua perbedaan yang memang disengaja: pembulatan 1,25 menjadi 1,3 seperti Excel, dan `str.title()` yang tidak membesarkan huruf setelah angka.

Kamu juga bisa memeriksanya sendiri. Ingat, kamu sudah menulis fungsi `rataRata` dan `median` di Bab 5:

```slak
const tc = await sl.read_csv("toko-nusantara.csv")
const nilai = tc.total.to_list()

const rataManual = nilai.reduce((a, b) => a + b, 0) / nilai.length
const urut = [...nilai].sort((a, b) => a - b)
const tengah = Math.floor(urut.length / 2)
const medianManual = urut.length % 2 ? urut[tengah] : (urut[tengah - 1] + urut[tengah]) / 2

const { test, expect } = sl.testing
await test("rata-rata sama", () => expect(tc.total.mean()).toBeCloseTo(rataManual, 6))
await test("median sama", () => expect(tc.total.median()).toBe(medianManual))
```

## 14.7 Kapan JavaScript murni, kapan Slak Data?

| Pakai JavaScript murni bila | Pakai Slak Data bila |
|---|---|
| Datanya kecil dan logikanya unik | Langkahnya umum: bersihkan, saring, kelompokkan, gabungkan |
| Kamu butuh kendali penuh atas setiap langkah | Kamu ingin kode yang singkat dan mudah dibaca orang lain |
| Membangun fungsi yang dipakai ulang di tempat lain | Butuh statistik, deret waktu, atau machine learning |

Keduanya bisa dicampur bebas. `df.to_records()` mengubah DataFrame menjadi larik objek, dan `sl.DataFrame(larik)` mengembalikannya. `df.filter(r => ...)` bahkan menerima fungsi JavaScript biasa.

> **Coba di playground**
> Pada contoh 14.4, ganti `"total >= 300000"` dengan `"month(tanggal) == 12"`. Transaksi bulan apa saja yang tersisa?

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Pembersihan seolah tidak berpengaruh | Hasil tidak disimpan | `df = df.dropna()`, bukan hanya `df.dropna()` |
| `sl.groupby is not a function` | Awalan tertukar | Mengolah tabel memakai nama tabel: `df.groupby(...)` |
| `Kolom "Kota" tidak ada` | Nama kolom beda huruf besar-kecil atau ada spasi | Lihat `df.columns`, atau rapikan dengan `clean_names()` |
| Kolom angka terbaca teks | Ada sel berisi huruf | `df.to_numeric("kolom")`; sel yang gagal menjadi kosong |

## Latihan

**Latihan 14.1 (mudah).** Dari `toko-nusantara.csv`, hitung banyaknya transaksi kanal Online di variabel `nOnline`.

Pembersih ini menerima berkas CSV apa pun, menampilkan laporan kualitasnya, membersihkan dengan pilihan pengguna, lalu menawarkan hasilnya untuk diunduh.
