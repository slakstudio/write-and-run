<script type="text/markdown" id="bab-00">
# Sebelum Mulai

Buku ini mengajarkan bahasa pemrograman JavaScript kepada orang yang belum pernah memprogram, lalu memakainya untuk menganalisis data sampai tingkat menengah. Semua contoh berjalan di browser dengan **Slak 1.9.1**, tanpa memasang server dan tanpa langkah build.

## Untuk siapa buku ini

- Kamu yang belum pernah menulis program sama sekali.
- Kamu yang ingin menjadi analis data dan butuh portofolio yang bisa dibuka siapa saja lewat tautan.
- Guru dan mahasiswa yang mencari bahan belajar pemrograman berbahasa Indonesia dengan hasil yang langsung terlihat.

Kamu tidak perlu menguasai matematika lanjut. Cukup penjumlahan, persen, dan rata-rata. Konsep statistik dijelaskan saat dipakai.

## Tiga tahap perjalanan

| Tahap | Bab | Setelah selesai kamu bisa |
|---|---|---|
| 1 · JavaScript Pemula | 1–10 | Menulis program kecil: variabel, percabangan, perulangan, fungsi, larik, objek, menangani galat, dan membuat aplikasi interaktif |
| 2 · Analis Data Pemula | 11–17 | Membaca, membersihkan, meringkas, dan menggambar data, lalu menerbitkan laporan interaktif pertamamu |
| 3 · Analis Data Menengah | 18–26 | Menggabungkan tabel, statistik, deret waktu, SQL, prakiraan, peta, merapikan kode, dan dasbor portofolio multi-halaman |

Baca berurutan. Setiap bab memakai yang sudah dipelajari di bab sebelumnya.

## Judul buku ini

**Write and Run** adalah filosofi resmi Slak: tulis kode, jalankan, langsung lihat hasilnya. Tidak ada terminal, tidak ada menunggu kompilasi. Begitulah kamu akan belajar di setiap halaman buku ini.

## Cara membaca setiap bab

Setiap bab punya susunan yang sama:

1. **Tujuan belajar**: kemampuan yang kamu kuasai setelah bab selesai.
2. **Penjelasan konsep**: singkat, dengan contoh sehari-hari.
3. **Kode dan hasilnya**: di edisi web, setiap contoh langsung dijalankan dan hasilnya tampil tepat di bawah kodenya.
4. **Kotak "API Slak baru"**: muncul saat sebuah fungsi Slak dipakai pertama kali.
5. **Kotak "Coba di playground"**: eksperimen kecil untuk kamu ubah sendiri.
6. **Kesalahan umum**: galat yang sering muncul dan cara membacanya.
7. **Latihan**: tiga tingkat, yaitu mudah, sedang, dan tantangan.
8. **Mini-proyek**: aplikasi kecil yang menggabungkan isi bab.

> **Kotak "Fitur eksperimental"** hanya dipakai untuk fungsi yang di daftar API stabil Slak 1.9 masih berlabel eksperimental. Saat ini hanya satu: `sl.worker` (Bab 12). Cara pakainya boleh berubah sebelum Slak 2.0.

## Latihan yang memeriksa dirinya sendiri

Kode awal setiap latihan sudah berisi uji otomatis dengan `sl.testing`, fitur bawaan Slak 1.9.1. Saat kamu menjalankannya, setiap uji tampil sebagai kotak hijau (lulus) atau merah (belum lulus) beserta alasannya. Tugasmu: ubah kodenya sampai semua kotak hijau.

Di edisi web, setiap contoh dan latihan punya tautan **Buka di Playground**. Tautan itu membuka kodenya di playground resmi `https://slak.studio/playground/`, siap kamu ubah. Jawaban latihan ada di Lampiran D.

## Bahan buku

Folder bahan buku berisi dataset fiktif **Toko Nusantara**, jaringan toko oleh-oleh dengan sepuluh cabang dari Jayapura sampai Jakarta. Dataset ini dipakai mulai Tahap 2. Isinya dijelaskan di Lampiran E.

| Berkas | Isi |
|---|---|
| `toko-nusantara.csv` | 2.929 transaksi 2023–2024 yang sudah bersih |
| `toko-nusantara-kotor.csv` | 394 transaksi yang sengaja berantakan, untuk Bab 13 |
| `produk.csv` | 20 produk beserta harga pokok dan pemasok |
| `cabang.csv` | 10 cabang beserta kota, provinsi, dan koordinat |
| `target.csv` | Target omzet bulanan setiap cabang |
| `toko-nusantara-besar.csv` | Sekitar 250 ribu transaksi (29 MB), diunduh terpisah untuk Bab 12 dan Bab 21 |

Setiap berkas `.csv` punya pasangan `.csv.js` (data yang sudah dibungkus). Pasangan itu membuat contoh tetap jalan saat halaman buku dibuka dengan klik dua kali, tanpa internet.

## Konvensi penulisan

- Kode ditulis tanpa titik koma di akhir baris, dengan tanda kutip ganda, sama seperti Buku Panduan Slak.
- Istilah yang dipakai: **larik** (array), **objek**, **galat** (error), **jalan ulang** (rerun), **pratinjau** (preview).
- Nama fungsi Slak selalu memakai awalan `sl.` dan sesuai daftar API stabil Slak 1.9.1.
- Fungsi yang butuh berkas di luar `slak.js` selalu disertai baris `<script>` yang perlu dimuat. Fungsi yang butuh internet diberi tanda **butuh internet**.

<script type="text/markdown" id="bab-01">
# Bab 1 · Mengenal JavaScript lewat Slak

> **Tujuan belajar**
> - Memahami apa itu program dan apa itu JavaScript.
> - Menjalankan kode pertamamu di playground, di Slak Studio, atau di satu berkas HTML.
> - Membedakan pekerjaan JavaScript dan pekerjaan Slak.
> - Membagikan kodemu lewat tautan.

## 1.1 Program itu resep

Program adalah daftar perintah yang dikerjakan komputer satu per satu, dari atas ke bawah, persis seperti resep masakan. Bahasa pemrograman adalah bahasa yang dipakai untuk menulis resep itu.

**JavaScript** adalah bahasa pemrograman yang dipahami setiap browser: Chrome, Edge, Firefox, dan Safari. Artinya, untuk belajar JavaScript kamu tidak perlu memasang apa pun. Browser di laptop atau ponselmu sudah cukup.

Biasanya, membuat tampilan di browser dengan JavaScript cukup rumit: kamu harus mengurus HTML, CSS, dan cara tombol bereaksi saat diklik. **Slak** mengurus semua itu untukmu. Kamu cukup menulis perintah seperti "tampilkan judul" atau "buat penggeser angka", dan Slak menggambarnya.

```slak
sl.title("Halo, dunia!")
sl.write("Ini program JavaScript pertamaku.")
```

Dua baris itu adalah program lengkap. Baris pertama menampilkan judul besar, baris kedua menampilkan kalimat biasa.

> **API Slak baru**
> - `sl.title(teks)` menampilkan judul besar di bagian atas.
> - `sl.write(nilai)` menampilkan apa saja: teks, angka, tabel, atau objek. Teks boleh memakai Markdown, misalnya `**tebal**`.

## 1.2 Write and Run

Filosofi Slak adalah **Write and Run**: tulis kode, jalankan, langsung lihat hasilnya. Tidak ada build, tidak ada `npm install`, tidak ada server. Inilah cara web dibuat pada masa awalnya, dan inilah cara kamu belajar di buku ini.

Ada tiga tempat untuk menjalankan kode Slak. Pilih yang paling mudah untukmu.

### Cara 1: playground (tanpa memasang apa pun)

Buka **https://slak.studio/playground/** di browser. Layarnya terbagi dua:

- **Kiri**: editor, tempat kamu menulis kode.
- **Kanan**: pratinjau, tempat hasilnya tampil.

Saat kotak **Jalankan otomatis** dicentang, hasil diperbarui setiap kali kamu berhenti mengetik. Kamu juga bisa menekan **Ctrl+Enter** atau tombol **Jalankan**. Daftar di kiri atas berisi contoh siap pakai. Kodemu disimpan otomatis di browser, jadi tidak hilang saat halaman ditutup.

Inilah cara tercepat untuk memulai. Semua contoh Tahap 1 bisa kamu coba di sini.

### Cara 2: Slak Studio (aplikasi desktop Windows)

Slak Studio adalah editor lengkap untuk Slak. Memasangnya cukup mengekstrak satu berkas zip:

1. Unduh `SlakStudio-1.9.1-Windows-x64.zip`.
2. Klik kanan berkas zip, pilih **Extract All…** (Ekstrak Semua), lalu pilih lokasi tetap, misalnya `Documents\Slak Studio`. Jangan menjalankan aplikasi dari dalam zip.
3. Buka folder hasil ekstrak, lalu klik dua kali **Slak Studio.exe**.
4. Jika muncul layar biru **Windows protected your PC**, klik **More info** (Info selengkapnya), lalu **Run anyway** (Tetap jalankan). Peringatan ini muncul karena aplikasinya belum bertanda tangan digital, dan hanya muncul pada pembukaan pertama.
5. Slak Studio terbuka dengan berkas `selamat-datang.slak` dan panel **Belajar** di kiri.

Kebutuhannya: Windows 10 atau 11 (64-bit), sekitar 370 MB ruang disk, dan 4 GB RAM atau lebih.

### Cara 3: satu berkas HTML

Tanpa playground dan tanpa Slak Studio pun Slak tetap jalan. Simpan `slak.js` (dari paket Slak 1.9.1) dan berkas berikut di satu folder:

```html
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Aplikasiku</title>
<script src="slak.js"><\/script>
</head>
<body>
<script type="text/slak">
sl.title("Halo, dunia!")
sl.write("Ini program JavaScript pertamaku.")
<\/script>
</body>
</html>
```

Beri nama `index.html`, lalu klik dua kali. Browser terbuka dan aplikasinya langsung jalan. Kode JavaScript-mu ditulis di dalam tag `<script type="text/slak">`.

## 1.3 Berkeliling Slak Studio

Kalau kamu memakai Slak Studio, kenali empat bagian ini dulu:

| Bagian | Fungsi |
|---|---|
| Editor | Tempat menulis kode, lengkap dengan nomor baris, pewarnaan, dan saran fungsi |
| Pratinjau | Aplikasimu yang sedang berjalan; bisa diklik dan diisi seperti aplikasi sungguhan |
| Konsol | Keluaran `console.log()`, galat, dan penjelasan galat dalam bahasa Indonesia |
| Panel samping | Berkas, **Belajar** (49 pelajaran), **Contoh**, **Referensi** (tekan **F1**), dan Pintasan |

Beberapa pintasan yang langsung berguna:

- **Ctrl+N**: berkas baru. **Ctrl+S**: simpan sebagai berkas `.slak`.
- **Ctrl+Enter**: jalankan. **Ctrl+Shift+Enter**: jalankan dari awal.
- **Ctrl+E**: ekspor menjadi satu berkas `.html` yang bisa dikirim ke siapa saja.

Slak Studio juga punya **mode sel**. Baris komentar `// %%` membagi kode menjadi beberapa sel. Saat kamu mengubah sel di bawah, sel di atasnya tidak dijalankan ulang, jadi mencoba kode sepotong demi sepotong terasa cepat. Tekan **Shift+Enter** untuk menjalankan sampai akhir sel tempat kursor berada. Di luar Slak Studio, baris `// %%` hanya dianggap komentar biasa.

```slak
// %% Judul
sl.title("Mode sel")

// %% Isi
sl.write("Sel ini bisa diubah tanpa menjalankan ulang sel di atasnya.")
```

## 1.4 Apa yang dikerjakan JavaScript, apa yang dikerjakan Slak

Setiap baris di buku ini adalah JavaScript asli. Bedanya, perintah yang diawali `sl.` adalah fungsi Slak.

| Dikerjakan JavaScript | Dikerjakan Slak |
|---|---|
| Menyimpan nilai di variabel | Menampilkan teks, tabel, dan grafik |
| Menghitung, membandingkan, mengulang | Membuat tombol, penggeser, kotak isian |
| Mengolah teks, tanggal, dan larik | Menjalankan ulang program saat pengguna berinteraksi |
| Memutuskan jalan mana yang diambil | Menyimpan data di browser, membaca berkas CSV |

```slak
const harga = 25000
const jumlah = 3
const total = harga * jumlah
sl.write("Total belanja: " + total)
```

Tiga baris pertama murni JavaScript: menyimpan dua angka, lalu mengalikannya. Baris terakhir memakai Slak untuk menampilkan hasilnya. Sepanjang buku, kamu akan belajar JavaScript lewat pola seperti ini: **hitung dengan JavaScript, tampilkan dengan Slak**.

## 1.5 Mengatur halaman

Judul tab browser dan ikon halaman diatur dengan `sl.set_page_config`. Panggil di baris paling atas.

```slak tanpa-jalan
sl.set_page_config({ page_title: "Perkenalan", page_icon: "👋" })
sl.title("Perkenalan")
```

> **API Slak baru**
> - `sl.set_page_config({ page_title, page_icon, layout })` mengatur judul tab, ikon, dan tata letak. `layout: "wide"` membuat konten lebih lebar.

Contoh ini ditandai *tidak dijalankan di halaman buku* karena akan mengganti judul halaman buku itu sendiri. Coba di playground.

## 1.6 Membagikan kodemu

Di playground, tombol **🔗 Bagikan** menyalin tautan yang berisi kodemu, misalnya `https://slak.studio/playground/#kode=K87R…`. Kodenya dimampatkan ke bagian setelah tanda `#`, jadi tidak dikirim ke server mana pun. Siapa pun yang membuka tautan itu melihat kode dan hasilnya. Di Slak Studio, pilih menu **Berkas › Salin tautan berbagi**.

Tautan yang sama bisa dibuat dari kode dengan `Slak.share.link`:

```slak
const kode = 'sl.title("Halo dari temanmu")'
const tautan = await Slak.share.link(kode, "https://slak.studio/playground/")
sl.write("Tautan berbagi:")
sl.code(tautan)
```

> **API Slak baru**
> - `Slak.share.link(kode, alamat)` membuat tautan playground yang berisi kode. Perhatikan awalannya `Slak.`, bukan `sl.`: ini fungsi milik Slak sebagai alat, bukan perintah untuk menampilkan sesuatu.
> - `sl.code(teks)` menampilkan teks sebagai kode.

Kata `await` di depan `Slak.share.link` artinya "tunggu sampai hasilnya siap". Kamu akan memahaminya di Bab 12.

> **Coba di playground**
> Ganti teks di dalam `sl.write` pada contoh 1.4, lalu ubah angka `harga` dan `jumlah`. Perhatikan totalnya berubah sendiri.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| `sl is not defined` | Kode ditulis di `<script>` biasa, bukan `<script type="text/slak">` | Pakai `type="text/slak"` |
| Halaman kosong | `slak.js` tidak ada di folder yang sama | Salin `slak.js` ke folder halaman |
| `Unexpected string` | Tanda kutip tidak berpasangan, misalnya `"Halo` | Tutup dengan `"` |
| Fungsi sl.Title tidak ada | Huruf besar dan kecil berbeda di JavaScript | Tulis `sl.title`, huruf kecil semua |

# Bab 2 · Nilai, Variabel, dan Tipe Data

> **Tujuan belajar**
> - Menyimpan nilai di variabel dengan `let` dan `const`.
> - Mengenal tiga tipe data dasar: angka, teks, dan boolean.
> - Memahami nilai kosong `null`, `undefined`, dan `NaN`, yang sering muncul di data nyata.
> - Memeriksa dan mengubah tipe data.
> - Mempercantik teks dengan Markdown, warna, dan emoji.

## 2.1 Variabel adalah kotak berlabel

Bayangkan sebuah kotak dengan label di luarnya. Kamu menaruh sesuatu di dalamnya, lalu memanggilnya lewat labelnya. Itulah **variabel**.

```slak
const namaToko = "Toko Nusantara"
let jumlahCabang = 10

sl.write(namaToko)
sl.write(jumlahCabang)
```

Ada dua cara membuat variabel:

| Kata kunci | Arti | Kapan dipakai |
|---|---|---|
| `const` | Isinya tidak boleh diganti | Pilihan utama. Pakai ini kecuali kamu memang perlu mengganti isinya |
| `let` | Isinya boleh diganti | Untuk nilai yang berubah, misalnya penghitung |

```slak
let stok = 50
stok = stok - 3      // terjual 3
stok = stok + 20     // datang barang baru
sl.write("Stok sekarang: " + stok)
```

Tanda `=` di JavaScript berarti **mengisi**, bukan "sama dengan". Baris `stok = stok - 3` artinya "ambil isi `stok`, kurangi 3, lalu masukkan hasilnya kembali ke `stok`".

Teks setelah `//` adalah **komentar**. Komentar diabaikan komputer dan hanya ditulis untuk manusia yang membaca kode.

### Aturan memberi nama

- Boleh huruf, angka, `_`, dan `$`, tetapi tidak boleh diawali angka: `harga2` boleh, `2harga` tidak.
- Tidak boleh ada spasi. Untuk nama dari beberapa kata, tulis kata berikutnya diawali huruf besar: `hargaSatuan`, `jumlahCabang`. Gaya ini disebut *camelCase*.
- Huruf besar dan kecil dibedakan: `stok` dan `Stok` adalah dua variabel berbeda.
- Pilih nama yang menjelaskan isinya. `totalBelanja` jauh lebih jelas daripada `x`.

## 2.2 Tiga tipe data dasar

Setiap nilai punya **tipe**. Tipe menentukan apa yang bisa dilakukan terhadap nilai itu.

| Tipe | Contoh | Keterangan |
|---|---|---|
| number (angka) | `25000`, `3.5`, `-7` | Desimal memakai titik, bukan koma |
| string (teks) | `"Jayapura"`, `'kopi'` | Diapit tanda kutip ganda atau tunggal |
| boolean | `true`, `false` | Hanya dua nilai: benar atau salah |

```slak
const harga = 85000          // number
const produk = "Kopi Wamena" // string
const tersedia = true        // boolean

sl.write(typeof harga)
sl.write(typeof produk)
sl.write(typeof tersedia)
```

`typeof` memberi tahu tipe sebuah nilai. Gunakan saat kamu ragu.

### Angka

```slak
const a = 10
const b = 3
sl.write(a + b)   // tambah
sl.write(a - b)   // kurang
sl.write(a * b)   // kali
sl.write(a / b)   // bagi
sl.write(a % b)   // sisa bagi: 10 dibagi 3 sisanya 1
sl.write(a ** 2)  // pangkat
```

Saat menampilkan angka, `sl.write` memakai gaya Indonesia: titik untuk ribuan dan koma untuk desimal. Jadi `10 / 3` tampil `3,3333` (dibulatkan empat desimal), dan `25000` tampil `25.000`. Nilainya sendiri tidak berubah; hanya tampilannya yang diatur. Angka yang disambung ke dalam teks, misalnya `"Total: " + 25000`, tampil apa adanya.

Satu keanehan yang perlu kamu tahu sejak awal:

```slak
sl.write(String(0.1 + 0.2))
sl.write(0.1 + 0.2 === 0.3)
```

`String(...)` mengubah angka menjadi teks supaya tampil apa adanya, tanpa pembulatan tampilan. Hasilnya `0.30000000000000004`, bukan `0.3`, sehingga perbandingan di baris kedua bernilai `false`. Komputer menyimpan pecahan dalam bentuk biner, sehingga beberapa pecahan tidak bisa disimpan tepat. Untuk uang, hitung dalam rupiah bulat. Untuk menampilkan, bulatkan (Bab 8).

### Teks

Teks bisa disambung dengan `+`:

```slak
const kota = "Jayapura"
sl.write("Cabang " + kota + " buka pukul 08.00")
```

Cara yang lebih rapi adalah **template literal**: teks diapit tanda backtick `` ` `` dan nilai disisipkan dengan `${...}`.

```slak
const kotaCabang = "Sorong"
const jam = 8
sl.write(`Cabang ${kotaCabang} buka pukul ${jam}.00`)
```

Di dalam `${...}` boleh ada perhitungan, misalnya `` `Total: ${3 * 25000}` ``.

## 2.3 Nilai kosong: null, undefined, dan NaN

Data nyata hampir selalu punya lubang: sel yang lupa diisi, harga yang ditulis sebagai teks, kolom yang hilang. JavaScript punya tiga cara menyatakan "tidak ada":

| Nilai | Arti | Contoh muncul |
|---|---|---|
| `undefined` | Belum pernah diisi | Variabel dibuat tanpa nilai: `let x` |
| `null` | Sengaja dikosongkan | Sel kosong di CSV sering dibaca menjadi `null` |
| `NaN` | *Not a Number*, hasil hitungan yang gagal | `Number("Rp 5.000")` |

```slak
let belumDiisi
const sengajaKosong = null
const gagal = Number("Rp 5.000")

sl.write(belumDiisi)
sl.write(sengajaKosong)
sl.write(gagal)
sl.write(gagal + 1000)   // NaN menular ke hitungan berikutnya
```

Perhatikan baris terakhir: sekali sebuah nilai menjadi `NaN`, semua hitungan yang memakainya ikut menjadi `NaN`. Inilah sebabnya analis data selalu memeriksa nilai kosong lebih dulu. Kamu akan membersihkannya di Bab 13.

Untuk memeriksa `NaN`, gunakan `Number.isNaN(x)`. Membandingkan `x === NaN` selalu menghasilkan `false`, bahkan bila `x` memang `NaN`.

## 2.4 Mengubah tipe

```slak
const dariTeks = Number("1250")
const keTeks = String(1250)
const desimal = parseFloat("3.75 kg")
const bulat = parseInt("12 buah")

sl.write(dariTeks + 50)    // 1300: angka ditambah angka
sl.write(keTeks + 50)      // "125050": teks disambung teks
sl.write(desimal)
sl.write(bulat)
```

`Number()` menolak teks yang tidak murni angka dan memberi `NaN`. `parseFloat()` dan `parseInt()` membaca angka di awal teks lalu berhenti di huruf pertama.

Baris kedua menunjukkan jebakan yang sering terjadi: `+` antara teks dan angka **menyambung**, bukan menjumlah. Bila hasil penjumlahanmu tampak aneh, periksa dulu apakah salah satu nilainya teks.

## 2.5 sl.write atau console.log?

| | `sl.write(x)` | `console.log(x)` |
|---|---|---|
| Tampil di | Halaman aplikasi | Konsol (Slak Studio) atau DevTools browser (F12) |
| Untuk | Pengguna aplikasimu | Kamu sendiri, saat memeriksa isi variabel |

Gunakan `sl.write` untuk hasil yang ingin dilihat pengguna, dan `console.log` untuk mengintip isi variabel saat mencari kesalahan (Bab 9).

## 2.6 Mempercantik teks

```slak
sl.markdown("Teks **tebal**, *miring*, dan `kode`.")
sl.markdown("Omzet naik :green[12%], biaya naik :red[3%].")
sl.markdown("Laporan bulanan :bar_chart: dari cabang Jayapura :jempol:")
sl.text("sl.text menampilkan teks apa adanya, **tanpa** Markdown.")
```

> **API Slak baru**
> - `sl.markdown(teks)` menampilkan teks berformat Markdown: tebal, miring, daftar, tabel, tautan, dan warna `:green[...]`, `:red[...]`, `:blue[...]`, `:orange[...]`, `:violet[...]`, `:gray[...]`.
> - `sl.text(teks)` menampilkan teks persis seperti ditulis.
> - Nama emoji ditulis di antara titik dua. Slak mengenal semua nama emoji Streamlit, misalnya `:bar_chart:` dan `:rocket:`, ditambah nama berbahasa Indonesia seperti `:jempol:`, `:senyum:`, dan `:kantung_uang:`.

Mau mencari nama emoji? `sl.emoji.search("uang")` mengembalikan daftar nama yang cocok.

```slak
sl.write(sl.emoji.search("uang").slice(0, 5))
```

> **Coba di playground**
> Ubah `:green[12%]` menjadi `:orange[12%]`, lalu coba emoji `:rocket:` dan `:senyum:`.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| `Assignment to constant variable` | Mengganti isi variabel `const` | Pakai `let` bila isinya memang berubah |
| `stok is not defined` | Salah ketik nama, atau beda huruf besar-kecil | Samakan persis dengan nama saat dibuat |
| Hasil `"10050"` padahal ingin `150` | Salah satu nilai berupa teks | Ubah dengan `Number(...)` |
| Hasil `NaN` | Teks seperti `"Rp 5.000"` diubah ke angka | Buang dulu `Rp` dan titiknya (Bab 8) |

## Latihan

**Latihan 2.1 (mudah).** Buat variabel `const` bernama `produk` berisi `"Sagu Lempeng 1kg"` dan variabel `harga` berisi `30000`. Tampilkan kalimat `Sagu Lempeng 1kg harganya 30000` dengan template literal.

```slak latihan

const kalimat = ""   // ganti dengan template literal
sl.write(kalimat)

await sl.testing.test("kalimat benar", () => sl.testing.expect(kalimat).toBe("Sagu Lempeng 1kg harganya 30000"))
```

**Latihan 2.2 (sedang).** Data dari formulir selalu berupa teks. Ubah `jumlahTeks` dan `hargaTeks` menjadi angka, lalu hitung `total`.

```slak latihan
const jumlahTeks = "4"
const hargaTeks = "22000"
const total = jumlahTeks * hargaTeks + ""   // perbaiki baris ini

sl.write(total)
await sl.testing.test("total berupa angka", () => sl.testing.expect(typeof total).toBe("number"))
await sl.testing.test("total = 88000", () => sl.testing.expect(total).toBe(88000))
```

**Latihan 2.3 (tantangan).** Variabel `isian` berisi teks dari pengguna. Buat variabel `sah` yang bernilai `true` bila `isian` bisa diubah menjadi angka, dan `false` bila tidak. Petunjuk: `Number.isNaN`.

```slak latihan

const sah = true   // ganti dengan pemeriksaan yang benar

sl.write(sah)
await sl.testing.test('"12a" bukan angka', () => sl.testing.expect(sah).toBe(false))
```

## Mini-proyek: kartu data diri

Kumpulkan data dirimu di variabel, lalu tampilkan sebagai kartu yang rapi.

```slak

const kotaAsal = "Jayapura"
const tahunLahir = 2004
const sedangBelajar = true
const tahunSekarang = 2026

sl.title(`:wave: ${nama}`)
sl.markdown(`**Kota asal:** ${kotaAsal}`)
sl.markdown(`**Umur:** sekitar ${tahunSekarang - tahunLahir} tahun`)
sl.markdown(`**Sedang belajar JavaScript:** ${sedangBelajar ? ":green[ya]" : ":red[belum]"}`)
sl.markdown("Cita-cita: menjadi analis data :bar_chart:")

Tanda `? :` pada baris keempat memilih salah satu dari dua nilai. Kamu akan mempelajarinya di bab berikutnya.

<script type="text/markdown" id="bab-03">
# Bab 3 · Operator dan Percabangan

> **Tujuan belajar**
> - Membandingkan nilai dengan `===`, `!==`, `<`, `>`, `<=`, `>=`.
> - Menggabungkan syarat dengan `&&`, `||`, dan `!`.
> - Membuat program memilih jalan dengan `if`, `else if`, `else`, `switch`, dan operator ternary.
> - Menerima masukan pengguna lewat widget Slak.

## 3.1 Perbandingan menghasilkan boolean

Setiap perbandingan menghasilkan `true` atau `false`.

```slak
const nilai = 78
sl.write(nilai > 75)     // lebih besar
sl.write(nilai <= 60)    // lebih kecil atau sama dengan
sl.write(nilai === 78)   // sama persis
sl.write(nilai !== 100)  // tidak sama
```

### Mengapa tiga tanda sama dengan?

JavaScript punya dua cara membandingkan:

```slak
sl.write(5 == "5")    // true: tipenya diam-diam diubah dulu
sl.write(5 === "5")   // false: angka dan teks tidak sama
sl.write(0 == "")     // true, mengejutkan
sl.write(0 === "")    // false
```

`==` mengubah tipe data sebelum membandingkan, sehingga hasilnya sering mengejutkan. `===` baru bernilai `true` bila nilai **dan** tipenya sama persis. **Selalu pakai `===` dan `!==`.**

Ingat juga: `=` (satu) berarti *mengisi*, sedangkan `===` (tiga) berarti *membandingkan*.

## 3.2 Menggabungkan syarat

| Operator | Arti | Contoh | Hasil |
|---|---|---|---|
| `&&` | dan: keduanya harus benar | `nilai >= 75 && hadir >= 80` | `true` bila kedua syarat terpenuhi |
| `\|\|` | atau: salah satu cukup | `kota === "Sorong" \|\| kota === "Manokwari"` | `true` bila salah satu cocok |
| `!` | bukan | `!lunas` | kebalikan dari `lunas` |

```slak
const nilaiUjian = 82
const kehadiran = 76
sl.write(nilaiUjian >= 75 && kehadiran >= 80)   // false: kehadiran kurang
sl.write(nilaiUjian >= 75 || kehadiran >= 80)   // true: nilainya cukup
```

## 3.3 if, else if, else

`if` menjalankan sebuah blok kode hanya bila syaratnya benar.

```slak
const saldo = 120000
const harga = 150000

if (saldo >= harga) {
  sl.success("Pembayaran berhasil")
} else {
  sl.error(`Saldo kurang Rp ${harga - saldo}`)
}
```

Untuk lebih dari dua kemungkinan, sambung dengan `else if`. Syarat diperiksa dari atas ke bawah, dan yang pertama benar yang dijalankan.

```slak
const suhu = 31
if (suhu >= 35) {
  sl.error("Sangat panas")
} else if (suhu >= 30) {
  sl.warning("Panas")
} else if (suhu >= 20) {
  sl.info("Sejuk")
} else {
  sl.info("Dingin")
}
```

> **API Slak baru**
> - `sl.success(teks)`, `sl.info(teks)`, `sl.warning(teks)`, `sl.error(teks)` menampilkan kotak pesan hijau, biru, kuning, dan merah.

## 3.4 Menerima masukan pengguna

Sejauh ini nilai ditulis langsung di kode. Aplikasi sungguhan meminta nilai dari pengguna. Di Slak, **widget mengembalikan nilainya** seperti fungsi biasa:

```slak
const namaPembeli = sl.text_input("Nama pembeli")
const jumlahBeli = sl.number_input("Jumlah barang", { min: 0, value: 1, step: 1 })

if (namaPembeli === "") {
  sl.info("Isi nama pembeli dulu.")
} else {
  sl.write(`${namaPembeli} membeli ${jumlahBeli} barang.`)
}
```

Ketik nama, tekan Enter, lalu ubah jumlahnya. Setiap kali kamu mengubah widget, **seluruh program dijalankan ulang dari atas** dengan nilai baru. Itulah cara Slak bekerja, dan kamu akan memahaminya lebih dalam di Bab 10.

Tombol bekerja dengan cara yang sama: `sl.button` bernilai `true` hanya sekali, tepat setelah diklik.

```slak
if (sl.button("Sapa aku")) {
  sl.success("Halo! Semangat belajar :senyum:")
}
```

> **API Slak baru**
> - `sl.text_input(label, nilaiAwal)` mengembalikan teks. Nilainya dipakai setelah kamu menekan Enter atau pindah ke kotak lain.
> - `sl.number_input(label, { min, max, value, step })` mengembalikan angka.
> - `sl.button(label)` mengembalikan `true` pada satu jalan ulang setelah diklik, lalu `false` lagi.

## 3.5 switch

Bila kamu membandingkan satu nilai dengan banyak pilihan pasti, `switch` lebih rapi daripada deretan `else if`.

```slak
const kodeCabang = "SOQ"
let namaKota
switch (kodeCabang) {
  case "JYP": namaKota = "Jayapura"; break
  case "SOQ": namaKota = "Sorong"; break
  case "MKW": namaKota = "Manokwari"; break
  default: namaKota = "Tidak dikenal"
}
sl.write(namaKota)
```

Jangan lupa `break` di setiap `case`. Tanpa `break`, program terus menjalankan `case` berikutnya. Di sini titik koma dipakai karena dua perintah ditulis di satu baris.

## 3.6 Operator ternary

Untuk memilih satu dari dua nilai, ada bentuk singkat `syarat ? nilaiBilaBenar : nilaiBilaSalah`.

```slak
const totalBelanja = 260000
const ongkir = totalBelanja >= 250000 ? 0 : 15000
sl.write(`Ongkos kirim: Rp ${ongkir}`)
```

Pakai ternary hanya untuk pilihan sederhana. Bila logikanya panjang, `if` lebih mudah dibaca.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Syarat selalu benar | Menulis `if (x = 5)` | Pakai `===` untuk membandingkan |
| `Assignment to constant variable` di dalam `if` | `=` yang seharusnya `===` pada variabel `const` | Ganti dengan `===` |
| Semua cabang `switch` ikut jalan | Lupa `break` | Tambahkan `break` di setiap `case` |
| `else if` yang benar tidak pernah jalan | Syarat yang lebih luas ditulis lebih dulu | Urutkan dari syarat paling sempit atau paling tinggi |

## Latihan

**Latihan 3.1 (mudah).** Lengkapi fungsi `lulus(nilai)` agar mengembalikan `"Lulus"` bila nilai 75 ke atas dan `"Belum lulus"` bila kurang dari 75. Fungsi dibahas di Bab 5; untuk sekarang cukup isi bagian `if`.

```slak latihan
function lulus(nilai) {
  // tulis if di sini
  return ""
}

await sl.testing.test("80 lulus", () => sl.testing.expect(lulus(80)).toBe("Lulus"))
await sl.testing.test("75 lulus", () => sl.testing.expect(lulus(75)).toBe("Lulus"))
await sl.testing.test("74 belum lulus", () => sl.testing.expect(lulus(74)).toBe("Belum lulus"))
```

**Latihan 3.2 (sedang).** Toko Nusantara memberi diskon 10% untuk belanja minimal Rp 500.000 **atau** bila pembeli adalah anggota. Lengkapi `diskon(total, anggota)` agar mengembalikan besar diskon dalam rupiah.

```slak latihan
function diskon(total, anggota) {
  return 0
}

await sl.testing.test("600 ribu, bukan anggota", () => sl.testing.expect(diskon(600000, false)).toBe(60000))
await sl.testing.test("200 ribu, anggota", () => sl.testing.expect(diskon(200000, true)).toBe(20000))
await sl.testing.test("200 ribu, bukan anggota", () => sl.testing.expect(diskon(200000, false)).toBe(0))
```

**Latihan 3.3 (tantangan).** Tahun kabisat habis dibagi 4, kecuali tahun yang habis dibagi 100; tahun yang habis dibagi 400 tetap kabisat. Lengkapi `kabisat(tahun)`. Petunjuk: operator sisa bagi `%`.

```slak latihan
function kabisat(tahun) {
  return false
}

await sl.testing.test("2024 kabisat", () => sl.testing.expect(kabisat(2024)).toBe(true))
await sl.testing.test("2023 bukan", () => sl.testing.expect(kabisat(2023)).toBe(false))
await sl.testing.test("1900 bukan", () => sl.testing.expect(kabisat(1900)).toBe(false))
await sl.testing.test("2000 kabisat", () => sl.testing.expect(kabisat(2000)).toBe(true))
```

## Mini-proyek: kalkulator nilai rapor

Pengguna mengisi tiga nilai. Program menghitung rata-rata, lalu menentukan predikat A sampai E.

```slak
sl.title("Kalkulator Nilai Rapor :memo:")

const tugas = sl.number_input("Nilai tugas", { min: 0, max: 100, value: 80 })
const uts = sl.number_input("Nilai UTS", { min: 0, max: 100, value: 75 })
const uas = sl.number_input("Nilai UAS", { min: 0, max: 100, value: 70 })

const rata = (tugas + uts + uas) / 3

let predikat
if (rata >= 85) predikat = "A"
else if (rata >= 75) predikat = "B"
else if (rata >= 65) predikat = "C"
else if (rata >= 50) predikat = "D"
else predikat = "E"

sl.write(`Rata-rata: **${rata.toFixed(1)}**, predikat **${predikat}**`)

if (predikat === "A" || predikat === "B") {
  sl.success("Hebat, pertahankan!")
} else if (predikat === "C") {
  sl.info("Sudah cukup, masih bisa ditingkatkan.")
} else {
  sl.warning("Ayo belajar lebih giat lagi.")
}
```

Bila isi `if` hanya satu baris, kurung kurawal boleh ditiadakan seperti pada bagian predikat. `rata.toFixed(1)` membulatkan angka menjadi satu desimal untuk ditampilkan.

<script type="text/markdown" id="bab-04">
# Bab 4 · Perulangan

> **Tujuan belajar**
> - Mengulang perintah dengan `for`, `while`, dan `for...of`.
> - Menghentikan atau melewati putaran dengan `break` dan `continue`.
> - Menghitung total, rata-rata, nilai terbesar, dan nilai terkecil secara manual.
> - Menghindari perulangan tanpa akhir.

## 4.1 Mengapa perlu perulangan

Bayangkan kamu harus menjumlahkan omzet 365 hari. Menulis 365 baris penjumlahan jelas tidak masuk akal. Perulangan membuat komputer mengerjakan hal yang sama berulang kali untukmu. Inilah inti analisis data: mengerjakan satu langkah yang sama pada ribuan baris.

## 4.2 for

```slak
for (let i = 1; i <= 5; i++) {
  sl.write(`Putaran ke-${i}`)
}
```

Bagian di dalam kurung `for` terdiri dari tiga potong yang dipisah titik koma:

| Bagian | Contoh | Arti |
|---|---|---|
| Awal | `let i = 1` | Buat penghitung `i`, mulai dari 1 |
| Syarat | `i <= 5` | Ulangi selama syarat ini benar |
| Langkah | `i++` | Setelah setiap putaran, tambah `i` dengan 1 |

`i++` adalah cara singkat menulis `i = i + 1`. Ada juga `i--` (kurangi 1) dan `i += 5` (tambah 5).

```slak
// hitung mundur dari 10, lompat 2
for (let i = 10; i > 0; i -= 2) {
  sl.write(i)
}
```

## 4.3 for...of: mengunjungi setiap isi daftar

Daftar nilai disebut **larik** (array), ditulis di antara kurung siku. Bab 6 membahasnya lengkap; untuk sekarang cukup tahu cara mengunjungi setiap isinya.

```slak
const kota = ["Jayapura", "Sorong", "Manokwari"]
for (const k of kota) {
  sl.write(`Cabang ${k}`)
}
```

`for...of` membaca "untuk setiap `k` di dalam `kota`". Kamu tidak perlu mengurus penghitung sama sekali.

## 4.4 Pola akumulator: total, rata-rata, terbesar, terkecil

Hampir semua ringkasan data dibuat dengan pola yang sama: siapkan sebuah variabel penampung, lalu perbarui isinya di setiap putaran.

```slak
const omzetHarian = [1250000, 980000, 1430000, 1100000, 1675000, 2010000, 1890000]

let total = 0
let terbesar = omzetHarian[0]
let terkecil = omzetHarian[0]

for (const x of omzetHarian) {
  total += x
  if (x > terbesar) terbesar = x
  if (x < terkecil) terkecil = x
}

const rataRata = total / omzetHarian.length

sl.write(`Total seminggu: ${total}`)
sl.write(`Rata-rata per hari: ${rataRata}`)
sl.write(`Tertinggi: ${terbesar}, terendah: ${terkecil}`)
```

- `omzetHarian[0]` adalah isi pertama larik. Penghitungan posisi di JavaScript dimulai dari 0.
- `omzetHarian.length` adalah banyaknya isi larik.
- `total += x` sama dengan `total = total + x`.

Pola ini akan kamu temui terus. Di Bab 6 kamu belajar cara yang lebih singkat, dan di Bab 14 Slak Data mengerjakannya dalam satu perintah. Tetapi di baliknya, semuanya bekerja seperti kode di atas.

## 4.5 while

`while` mengulang selama syaratnya benar. Pakai bila kamu tidak tahu sejak awal berapa kali harus mengulang.

```slak
// Berapa bulan sampai tabungan mencapai 5 juta bila setiap bulan menabung 400 ribu
// dan saldo bertambah 0,5% per bulan?
let saldo = 0
let bulan = 0
while (saldo < 5000000) {
  saldo = saldo * 1.005 + 400000
  bulan++
}
sl.write(`Butuh ${bulan} bulan, saldo akhir ${Math.round(saldo)}`)
```

`Math.round` membulatkan angka ke bilangan bulat terdekat.

## 4.6 break dan continue

- `break` menghentikan perulangan seketika.
- `continue` melewati sisa putaran ini dan lanjut ke putaran berikutnya.

```slak
const stokGudang = [12, 0, 7, 0, 3, 25]
for (let i = 0; i < stokGudang.length; i++) {
  if (stokGudang[i] === 0) continue          // lewati rak kosong
  if (stokGudang[i] > 20) {
    sl.write(`Rak ${i} penuh, berhenti memeriksa.`)
    break
  }
  sl.write(`Rak ${i}: ${stokGudang[i]} barang`)
}
```

## 4.7 Perulangan tanpa akhir

Bila syarat perulangan tidak pernah menjadi salah, program berputar selamanya:

```slak tanpa-jalan lewati
let n = 0
while (n < 10) {
  sl.write(n)
  // lupa n++, jadi n selalu 0
}
```

Slak Studio menyisipkan pengaman ke setiap perulangan. Bila satu perulangan berjalan lebih dari 2,5 detik tanpa jeda, perulangan itu dihentikan dengan pesan yang menunjuk barisnya. Di browser biasa tidak ada pengaman seperti ini, jadi selalu periksa: **apakah ada baris yang membuat syaratnya suatu saat salah?**

## 4.8 Penggeser angka

Perulangan menjadi lebih menarik bila banyaknya putaran dipilih pengguna.

```slak
const n = sl.slider("Berapa bintang?", 1, 10, 3)
let bintang = ""
for (let i = 0; i < n; i++) bintang += "⭐"
sl.write(bintang)
```

> **API Slak baru**
> - `sl.slider(label, min, max, nilaiAwal, langkah)` mengembalikan angka yang dipilih. Urutan argumennya: label, nilai terkecil, nilai terbesar, nilai awal, lalu langkah (boleh dilewati).

> **Coba di playground**
> Ganti `"⭐"` dengan `":rocket: "`, lalu ubah batas slider menjadi 1 sampai 20.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Aplikasi membeku atau Studio menghentikan perulangan | Syarat tidak pernah salah | Pastikan penghitung berubah setiap putaran |
| Satu isi terakhir tidak ikut dihitung | Syarat `i < panjang - 1` | Pakai `i < larik.length` |
| `undefined` di akhir | Syarat `i <= larik.length` | Posisi terakhir adalah `length - 1`, jadi pakai `<` |
| Total selalu 0 | Variabel `total` dibuat di dalam perulangan | Buat penampung di luar perulangan |

// tulis perulangan di sini

sl.write(jumlah)
await sl.testing.test("1 + 2 + ... + 100 = 5050", () => sl.testing.expect(jumlah).toBe(5050))

## Mini-proyek: tabel perkalian

Ukuran tabel dipilih dengan slider. Tabelnya disusun sebagai teks Markdown dengan perulangan bersarang: satu perulangan untuk baris, satu lagi untuk kolom.

```slak

const ukuran = sl.slider("Ukuran tabel", 2, 12, 5)

let kepala = "| × |"
let garis = "|---|"
for (let k = 1; k <= ukuran; k++) {
  kepala += ` ${k} |`
  garis += "---|"
}

for (let b = 1; b <= ukuran; b++) {

  }
  isi += baris + "\n"

`"\n"` adalah tanda ganti baris di dalam teks. Markdown membutuhkan setiap baris tabel di baris tersendiri.

<script type="text/markdown" id="bab-05">
# Bab 5 · Fungsi

> **Tujuan belajar**
> - Membuat dan memanggil fungsi, serta mengembalikan nilai dengan `return`.
> - Menulis fungsi panah (arrow function) dan parameter bawaan.
> - Memahami scope: variabel di dalam dan di luar fungsi.
> - Membuat fungsi statistik sendiri: `jumlah`, `rataRata`, `median`, dan `modus`.

## 5.1 Fungsi adalah resep yang diberi nama

Kalau sebuah hitungan dipakai berkali-kali, bungkus menjadi **fungsi**. Kamu menulisnya sekali, lalu memanggilnya kapan saja.

```slak
function hargaSetelahDiskon(harga, persen) {
  const potongan = harga * persen / 100
  return harga - potongan
}

sl.write(hargaSetelahDiskon(85000, 10))
sl.write(hargaSetelahDiskon(120000, 25))
```

| Bagian | Contoh | Arti |
|---|---|---|
| Nama | `hargaSetelahDiskon` | Dipakai saat memanggil |
| Parameter | `harga, persen` | Nilai yang diterima fungsi, seperti bahan resep |
| Isi | di antara `{ }` | Langkah-langkahnya |
| `return` | `return harga - potongan` | Hasil yang dikirim kembali ke pemanggil |

Saat dipanggil dengan `hargaSetelahDiskon(85000, 10)`, nilai `85000` masuk ke `harga` dan `10` masuk ke `persen`. Nilai yang dikirim saat memanggil disebut **argumen**.

`return` juga menghentikan fungsi. Baris setelah `return` tidak dijalankan. Fungsi tanpa `return` mengembalikan `undefined`.

## 5.2 Parameter bawaan

Parameter boleh diberi nilai bawaan, yang dipakai bila argumennya tidak dikirim.

```slak
function hargaJual(hargaPokok, margin = 30) {
  return Math.round(hargaPokok * (1 + margin / 100))
}
sl.write(hargaJual(50000))       // memakai margin 30
sl.write(hargaJual(50000, 45))   // memakai margin 45
```

## 5.3 Fungsi panah

JavaScript modern punya cara menulis fungsi yang lebih ringkas, yaitu **fungsi panah** (arrow function):

```slak
const pajak = (harga) => harga * 0.11
const keRibuan = (x) => Math.round(x / 1000) + " rb"

sl.write(pajak(200000))
sl.write(keRibuan(1250000))
```

Bila isinya hanya satu ekspresi, tidak perlu `{ }` dan `return`. Bila isinya beberapa baris, tulis lengkap:

```slak
const ongkir = (beratKg, kota) => {
  const tarif = kota === "Jayapura" ? 8000 : 15000
  return Math.ceil(beratKg) * tarif
}
sl.write(ongkir(2.3, "Sorong"))
```

`Math.ceil` membulatkan ke atas: 2,3 kg dihitung 3 kg. Pasangannya `Math.floor` membulatkan ke bawah.

Kedua bentuk fungsi sama-sama benar. Buku ini memakai `function` untuk fungsi yang panjang dan penting, dan fungsi panah untuk fungsi pendek, terutama di Bab 6 saat fungsi dikirim ke fungsi lain.

## 5.4 Scope: variabel punya wilayah

Variabel yang dibuat di dalam fungsi hanya hidup di dalam fungsi itu.

```slak
const kotaUtama = "Jayapura"   // di luar: bisa dibaca di mana saja

function sapa(nama) {
  const salam = "Selamat datang"   // di dalam: hanya ada di sini
  return `${salam}, ${nama}, di cabang ${kotaUtama}`
}

sl.write(sapa("Yohanes"))
sl.write(typeof salam)   // "undefined": salam tidak dikenal di luar fungsi
```

Aturan ini melindungi kodemu. Dua fungsi boleh sama-sama punya variabel bernama `total` tanpa saling mengganggu.

## 5.5 Fungsi statistik buatan sendiri

Analis data bekerja dengan ringkasan: jumlah, rata-rata, nilai tengah, nilai yang paling sering muncul. Mari menulisnya sendiri dengan JavaScript murni, supaya nanti kamu paham apa yang dikerjakan Slak Data di balik layar.

```slak
function jumlah(data) {
  let total = 0
  for (const x of data) total += x
  return total
}

function rataRata(data) {
  if (data.length === 0) return null
  return jumlah(data) / data.length
}

function median(data) {
  if (data.length === 0) return null
  const urut = [...data].sort((a, b) => a - b)
  const tengah = Math.floor(urut.length / 2)
  if (urut.length % 2 === 1) return urut[tengah]
  return (urut[tengah - 1] + urut[tengah]) / 2
}

function modus(data) {
  let terbaik = null
  let frekTerbaik = 0
  for (const x of data) {
    let frek = 0
    for (const y of data) if (y === x) frek++
    if (frek > frekTerbaik) {
      frekTerbaik = frek
      terbaik = x
    }
  }
  return terbaik
}

const jumlahBeli = [1, 2, 1, 3, 1, 5, 2, 1, 4, 2]
sl.write(`Jumlah: ${jumlah(jumlahBeli)}`)
sl.write(`Rata-rata: ${rataRata(jumlahBeli)}`)
sl.write(`Median: ${median(jumlahBeli)}`)
sl.write(`Modus: ${modus(jumlahBeli)}`)
```

Beberapa hal baru di `median`:

- `[...data]` membuat salinan larik, supaya larik aslinya tidak ikut berubah urutannya.
- `.sort((a, b) => a - b)` mengurutkan angka dari kecil ke besar. Fungsi panah di dalamnya memberi tahu cara membandingkan dua angka. Bab 6 menjelaskannya.

Perhatikan juga bahwa `rataRata` memanggil `jumlah`. Fungsi kecil yang benar bisa dirangkai menjadi fungsi yang lebih besar.

**Mengapa median penting?** Rata-rata mudah tertarik oleh nilai ekstrem. Bila sembilan pelanggan belanja Rp 50.000 dan satu pelanggan belanja Rp 5.000.000, rata-ratanya Rp 545.000, padahal hampir semua pelanggan belanja jauh lebih sedikit. Mediannya tetap Rp 50.000. Untuk data uang, analis hampir selalu melihat keduanya.

## 5.6 Fungsi dan widget

```slak
const satuan = sl.selectbox("Ubah ke", ["gram", "ons", "kilogram"])
const kg = sl.number_input("Berat (kg)", { min: 0, value: 1.5, step: 0.5 })

function dariKg(nilai, ke) {
  if (ke === "gram") return nilai * 1000
  if (ke === "ons") return nilai * 10
  return nilai
}

const [kiri, kanan] = sl.columns(2)
kiri.metric("Kilogram", kg)
kanan.metric(satuan, dariKg(kg, satuan))
```

> **API Slak baru**
> - `sl.selectbox(label, pilihan)` menampilkan daftar pilihan dan mengembalikan pilihan yang dipilih.
> - `sl.columns(n)` membagi baris menjadi `n` kolom dan mengembalikan larik kolom. Setiap kolom punya semua fungsi tampilan, misalnya `kiri.write(...)`.
> - `sl.metric(label, nilai)` menampilkan angka besar dengan label. Kamu akan sering memakainya untuk dasbor.

Baris `const [kiri, kanan] = sl.columns(2)` mengambil dua isi larik sekaligus ke dua variabel. Cara ini disebut *destructuring* dan dibahas di Bab 7.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Hasil fungsi `undefined` | Lupa `return` | Tambahkan `return hasil` |
| `hitung is not a function` | Memanggil sesuatu yang bukan fungsi, atau salah nama | Periksa nama fungsi dan tanda kurungnya |
| Fungsi panah multi-baris memberi `undefined` | Memakai `{ }` tetapi lupa `return` | Tambahkan `return`, atau buang `{ }` untuk satu ekspresi |
| Larik asli ikut berubah urutan | `data.sort(...)` mengurutkan di tempat | Salin dulu: `[...data].sort(...)` |

## Latihan

**Latihan 5.1 (mudah).** Lengkapi fungsi `luasPersegiPanjang(p, l)`.

```slak latihan

}

await sl.testing.test("4 × 5 = 20", () => sl.testing.expect(luasPersegiPanjang(4, 5)).toBe(20))
await sl.testing.test("2,5 × 2 = 5", () => sl.testing.expect(luasPersegiPanjang(2.5, 2)).toBe(5))
```

**Latihan 5.2 (sedang).** Tulis fungsi panah `rentang` yang mengembalikan selisih nilai terbesar dan terkecil sebuah larik. Petunjuk: `Math.max(...data)` dan `Math.min(...data)`.

```slak latihan

await sl.testing.test("rentang [3, 9, 4] = 6", () => sl.testing.expect(rentang([3, 9, 4])).toBe(6))
await sl.testing.test("rentang [5] = 0", () => sl.testing.expect(rentang([5])).toBe(0))
```

**Latihan 5.3 (tantangan).** Tulis fungsi `rataRataTerpangkas(data)` yang membuang satu nilai terbesar dan satu nilai terkecil, lalu menghitung rata-rata sisanya. Cara ini dipakai juri lomba agar satu nilai ekstrem tidak menentukan hasil.

```slak latihan

  return 0
}

await sl.testing.test("[7, 8, 9, 10, 2] → 8", () => sl.testing.expect(rataRataTerpangkas([7, 8, 9, 10, 2])).toBe(8))
await sl.testing.test("data asli tidak berubah", () => {
  const d = [5, 1, 9]
  rataRataTerpangkas(d)
  sl.testing.expect(d).toEqual([5, 1, 9])
})
```

## Mini-proyek: konverter satuan

```slak
sl.title("Konverter Satuan :straight_ruler:")

const jenis = sl.selectbox("Jenis", ["Suhu", "Panjang", "Mata uang"])

function celsiusKe(c, ke) {
  if (ke === "Fahrenheit") return c * 9 / 5 + 32
  if (ke === "Kelvin") return c + 273.15
  return c
}

function meterKe(m, ke) {
  const faktor = { Sentimeter: 100, Kilometer: 0.001, Kaki: 3.28084 }
  return m * faktor[ke]
}

function rupiahKe(rp, ke, kurs) {
  return rp / kurs[ke]
}

const [kiri, kanan] = sl.columns(2)

if (jenis === "Suhu") {
  const c = kiri.number_input("Celsius", { value: 30 })
  const ke = kanan.selectbox("Ke", ["Fahrenheit", "Kelvin"], { key: "ke_suhu" })
  sl.metric(ke, celsiusKe(c, ke).toFixed(1))
} else if (jenis === "Panjang") {
  const m = kiri.number_input("Meter", { value: 1500 })
  const ke = kanan.selectbox("Ke", ["Kilometer", "Sentimeter", "Kaki"], { key: "ke_panjang" })
  sl.metric(ke, meterKe(m, ke).toFixed(2))
} else {
  const kurs = { USD: 16200, SGD: 12100, AUD: 10500 }   // contoh kurs, bukan kurs hari ini
  const rp = kiri.number_input("Rupiah", { value: 1000000, step: 50000 })
  const ke = kanan.selectbox("Ke", Object.keys(kurs), { key: "ke_uang" })
  sl.metric(ke, rupiahKe(rp, ke, kurs).toFixed(2))
  sl.caption("Kurs contoh, bukan kurs hari ini.")
}
```

Tiga kotak pilihan "Ke" punya isi berbeda, jadi masing-masing diberi `key` sendiri. Slak mengenali widget dari jenis dan labelnya; `key` memberi identitas tetap sehingga pilihan di satu jenis tidak terbawa ke jenis lain. Bab 10 membahas `key` lebih jauh.

`faktor[ke]` dan `kurs[ke]` mengambil nilai dari objek berdasarkan nama. Objek dibahas di Bab 7.

<script type="text/markdown" id="bab-06">
# Bab 6 · Larik (Array)

> **Tujuan belajar**
> - Membuat, membaca, dan mengubah larik.
> - Memakai `push`, `pop`, `slice`, `includes`, dan `indexOf`.
> - Menguasai lima metode terpenting analis data: `map`, `filter`, `reduce`, `sort`, dan `find`.
> - Merangkai beberapa metode dalam satu baris.

Bab ini adalah bab terpenting di Tahap 1. Hampir semua pekerjaan analis data adalah mengubah, menyaring, dan meringkas daftar nilai. Bacalah pelan-pelan dan coba setiap contohnya.

## 6.1 Membuat dan membaca larik

**Larik** (array) adalah daftar nilai berurutan, ditulis di antara kurung siku dan dipisah koma.

```slak
const kota = ["Jayapura", "Sorong", "Manokwari", "Makassar"]

sl.write(kota[0])             // isi pertama
sl.write(kota[2])             // isi ketiga
sl.write(kota.length)         // banyaknya isi
sl.write(kota[kota.length - 1])  // isi terakhir
sl.write(kota[10])            // tidak ada: undefined
```

Posisi isi disebut **indeks** dan dimulai dari **0**. Jadi larik berisi 4 kota punya indeks 0, 1, 2, dan 3.

## 6.2 Mengubah larik

```slak
const keranjang = ["kopi", "sagu"]
keranjang.push("abon")          // tambah di akhir
sl.write(keranjang)
const keluar = keranjang.pop()  // ambil dan buang yang terakhir
sl.write(`Dikeluarkan: ${keluar}`)
keranjang[0] = "kopi robusta"   // ganti isi indeks 0
sl.write(keranjang)
```

Larik yang dibuat dengan `const` tetap boleh diubah isinya. Yang dilarang `const` hanyalah mengganti larik itu dengan larik lain.

## 6.3 Mencari di dalam larik

```slak
const produk = ["Kopi Wamena", "Sagu Lempeng", "Abon Cakalang", "Sambal Roa"]
sl.write(produk.includes("Sambal Roa"))   // ada atau tidak
sl.write(produk.indexOf("Abon Cakalang")) // di indeks berapa
sl.write(produk.indexOf("Teh"))           // -1 berarti tidak ada
sl.write(produk.slice(1, 3))              // potong dari indeks 1 sampai sebelum 3
```

`slice` tidak mengubah larik asli; ia membuat larik baru.

## 6.4 map: ubah setiap isi

`map` menjalankan sebuah fungsi untuk setiap isi larik dan mengumpulkan hasilnya menjadi larik baru yang sama panjang.

```slak
const harga = [85000, 72000, 35000, 48000]
const hargaBaru = harga.map(h => h * 1.05)        // naik 5%
const dalamRibu = harga.map(h => `${h / 1000} rb`)
sl.write(hargaBaru)
sl.write(dalamRibu)
```

Fungsi panah `h => h * 1.05` dipanggil empat kali, sekali untuk setiap harga. `h` berisi harga yang sedang diproses.

Bila kamu juga butuh indeksnya, terima parameter kedua: `harga.map((h, i) => ...)`.

## 6.5 filter: ambil yang memenuhi syarat

`filter` menyimpan isi yang membuat fungsinya bernilai `true`, dan membuang sisanya.

```slak
const omzet = [1250000, 980000, 1430000, 1100000, 1675000, 2010000, 1890000]
const hariRamai = omzet.filter(x => x > 1500000)
sl.write(hariRamai)
sl.write(`${hariRamai.length} dari ${omzet.length} hari ramai`)
```

Bandingkan dengan Latihan 4.2: pekerjaan yang dulu butuh lima baris perulangan kini cukup satu baris.

## 6.6 reduce: ringkas menjadi satu nilai

`reduce` adalah pola akumulator dari Bab 4 dalam bentuk fungsi.

```slak
const omzetMinggu = [1250000, 980000, 1430000, 1100000, 1675000, 2010000, 1890000]
const total = omzetMinggu.reduce((acc, x) => acc + x, 0)
const tertinggi = omzetMinggu.reduce((acc, x) => x > acc ? x : acc, omzetMinggu[0])
sl.write(`Total: ${total}`)
sl.write(`Tertinggi: ${tertinggi}`)
```

Cara membacanya:

- `acc` (akumulator) adalah penampung. Isi awalnya argumen kedua `reduce`, yaitu `0`.
- Untuk setiap `x`, fungsi mengembalikan nilai `acc` yang baru.
- Setelah semua isi diproses, `reduce` mengembalikan `acc` terakhir.

| Putaran | `acc` sebelum | `x` | `acc` sesudah |
|---|---|---|---|
| 1 | 0 | 1.250.000 | 1.250.000 |
| 2 | 1.250.000 | 980.000 | 2.230.000 |
| 3 | 2.230.000 | 1.430.000 | 3.660.000 |
| … | … | … | … |

## 6.7 sort: mengurutkan

```slak
const angka = [10, 9, 100, 25]
sl.write([...angka].sort())                  // salah untuk angka!
sl.write([...angka].sort((a, b) => a - b))   // kecil ke besar
sl.write([...angka].sort((a, b) => b - a))   // besar ke kecil
```

Tanpa fungsi pembanding, `sort` mengurutkan sebagai **teks**, sehingga `100` dianggap lebih kecil dari `25` (karena `"1"` lebih awal daripada `"2"`). Untuk angka, selalu beri pembanding:

- `(a, b) => a - b` mengurutkan naik.
- `(a, b) => b - a` mengurutkan turun.

`sort` mengubah larik aslinya. Karena itu contoh di atas menyalin larik dulu dengan `[...angka]`.

Untuk teks berbahasa Indonesia, pakai `localeCompare`:

```slak
const nama = ["yosef", "Agus", "ani", "Benny"]
sl.write([...nama].sort((a, b) => a.localeCompare(b, "id")))
```

## 6.8 find dan some

```slak
const stok = [12, 0, 7, 0, 3, 25]
sl.write(stok.find(x => x > 10))        // isi pertama yang cocok
sl.write(stok.findIndex(x => x === 0))  // indeks pertama yang cocok
sl.write(stok.some(x => x === 0))       // adakah yang kosong?
sl.write(stok.every(x => x >= 0))       // semuanya tidak negatif?
```

## 6.9 Merangkai metode

Karena `map` dan `filter` mengembalikan larik baru, metode bisa dirangkai. Bacalah dari kiri ke kanan seperti kalimat.

```slak
const transaksi = [120000, 45000, 310000, 89000, 560000, 22000, 410000]

const totalBesarSetelahPajak = transaksi
  .filter(t => t >= 100000)     // ambil transaksi besar
  .map(t => t * 1.11)           // tambahkan PPN 11%
  .reduce((a, t) => a + t, 0)   // jumlahkan

sl.write(Math.round(totalBesarSetelahPajak))
```

"Ambil transaksi minimal 100 ribu, tambahkan pajak, lalu jumlahkan." Pola **saring → ubah → ringkas** ini adalah inti analisis data. Di Tahap 2, Slak Data memberi nama lain untuk langkah yang sama: `filter`, `assign`, dan `agg`.

## 6.10 Memilih banyak sekaligus

```slak
const semuaKota = ["Jayapura", "Sorong", "Manokwari", "Makassar", "Ambon"]
const dipilih = sl.multiselect("Pilih cabang", semuaKota, { default: ["Jayapura", "Sorong"] })
sl.write(`Kamu memilih ${dipilih.length} cabang: ${dipilih.join(", ")}`)
```

> **API Slak baru**
> - `sl.multiselect(label, pilihan, { default })` mengembalikan **larik** berisi pilihan yang dipilih.

`join(", ")` menyambung isi larik menjadi satu teks dengan pemisah koma.

> **Coba di playground**
> Pada contoh 6.9, ganti batas 100000 menjadi 300000, lalu ganti `.reduce(...)` dengan `.length` untuk menghitung banyaknya transaksi besar.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Urutan angka aneh, misalnya 10, 100, 25, 9 | `sort()` tanpa pembanding | `sort((a, b) => a - b)` |
| `map` menghasilkan larik berisi `undefined` | Fungsi panah memakai `{ }` tanpa `return` | Hapus `{ }` atau tambahkan `return` |
| `reduce of empty array with no initial value` | Lupa nilai awal pada larik kosong | Selalu beri argumen kedua, misalnya `0` |
| `Cannot read properties of undefined` | Indeks di luar batas | Ingat indeks terakhir adalah `length - 1` |

## Mini-proyek: daftar nilai siswa

```slak
sl.title("Daftar Nilai Siswa :books:")

const nilaiSiswa = [78, 65, 92, 88, 71, 55, 83, 95]

daftar = daftar.filter(p => p[1] >= batas)

if (urutan === "Nilai tertinggi") daftar.sort((a, b) => b[1] - a[1])
else if (urutan === "Nilai terendah") daftar.sort((a, b) => a[1] - b[1])
else daftar.sort((a, b) => a[0].localeCompare(b[0], "id"))

const rata = daftar.length ? daftar.reduce((s, p) => s + p[1], 0) / daftar.length : 0

}
```

<script type="text/markdown" id="bab-07">
# Bab 7 · Objek dan Larik Objek

> **Tujuan belajar**
> - Membuat objek dan membaca propertinya dengan titik dan kurung siku.
> - Memakai destructuring dan spread.
> - Memahami bahwa satu baris data adalah satu objek, dan satu tabel adalah larik objek.
> - Menampilkan larik objek sebagai tabel dengan Slak.

## 7.1 Objek: satu benda, banyak keterangan

Di Bab 6, nama dan nilai siswa disimpan di dua larik terpisah. Repot dan mudah tertukar. **Objek** menyimpan beberapa keterangan tentang satu benda di satu tempat, masing-masing diberi nama.

```slak
const produk = {
  nama: "Kopi Arabika Wamena 250g",
  kategori: "Minuman",
  harga: 85000,
  stok: 24,
  tersedia: true
}

sl.write(produk.nama)
sl.write(produk["harga"])
sl.write(produk)
```

- Isi objek ditulis sebagai pasangan `nama: nilai`, dipisah koma, di antara kurung kurawal.
- Setiap pasangan disebut **properti**.
- Baca properti dengan titik (`produk.nama`) atau kurung siku (`produk["harga"]`).

Kurung siku wajib dipakai bila nama propertinya disimpan di variabel:

```slak
const barang = { nama: "Sagu Lempeng", harga: 30000, stok: 40 }
const kolom = sl.selectbox("Tampilkan kolom", ["nama", "harga", "stok"])
sl.write(barang[kolom])
```

## 7.2 Mengubah dan menambah properti

```slak
const item = { nama: "Sambal Roa 200g", harga: 45000 }
item.harga = 47000          // ubah
item.stok = 30              // tambah properti baru
delete item.stok            // hapus
sl.write(item)
sl.write("stok" in item)    // apakah properti ada?
```

`Object.keys`, `Object.values`, dan `Object.entries` mengubah objek menjadi larik, sehingga semua metode Bab 6 bisa dipakai:

```slak
const omzetKota = { Jayapura: 4200000, Sorong: 3100000, Manokwari: 1800000 }
sl.write(Object.keys(omzetKota))
sl.write(Object.values(omzetKota).reduce((a, b) => a + b, 0))
for (const [kota, omzet] of Object.entries(omzetKota)) {
  sl.write(`${kota}: ${omzet}`)
}
```

## 7.3 Destructuring dan spread

**Destructuring** mengambil beberapa properti sekaligus ke variabel:

```slak
const trx = { id: "TN000123", kota: "Ambon", total: 170000, kanal: "Online" }
const { kota, total } = trx
sl.write(`${kota}: ${total}`)

const [pertama, kedua] = ["Jayapura", "Sorong", "Manokwari"]
sl.write(pertama + " dan " + kedua)
```

**Spread** (`...`) menyalin isi objek atau larik ke tempat baru:

```slak
const dasar = { kategori: "Minuman", pemasok: "Koperasi Baliem" }
const kopi = { ...dasar, nama: "Kopi Wamena", harga: 85000 }
const kopiPromo = { ...kopi, harga: 76500 }   // salinan dengan harga berbeda
sl.write(kopi)
sl.write(kopiPromo)
```

Salinan dengan spread tidak mengubah objek asli. Kebiasaan ini membuat kode analisis aman: data mentah tetap utuh, hasil olahan disimpan di variabel baru.

## 7.4 Larik objek adalah tabel

Inilah gagasan terpenting bab ini: **satu baris data = satu objek, satu tabel = larik objek.**

```slak
const penjualan = [
  { tanggal: "2024-03-01", kota: "Jayapura", produk: "Kopi Wamena", jumlah: 2, harga: 85000 },
  { tanggal: "2024-03-01", kota: "Sorong", produk: "Sagu Lempeng", jumlah: 5, harga: 30000 },
  { tanggal: "2024-03-02", kota: "Jayapura", produk: "Sambal Roa", jumlah: 3, harga: 45000 },
  { tanggal: "2024-03-02", kota: "Manokwari", produk: "Kopi Wamena", jumlah: 1, harga: 85000 }
]

sl.table(penjualan)
```

Setiap objek menjadi satu baris, dan setiap nama properti menjadi judul kolom. Semua yang kamu pelajari di Bab 6 langsung berlaku:

```slak
const jual = [
  { kota: "Jayapura", produk: "Kopi Wamena", jumlah: 2, harga: 85000 },
  { kota: "Sorong", produk: "Sagu Lempeng", jumlah: 5, harga: 30000 },
  { kota: "Jayapura", produk: "Sambal Roa", jumlah: 3, harga: 45000 },
  { kota: "Manokwari", produk: "Kopi Wamena", jumlah: 1, harga: 85000 }
]

// tambah kolom total
const denganTotal = jual.map(r => ({ ...r, total: r.jumlah * r.harga }))

// saring Jayapura
const jayapura = denganTotal.filter(r => r.kota === "Jayapura")

// ringkas
const omzetJayapura = jayapura.reduce((a, r) => a + r.total, 0)

sl.dataframe(denganTotal)
sl.metric("Omzet Jayapura", omzetJayapura)
```

Perhatikan `r => ({ ...r, total: ... })`. Objek yang dikembalikan fungsi panah harus diapit kurung biasa, supaya JavaScript tidak mengira `{` sebagai awal blok kode.

> **API Slak baru**
> - `sl.table(data)` menampilkan tabel statis.
> - `sl.dataframe(data)` menampilkan tabel interaktif: kolomnya bisa diurutkan dengan mengeklik judul, dan ada tombol unduh CSV.
> - `sl.metric(label, nilai, delta)` menampilkan angka besar. Argumen ketiga (opsional) adalah perubahan, misalnya `"+12%"`, yang tampil hijau atau merah.

## 7.5 Dataset bawaan Slak

Slak Data menyediakan beberapa dataset contoh yang selalu tersedia, tanpa berkas apa pun. Salah satunya `penjualan`: 3.278 transaksi toko di Papua tahun 2023–2024.

```html
<script src="slak.js"><\/script>
<script src="slak-data.js"><\/script>
```

Dataset bawaan butuh `slak-data.js`. Playground, Slak Studio, dan halaman buku ini sudah memuatnya.

```slak
const df = sl.dataset("penjualan")
const baris = df.to_records()     // ubah menjadi larik objek biasa

sl.write(`Banyak baris: ${baris.length}`)
sl.write(baris[0])
sl.dataframe(baris.slice(0, 5))
```

> **API Slak baru**
> - `sl.dataset(nama)` mengembalikan dataset contoh sebagai DataFrame, yaitu tabel milik Slak Data (Bab 14).
> - `df.to_records()` mengubah DataFrame menjadi larik objek biasa, supaya bisa kamu olah dengan JavaScript murni.

Sampai Bab 13, kamu mengolah data dengan JavaScript murni: `filter`, `map`, `reduce`. Itu disengaja. Setelah paham caranya, Slak Data akan terasa wajar, bukan sihir.

```slak
const rows = sl.dataset("penjualan").to_records()
const online = rows.filter(r => r.kanal === "Online")
const omzetOnline = online.reduce((a, r) => a + r.total, 0)
const omzetSemua = rows.reduce((a, r) => a + r.total, 0)

const [k1, k2] = sl.columns(2)
k1.metric("Omzet online", omzetOnline)
k2.metric("Porsi online", (omzetOnline / omzetSemua * 100).toFixed(1) + "%")
```

> **Coba di playground**
> Ganti `"Online"` dengan `"Toko"`, lalu coba saring berdasarkan kota, misalnya `r.kota === "Sorong"`.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| `Cannot read properties of undefined (reading 'harga')` | Objeknya tidak ada, misalnya `find` tidak menemukan apa-apa | Periksa dulu: `if (p) { ... }` atau pakai `p?.harga` |
| Properti bernilai `undefined` | Salah ketik nama properti, atau beda huruf besar-kecil | Lihat isi objek dengan `sl.write(obj)` |
| `map` mengembalikan `undefined` saat membuat objek | Menulis `r => { ...r }` | Apit dengan kurung: `r => ({ ...r })` |
| Data asli ikut berubah | Mengubah `r.total = ...` di dalam `map` | Buat salinan: `({ ...r, total: ... })` |

## Latihan

**Latihan 7.1 (mudah).** Buat objek `cabang` dengan properti `kota` bernilai `"Ambon"` dan `buka` bernilai `2021`.

```slak latihan

sl.write(cabang)
await sl.testing.test("kota Ambon", () => sl.testing.expect(cabang.kota).toBe("Ambon"))
await sl.testing.test("buka 2021", () => sl.testing.expect(cabang.buka).toBe(2021))
```

sl.metric("Omzet pakaian", omzetPakaian)
await sl.testing.test("omzet pakaian benar", () => sl.testing.expect(omzetPakaian).toBe(
  rows.filter(r => r.kategori === "Pakaian").reduce((a, r) => a + r.total, 0)))
await sl.testing.test("tidak nol", () => sl.testing.expect(omzetPakaian).toBeGreaterThan(0))
```

// isi dengan perulangan

  sl.testing.expect(Object.values(omzetPerKota).reduce((a, b) => a + b, 0)).toBe(data.reduce((a, r) => a + r.total, 0)))
```

Pola di latihan 7.3 disebut **mengelompokkan** (group by). Di Bab 15 Slak Data melakukannya dengan satu perintah `groupby`.

<script type="text/markdown" id="bab-08">
# Bab 8 · Teks, Angka, dan Tanggal

> **Tujuan belajar**
> - Mengolah teks: `trim`, `toLowerCase`, `split`, `replace`, `includes`, `padStart`.
> - Membulatkan angka dan menampilkan Rupiah dengan format Indonesia.
> - Membuat, membaca, dan menghitung selisih tanggal dengan `Date`.
> - Menampilkan tanggal berbahasa Indonesia.

## 8.1 Metode teks yang paling sering dipakai

Teks (string) punya banyak metode bawaan. Semuanya **mengembalikan teks baru**; teks aslinya tidak berubah.

```slak
const mentah = "  Kopi Arabika WAMENA  "
sl.write(`[${mentah.trim()}]`)          // buang spasi di awal dan akhir
sl.write(mentah.trim().toLowerCase())    // huruf kecil semua
sl.write(mentah.trim().toUpperCase())    // huruf besar semua
sl.write(mentah.includes("Arabika"))     // memuat kata?
sl.write(mentah.trim().length)           // panjang teks
```

```slak
const baris = "TN000123;2024-03-01;Jayapura;85000"
const bagian = baris.split(";")          // pecah menjadi larik
sl.write(bagian)
sl.write(bagian[2])

const kode = "7"
sl.write(kode.padStart(4, "0"))          // "0007"
sl.write("Kopi Wamena".replace("Wamena", "Toraja"))
sl.write("a-b-c".replaceAll("-", "/"))
```

`split` sangat penting untuk analis data. Berkas CSV pada dasarnya adalah teks yang dipecah per baris, lalu per koma. Di Bab 11 kamu akan membaca CSV dengan `split` sebelum memakai pembaca CSV milik Slak.

### Membersihkan teks dengan pola

Kadang yang ingin dibuang bukan satu kata, tetapi "semua yang bukan angka". Untuk itu ada **ekspresi reguler** (regex), pola yang ditulis di antara garis miring. Kamu cukup mengenal satu pola ini:

```slak
const hargaTeks = "Rp 1.250.000"
const hanyaAngka = hargaTeks.replace(/[^0-9]/g, "")
sl.write(hanyaAngka)
sl.write(Number(hanyaAngka) + 50000)
```

`/[^0-9]/g` artinya "setiap karakter yang bukan 0 sampai 9, di seluruh teks". Menggantinya dengan `""` menyisakan angkanya saja.

## 8.2 Membulatkan angka

```slak
const x = 1234.5678
sl.write(Math.round(x))        // 1235
sl.write(Math.floor(x))        // 1234
sl.write(Math.ceil(x))         // 1235
sl.write(x.toFixed(2))         // "1234.57" (teks!)
sl.write(Math.round(x * 100) / 100)  // 1234.57 (angka)
```

Perhatikan hasilnya di layar: `sl.write` menampilkan **angka** dengan gaya Indonesia (`1.235` dan `1.234,57`), sedangkan **teks** hasil `toFixed` tampil apa adanya (`1234.57`).

`toFixed` mengembalikan **teks**. Pakai untuk menampilkan, bukan untuk dihitung lagi.

## 8.3 Format Rupiah dan angka Indonesia

Orang Indonesia menulis ribuan dengan titik dan desimal dengan koma: `1.250.000,50`. JavaScript menyediakan `Intl.NumberFormat` untuk menulis angka sesuai kebiasaan negara mana pun.

```slak
const rupiah = new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 })
const angkaID = new Intl.NumberFormat("id-ID")
const persen = new Intl.NumberFormat("id-ID", { style: "percent", maximumFractionDigits: 1 })

sl.write(rupiah.format(1250000))
sl.write(angkaID.format(3278.5))
sl.write(persen.format(0.1234))
sl.write((1250000).toLocaleString("id-ID"))   // cara singkat
```

Buat formatnya sekali di variabel, lalu pakai berulang. Membuatnya ulang di setiap baris memperlambat program saat datanya ribuan.

`sl.metric` juga bisa memformat sendiri. Opsi `format: "rp"` menampilkan Rupiah:

```slak
sl.metric("Omzet Maret", 48250000, "+8%", { format: "rp" })
```

## 8.4 Tanggal dengan Date

```slak
const hariIni = new Date()
const tanggalTetap = new Date("2024-04-10")      // dari teks ISO: tahun-bulan-hari
const dariAngka = new Date(2024, 3, 10)          // bulan dihitung dari 0: 3 = April!

sl.write(`Tahun ini: ${hariIni.getFullYear()}`)
sl.write(`Bulan: ${tanggalTetap.getMonth() + 1}`)   // tambah 1 agar menjadi 1–12
sl.write(`Tanggal: ${dariAngka.getDate()}`)
sl.write(`Hari ke: ${dariAngka.getDay()}`)          // 0 = Minggu, 1 = Senin, ...
```

Dua jebakan yang paling sering:

1. **Bulan dihitung dari 0.** Januari adalah 0, Desember adalah 11. Selalu tambah 1 saat menampilkan.
2. **Teks tanggal sebaiknya berformat ISO** `"2024-04-10"`. Format lain seperti `"10/04/2024"` dibaca berbeda-beda oleh tiap browser. Slak Data membaca format Indonesia dengan benar (Bab 11), tetapi `new Date` biasa tidak.

### Selisih hari

Di balik layar, tanggal disimpan sebagai jumlah milidetik sejak 1 Januari 1970. Selisih dua tanggal adalah selisih milidetiknya.

```slak
const MS_SEHARI = 24 * 60 * 60 * 1000
const awal = new Date("2024-01-01")
const lebaran = new Date("2024-04-10")
const selisih = Math.round((lebaran - awal) / MS_SEHARI)
sl.write(`${selisih} hari dari awal tahun sampai Lebaran 2024`)
```

### Tanggal berbahasa Indonesia

```slak
const t = new Date("2024-04-10")
const panjang = new Intl.DateTimeFormat("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" })
const pendek = new Intl.DateTimeFormat("id-ID", { day: "2-digit", month: "short", year: "numeric" })
sl.write(panjang.format(t))
sl.write(pendek.format(t))
sl.write(t.toISOString().slice(0, 10))   // kembali ke format ISO
```

Slak juga punya `sl.strftime` bila kamu terbiasa dengan format gaya Python:

```slak
sl.write(sl.strftime(new Date("2024-04-10"), "%A, %d %B %Y"))
```

## 8.5 Memilih tanggal

```slak
const tgl = sl.date_input("Tanggal transaksi", "2024-04-10")
sl.write(typeof tgl)
sl.write(tgl)
```

> **API Slak baru**
> - `sl.date_input(label, nilaiAwal)` mengembalikan tanggal sebagai **teks** `"YYYY-MM-DD"`. Ubah dengan `new Date(tgl)` bila ingin menghitung.
> - `sl.strftime(tanggal, pola)` memformat tanggal dengan pola seperti `%d`, `%B`, `%Y`, `%A`.

> **Coba di playground**
> Ganti `weekday: "long"` menjadi `weekday: "short"`, dan `month: "long"` menjadi `month: "2-digit"`. Lihat bedanya.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Tanggal mundur satu bulan | Lupa bulan dihitung dari 0 | `getMonth() + 1`, atau `new Date(2024, 3, 10)` untuk April |
| `Invalid Date` | Format teks tidak dikenali, misalnya `"10-04-2024"` | Pakai ISO `"2024-04-10"` |
| `toFixed is not a function` | Memanggilnya pada teks, bukan angka | Ubah dulu dengan `Number(...)` |
| Rupiah tampil `1250000` tanpa titik | Angka ditampilkan apa adanya | Pakai `Intl.NumberFormat("id-ID")` |

## Latihan

**Latihan 8.1 (mudah).** Ubah teks `"  makassar "` menjadi `"Makassar"`: tanpa spasi berlebih, huruf pertama besar.

```slak latihan
const mentah = "  makassar "
const rapi = mentah   // ganti

sl.write(`[${rapi}]`)
await sl.testing.test("menjadi Makassar", () => sl.testing.expect(rapi).toBe("Makassar"))
```

**Latihan 8.2 (sedang).** Lengkapi `keAngka(teks)` yang mengubah teks harga seperti `"Rp 42.000"` atau `"42000"` menjadi angka `42000`.

```slak latihan
function keAngka(teks) {
  return teks
}

await sl.testing.test('"Rp 42.000" → 42000', () => sl.testing.expect(keAngka("Rp 42.000")).toBe(42000))
await sl.testing.test('"42000" → 42000', () => sl.testing.expect(keAngka("42000")).toBe(42000))
await sl.testing.test('"Rp 1.250.000" → 1250000', () => sl.testing.expect(keAngka("Rp 1.250.000")).toBe(1250000))
```

**Latihan 8.3 (tantangan).** Lengkapi `selisihHari(a, b)` untuk dua teks tanggal ISO, lalu `namaHari(teks)` yang mengembalikan nama hari berbahasa Indonesia.

```slak latihan
function selisihHari(a, b) {
  return 0
}
function namaHari(teks) {
  return ""
}

await sl.testing.test("1 Jan → 10 Apr 2024 = 100 hari", () => sl.testing.expect(selisihHari("2024-01-01", "2024-04-10")).toBe(100))
await sl.testing.test("17 Agustus 1945 hari Jumat", () => sl.testing.expect(namaHari("1945-08-17")).toBe("Jumat"))
```

## Mini-proyek: kalkulator umur dan hitung mundur

```slak
sl.title("Kalkulator Umur dan Hitung Mundur :calendar:")

const MS_HARI = 24 * 60 * 60 * 1000
const fmt = new Intl.DateTimeFormat("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" })

const lahir = new Date(sl.date_input("Tanggal lahir", "2004-05-21"))
const acara = new Date(sl.date_input("Tanggal acara", "2026-12-25"))
const hari = new Date(sl.date_input("Anggap hari ini", "2026-11-09"))

let umur = hari.getFullYear() - lahir.getFullYear()
const sudahUlangTahun =
  hari.getMonth() > lahir.getMonth() ||
  (hari.getMonth() === lahir.getMonth() && hari.getDate() >= lahir.getDate())
if (!sudahUlangTahun) umur--

const sisa = Math.ceil((acara - hari) / MS_HARI)

const [a, b] = sl.columns(2)
a.metric("Umur", `${umur} tahun`)
b.metric("Menuju acara", sisa >= 0 ? `${sisa} hari` : "sudah lewat")

sl.write(`Kamu lahir pada hari **${fmt.format(lahir).split(",")[0]}**.`)

"Anggap hari ini" sengaja dibuat bisa diubah, supaya kamu bisa menguji perhitungannya. Dalam aplikasi sungguhan, ganti dengan `new Date()`.
