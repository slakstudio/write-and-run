<script type="text/markdown" id="bab-15">
# Bab 15 · Meringkas Data

> **Tujuan belajar**
> - Mengelompokkan data dengan `groupby` dan meringkasnya dengan `agg`.
> - Menghitung frekuensi dengan `value_counts` dan tabel silang dengan `sl.crosstab`.
> - Membuat tabel pivot.
> - Menghitung porsi dan kontribusi terhadap total.
> - Menyusun peringkat dengan `nlargest` dan `nsmallest`.
> - Menampilkan angka utama dengan perubahan naik atau turun.

Data mentah berisi ribuan baris. Manajer tidak membaca ribuan baris; ia ingin tahu **cabang mana yang paling laku**, **produk apa yang menyumbang omzet terbesar**, dan **apakah bulan ini lebih baik dari bulan lalu**. Meringkas adalah jembatan dari data ke jawaban.

## 15.1 Group by: dari Bab 7 ke satu perintah

Di Latihan 7.3 kamu menghitung omzet per kota dengan perulangan dan objek. Itulah *group by*: membagi baris ke dalam kelompok, lalu meringkas setiap kelompok.

```slak
const rows = (await sl.read_csv("toko-nusantara.csv")).to_records()

// cara Bab 7: JavaScript murni
const perKotaManual = {}
for (const r of rows) perKotaManual[r.kota] = (perKotaManual[r.kota] || 0) + r.total
sl.json(perKotaManual)
```

Dengan Slak Data:

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const perKota = df.groupby("kota").agg({
  omzet: ["total", "sum"],
  transaksi: ["id_transaksi", "nunique"],
  rata_rata: ["total", "mean"]
}).sort_values("omzet", { ascending: false })

sl.dataframe(perKota, { format: { omzet: "rupiah", rata_rata: "rupiah" } })
```

Cara membaca `agg`: setiap kolom hasil ditulis sebagai `nama_baru: [kolom_asal, fungsi]`. Jadi `omzet: ["total", "sum"]` artinya "kolom baru `omzet` berisi jumlah kolom `total` per kelompok".

| Fungsi agregasi | Arti |
|---|---|
| `sum`, `mean`, `median` | Jumlah, rata-rata, nilai tengah |
| `min`, `max` | Terkecil, terbesar |
| `count` | Banyak nilai yang terisi |
| `size` | Banyak baris |
| `nunique` | Banyak nilai unik, misalnya pelanggan berbeda |
| `std`, `var` | Simpangan baku, varians |
| `p10` … `p99` | Persentil, misalnya `p90` |

Mengelompokkan berdasarkan dua kolom sekaligus:

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const kotaKanal = df.groupby(["kota", "kanal"]).agg({ omzet: ["total", "sum"] })
sl.dataframe(kotaKanal.head(10))
```

> **API Slak baru**
> - `df.groupby(kolom)` mengelompokkan; lanjutkan dengan `.agg({ nama: [kolom, fungsi] })`. Pintasan: `.sum()`, `.mean()`, `.size()`.
> - `sl.dataframe(df, { format })` merapikan angka per kolom: `"rupiah"`, `"percent"`, `"compact"`, `"decimal:2"`.

## 15.2 Frekuensi

Sering kali yang ditanyakan bukan "berapa jumlahnya" tetapi "berapa kali muncul".

```slak
const df = await sl.read_csv("toko-nusantara.csv")
sl.dataframe(df.value_counts("kategori"))
sl.dataframe(df.value_counts("kanal", { normalize: true }))
```

`normalize: true` mengubah hitungan menjadi proporsi.

**Tabel silang** menghitung frekuensi dua kolom sekaligus:

```slak
const df = await sl.read_csv("toko-nusantara.csv")
sl.dataframe(sl.crosstab(df.kategori, df.kanal))
sl.dataframe(sl.crosstab(df.kategori, df.kanal, { normalize: "index" }), { format: { Online: "percent", Toko: "percent" } })
```

Tabel kedua menjawab pertanyaan menarik: kategori mana yang paling banyak dibeli secara online?

## 15.3 Tabel pivot

Tabel pivot adalah ringkasan dua arah, persis seperti PivotTable di Excel: satu kolom menjadi baris, satu kolom menjadi kolom, dan sel berisi ringkasan.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const pivot = df
  .assign({ tahun: () => df.tanggal.dt.year })
  .pivot_table({ index: "kategori", columns: "tahun", values: "total", aggfunc: "sum", margins: true })
sl.dataframe(pivot, { format: "compact" })
```

`margins: true` menambah baris dan kolom total.

> **API Slak baru**
> - `df.value_counts(kolom, { normalize })` menghitung frekuensi.
> - `sl.crosstab(series1, series2, { normalize })` membuat tabel silang.
> - `df.pivot_table({ index, columns, values, aggfunc, margins })` membuat tabel pivot.

## 15.4 Porsi dan kontribusi

Angka mutlak tanpa pembanding sulit dinilai. "Omzet Ambon 20 juta" belum berarti apa-apa sampai kamu tahu itu 6% dari total.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const perKategori = df.groupby("kategori").agg({ omzet: ["total", "sum"] })
const total = perKategori.omzet.sum()

const urut = perKategori
  .assign({ porsi: r => r.omzet / total })
  .sort_values("porsi", { ascending: false })
const kontribusi = urut.assign({ kumulatif: () => urut.porsi.cumsum() })

sl.dataframe(kontribusi, { format: { omzet: "rupiah", porsi: "percent", kumulatif: "percent" } })
```

Kolom `kumulatif` menjumlahkan porsi dari atas ke bawah. Dua kategori teratas menyumbang lebih dari separuh omzet. Pola "sebagian kecil menyumbang sebagian besar" ini sering ditemukan, dan Bab 22 membahasnya sebagai analisis Pareto.

Perhatikan bahwa `kumulatif` dihitung dari `urut`, DataFrame yang sudah diurutkan. Urutan penting: jumlah kumulatif selalu dihitung dari atas ke bawah.

## 15.5 Peringkat

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const perProduk = df.groupby("produk").agg({ terjual: ["jumlah", "sum"], omzet: ["total", "sum"] })

const [kiri, kanan] = sl.columns(2)
kiri.subheader("5 terlaris")
kiri.dataframe(perProduk.nlargest(5, "terjual"))
kanan.subheader("5 paling sepi")
kanan.dataframe(perProduk.nsmallest(5, "terjual"))
```

> **API Slak baru**
> - `df.nlargest(n, kolom)` dan `df.nsmallest(n, kolom)` mengambil `n` baris dengan nilai terbesar atau terkecil.
> - `sl.subheader(teks)` menampilkan judul kecil.

## 15.6 Angka utama dan perubahannya

Dasbor yang baik dibuka dengan beberapa angka utama, masing-masing dibandingkan dengan periode sebelumnya.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const thn = df.assign({ tahun: () => df.tanggal.dt.year })
const t23 = thn.query("tahun == 2023"), t24 = thn.query("tahun == 2024")

const persen = new Intl.NumberFormat("id-ID", { style: "percent", maximumFractionDigits: 1, signDisplay: "always" })
const ubah = (a, b) => persen.format(b / a - 1)

const [a, b, c] = sl.columns(3)
a.metric("Omzet 2024", t24.total.sum(), ubah(t23.total.sum(), t24.total.sum()), { format: "rp" })
b.metric("Transaksi 2024", t24.shape[0], ubah(t23.shape[0], t24.shape[0]))
c.metric("Rata-rata per transaksi", Math.round(t24.total.mean()), ubah(t23.total.mean(), t24.total.mean()), { format: "rp" })
```

Argumen ketiga `sl.metric` adalah perubahannya. Slak mewarnainya hijau bila naik dan merah bila turun. Untuk angka yang lebih baik bila turun, misalnya biaya atau keluhan, tambahkan `delta_color: "inverse"`.

> **Coba di playground**
> Ganti `"kategori"` di contoh 15.4 dengan `"kota"`. Berapa kota yang menyumbang separuh omzet?

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| `Kolom "omzet" tidak ada` setelah `groupby` | Lupa memberi nama kolom hasil di `agg` | Tulis `omzet: ["total", "sum"]` |
| Banyak pelanggan terlalu besar | Memakai `count` | Pakai `nunique` untuk menghitung yang berbeda |
| Porsi berjumlah lebih dari 100% | Pembagi diambil dari data yang sudah disaring | Hitung total dari data yang sama |
| Tahun tampil `2.023` | Angka tahun diformat ribuan | Ubah ke teks, misalnya `String(tahun)` |

## Latihan

**Latihan 15.1 (mudah).** Hitung `nPelanggan`, banyaknya pelanggan berbeda di seluruh data.

```slak latihan
const df = await sl.read_csv("toko-nusantara.csv")
const nPelanggan = 0   // ganti

sl.metric("Pelanggan", nPelanggan)
await sl.testing.test("banyak pelanggan benar", () => sl.testing.expect(nPelanggan).toBe(new Set(df.pelanggan_id.to_list()).size))
```

**Latihan 15.2 (sedang).** Buat `perCabang` berisi kolom `cabang`, `omzet` (jumlah total), dan `pelanggan` (banyak pelanggan berbeda), diurutkan dari omzet terbesar.

```slak latihan
const df = await sl.read_csv("toko-nusantara.csv")
const perCabang = sl.DataFrame([])   // ganti: groupby + agg + sort_values

sl.dataframe(perCabang)
await sl.testing.test("10 cabang", () => sl.testing.expect(perCabang.shape[0]).toBe(10))
await sl.testing.test("kolom benar", () => sl.testing.expect(perCabang.columns).toEqual(["cabang", "omzet", "pelanggan"]))
await sl.testing.test("teratas Surabaya", () => sl.testing.expect(perCabang.to_records()[0].cabang).toBe("Nusantara Surabaya"))
```

**Latihan 15.3 (tantangan).** Berapa persen omzet kategori Minuman yang berasal dari kanal Online? Simpan sebagai angka 0 sampai 1 di `porsiOnline`.

```slak latihan

sl.metric("Porsi online kategori Minuman", (porsiOnline * 100).toFixed(1) + "%")
const m = df.filter(r => r.kategori === "Minuman")
await sl.testing.test("porsi benar", () => sl.testing.expect(porsiOnline).toBeCloseTo(m.filter(r => r.kanal === "Online").total.sum() / m.total.sum(), 6))
```

## Mini-proyek: ringkasan penjualan per cabang dan kategori

```slak
sl.title("Ringkasan Penjualan :bar_chart:")

const df = await sl.read_csv("toko-nusantara.csv")
const tahun = sl.radio("Tahun", ["2023", "2024", "Semua"], { horizontal: true, index: 1 })
const data = tahun === "Semua" ? df : df.filter(r => r.tanggal.getFullYear() === Number(tahun))

const [a, b, c] = sl.columns(3)
a.metric("Omzet", data.total.sum(), null, { format: "rp" })
b.metric("Transaksi", data.shape[0])
c.metric("Pelanggan", data.pelanggan_id.nunique())

const dimensi = sl.selectbox("Ringkas menurut", ["cabang", "kategori", "kanal", "produk"])
const ringkas = data.groupby(dimensi).agg({
  omzet: ["total", "sum"],
  transaksi: ["id_transaksi", "nunique"],
  pelanggan: ["pelanggan_id", "nunique"]
}).sort_values("omzet", { ascending: false })

const total = ringkas.omzet.sum()
sl.dataframe(ringkas.assign({ porsi: r => r.omzet / total }),
  { format: { omzet: "rupiah", porsi: "percent" }, gradient: ["omzet"] })

const juara = ringkas.to_records()[0]
sl.success(`Teratas: **${juara[dimensi]}**, ${(juara.omzet / total * 100).toFixed(1)}% dari omzet.`)
```

Opsi `gradient` mewarnai sel dari muda ke tua sesuai nilainya, sehingga yang terbesar langsung terlihat.

<script type="text/markdown" id="bab-16">
# Bab 16 · Visualisasi Dasar

> **Tujuan belajar**
> - Memilih grafik yang tepat untuk pertanyaan yang tepat.
> - Menyiapkan data agar siap digambar.
> - Memberi judul, label, teks pengganti, dan warna yang jujur.
> - Mengenali grafik yang menyesatkan.

## 16.1 Mulai dari pertanyaan, bukan dari grafik

Grafik yang baik menjawab satu pertanyaan dengan sekali lihat. Sebelum memilih grafik, tulis dulu pertanyaannya.

| Pertanyaan | Grafik | Perintah |
|---|---|---|
| Bagaimana perubahannya dari waktu ke waktu? | Garis | `sl.line_chart` |
| Kategori mana yang paling besar? | Batang, diurutkan | `sl.bar_chart` |
| Bagaimana total menumpuk dari beberapa bagian sepanjang waktu? | Area | `sl.area_chart` |
| Apakah X berhubungan dengan Y? | Sebar | `sl.scatter_chart` |
| Bagaimana sebaran nilainya? | Histogram | `sl.histogram` |
| Berapa porsi setiap bagian (sedikit bagian)? | Donat | `sl.pie_chart` |

Semua grafik Slak digambar di browser tanpa internet, bisa diarahkan kursor untuk melihat nilainya, dan bisa diunduh sebagai PNG atau SVG lewat tombol di pojok kanan atas.

## 16.2 Menyiapkan data

Grafik membutuhkan data yang **sudah diringkas**. Menggambar 2.929 transaksi mentah sebagai garis hanya menghasilkan benang kusut. Kelompokkan dulu:

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const bulanan = df.resample("tanggal", "M").agg({ omzet: ["total", "sum"] })
sl.dataframe(bulanan.head(4))
sl.line_chart(bulanan, { x: "tanggal", y: "omzet", title: "Omzet bulanan Toko Nusantara" })
```

`resample("tanggal", "M")` mengelompokkan per bulan. Bab 20 membahasnya lebih jauh. Karena kolom `x` berisi tanggal, sumbu mendatar otomatis menjadi sumbu waktu.

Garis ini sudah bercerita: omzet naik dari 2023 ke 2024, dengan lonjakan menjelang Lebaran dan akhir tahun.

## 16.3 Batang: membandingkan kategori

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const perKota = df.groupby("kota").agg({ omzet: ["total", "sum"] })
sl.bar_chart(perKota, {
  x: "kota", y: "omzet",
  horizontal: true, sort: true, labels: true, format: "compact",
  title: "Omzet per kota, 2023–2024"
})
```

Tiga kebiasaan untuk grafik batang:

1. **Urutkan** (`sort: true`). Pembaca langsung melihat juara dan yang tertinggal.
2. **Mendatar** (`horizontal: true`) bila nama kategorinya panjang, supaya label tidak miring.
3. **Tampilkan nilainya** (`labels: true`) bila batangnya sedikit, supaya pembaca tidak menebak.

Grafik batang selalu dimulai dari nol. Panjang batang adalah nilainya; memotong sumbu membuat selisih kecil tampak besar.

### Beberapa seri sekaligus

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const kk = df.groupby(["kategori", "kanal"]).agg({ omzet: ["total", "sum"] })
sl.bar_chart(kk, { x: "kategori", y: "omzet", color: "kanal", format: "compact", title: "Omzet per kategori dan kanal" })
```

`color: "kanal"` memberi satu warna untuk setiap nilai kolom `kanal`. Tambahkan `stack: true` untuk menumpuk batangnya.

## 16.4 Area: total dan bagiannya

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const bulanKanal = df.assign({ bulan: () => df.tanggal.dt.strftime("%Y-%m") })
  .groupby(["bulan", "kanal"]).agg({ omzet: ["total", "sum"] })
sl.area_chart(bulanKanal, { x: "bulan", y: "omzet", color: "kanal", stack: true, format: "compact", title: "Omzet bulanan menurut kanal" })
```

Grafik area bertumpuk menunjukkan total (tinggi seluruhnya) sekaligus bagiannya. Terlihat porsi kanal Online semakin tebal di 2024.

## 16.5 Sebar: mencari hubungan

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const perPelanggan = df.groupby("pelanggan_id").agg({
  kunjungan: ["id_transaksi", "nunique"],
  belanja: ["total", "sum"]
})
sl.scatter_chart(perPelanggan, {
  x: "kunjungan", y: "belanja", trendline: true, format: "compact",
  x_label: "Banyak transaksi", y_label: "Total belanja", title: "Pelanggan yang sering datang belanja lebih banyak"
})
```

Setiap titik adalah satu pelanggan. `trendline: true` menambahkan garis tren beserta nilai R² di legenda, yang mengukur seberapa rapat titik mengikuti garis. Bab 19 dan 22 membahasnya.

Perhatikan judulnya: bukan "Kunjungan vs belanja", melainkan **temuannya**. Judul yang menyatakan temuan membuat pembaca langsung paham maksud grafik.

## 16.6 Histogram: melihat sebaran

```slak
const df = await sl.read_csv("toko-nusantara.csv")
sl.histogram(df, { x: "total", bins: 30, title: "Kebanyakan transaksi di bawah 200 ribu" })
sl.write(`Rata-rata ${Math.round(df.total.mean()).toLocaleString("id-ID")}, median ${df.total.median().toLocaleString("id-ID")}`)
```

Histogram membagi rentang nilai ke dalam beberapa "keranjang" (`bins`) dan menghitung isi setiap keranjang. Sebaran transaksi kita **condong ke kanan**: banyak transaksi kecil, sedikit transaksi besar. Itulah sebabnya rata-ratanya lebih besar dari mediannya (ingat Bab 5).

## 16.7 Donat: porsi

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const perKanal = df.groupby("kanal").agg({ omzet: ["total", "sum"] })
sl.pie_chart(perKanal, { names: "kanal", values: "omzet", donut: true, title: "Porsi omzet menurut kanal" })
```

Pakai donat hanya bila bagiannya **sedikit** (dua sampai lima) dan jumlahnya 100%. Mata manusia sulit membandingkan sudut; untuk lebih dari lima bagian, grafik batang yang diurutkan hampir selalu lebih jelas.

> **API Slak baru**
> - `sl.line_chart`, `sl.bar_chart`, `sl.area_chart`, `sl.scatter_chart(data, { x, y, color, title, x_label, y_label, format })`.
> - Opsi khusus: `horizontal`, `sort`, `labels`, `stack` (batang dan area), `trendline` (sebar).
> - `sl.histogram(data, { x, bins })` dan `sl.pie_chart(data, { names, values, donut })`.
> - `format`: `"rupiah"`, `"percent"`, `"compact"` (ditulis singkat: rb, jt, M), `"decimal:2"`.

## 16.8 Grafik yang jujur dan ramah semua orang

**Hindari grafik yang menyesatkan:**

| Jebakan | Akibat | Perbaikan |
|---|---|---|
| Sumbu batang tidak dimulai dari nol | Selisih 2% tampak dua kali lipat | Batang selalu dari nol (bawaan Slak) |
| Donat dengan sepuluh potong | Tidak ada yang bisa dibandingkan | Batang yang diurutkan |
| Garis untuk kategori yang tidak berurutan | Tersirat ada "tren" antar-kota | Batang |
| Warna pelangi tanpa arti | Pembaca mencari makna yang tidak ada | Satu warna, sorot yang penting saja |
| Membandingkan bulan tidak lengkap | Desember yang baru berjalan seminggu tampak anjlok | Beri catatan, atau buang periode yang belum selesai |

**Warna yang bermakna.** Sorot hanya yang penting, misalnya cabang di atas target:

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const perCabang = df.groupby("kota").agg({ omzet: ["total", "sum"] })
const target = 35000000
sl.bar_chart(perCabang, {
  x: "kota", y: "omzet", horizontal: true, sort: true, format: "compact",
  color: r => r.omzet >= target ? "var(--slak-green)" : "var(--slak-gray)",
  title: "Empat kota melampaui 35 juta"
})
```

Warna `var(--slak-green)`, `var(--slak-red)`, `var(--slak-gray)`, dan `var(--slak-c1)` sampai `var(--slak-c8)` otomatis menyesuaikan tema terang dan gelap.

**Teks pengganti.** Pembaca layar membacakan grafik untuk pengguna tunanetra. Slak membuat teks penggantinya otomatis, misalnya "Grafik omzet menurut kota, 10 titik". Opsi `alt` memberi teks yang lebih bermakna:

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const perKategori = df.groupby("kategori").agg({ omzet: ["total", "sum"] })
sl.bar_chart(perKategori, { x: "kategori", y: "omzet", sort: true, alt: "Kerajinan menyumbang omzet terbesar, diikuti Minuman dan Makanan" })
```

> **Coba di playground**
> Di contoh 16.3, ganti `y: "omzet"` menjadi rata-rata nilai transaksi dengan `rata: ["total", "mean"]` di `agg`. Apakah urutan kotanya berubah?

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Grafik garis kusut berisi ribuan titik | Data belum diringkas | `groupby` atau `resample` dulu |
| Sumbu waktu tidak urut | Kolom tanggal masih berupa teks | `to_datetime`, atau urutkan dulu |
| `Kolom "omzet" tidak ada` | Nama `y` tidak sesuai nama kolom hasil `agg` | Samakan namanya |
| Angka sumbu terlalu panjang | Format bawaan | `format: "compact"` |

<script type="text/markdown" id="bab-17">
# Bab 17 · Proyek: Laporan Interaktif Pertama

> **Tujuan belajar**
> - Merancang laporan dari pertanyaan bisnis.
> - Menyusun tata letak: sidebar berisi filter, angka utama, grafik, dan tabel.
> - Memakai tab dan templat tata letak `sl.layout`.
> - Membuat laporan yang ramah untuk semua pembaca, termasuk pengguna pembaca layar.
> - Menerbitkan laporan supaya bisa dibuka siapa saja lewat tautan.

Inilah penutup Tahap 2. Semua yang kamu pelajari sejak Bab 1 dipakai di sini untuk membuat satu karya utuh: laporan penjualan interaktif Toko Nusantara yang bisa kamu tunjukkan kepada siapa saja.

## 17.1 Merancang sebelum menulis kode

Laporan yang baik dimulai dengan **pertanyaan**, bukan dengan grafik. Bayangkan kamu diminta manajer wilayah Toko Nusantara. Tuliskan pertanyaannya:

1. Berapa omzet, transaksi, dan pelanggan pada periode yang dipilih, dan bagaimana dibanding periode sebelumnya?
2. Bagaimana tren omzet bulanannya?
3. Cabang dan kategori mana yang memimpin?
4. Produk apa saja yang paling laku?

Lalu tentukan **filter** yang dibutuhkan manajer: tahun, cabang, dan kanal. Setiap pertanyaan menjadi satu bagian laporan:

| Bagian | Isi | Fungsi Slak |
|---|---|---|
| Filter | Tahun, cabang, kanal | `sl.sidebar`, `selectbox`, `multiselect`, `radio` |
| Angka utama | Omzet, transaksi, pelanggan, beserta perubahannya | `sl.metric` dalam `sl.columns` |
| Tren | Omzet bulanan | `sl.line_chart` |
| Perbandingan | Cabang dan kategori | `sl.bar_chart` dalam `sl.tabs` |
| Rincian | Produk terlaris dan unduhan | `sl.dataframe`, `sl.download_button` |

## 17.2 Sidebar dan tab

Filter ditaruh di **sidebar**, panel di sisi kiri, supaya tidak menghalangi isi laporan. Semua fungsi Slak bisa dipakai di sidebar dengan awalan `sl.sidebar.`.

```slak tanpa-jalan
const tahun = sl.sidebar.selectbox("Tahun", ["2024", "2023"])
sl.write(`Laporan tahun ${tahun}`)
```

Contoh ini ditandai *tidak dijalankan di halaman buku*, karena halaman buku sendiri memakai sidebar untuk daftar bab. Coba di playground.

**Tab** memisahkan isi ke beberapa halaman kecil yang bisa dipilih pengguna:

```slak
const [tGrafik, tTabel] = sl.tabs(["Grafik", "Tabel"])
tGrafik.bar_chart([{ kota: "Jayapura", omzet: 41 }, { kota: "Sorong", omzet: 25 }], { x: "kota", y: "omzet" })
tTabel.table([{ kota: "Jayapura", omzet: 41 }, { kota: "Sorong", omzet: 25 }])
```

> **API Slak baru**
> - `sl.sidebar.namaFungsi(...)` menaruh apa saja di sidebar.
> - `sl.tabs(["A", "B"])` mengembalikan larik tab; setiap tab punya semua fungsi tampilan.

## 17.3 Templat tata letak

Menyusun kolom dan sidebar sendiri tidak sulit, tetapi Slak menyediakan empat kerangka siap pakai lewat `sl.layout`:

| Kerangka | Area yang tersedia |
|---|---|
| `"kpi-atas"` | `kpi`, `grafik`, `tabel` |
| `"sidebar-filter"` | `filter` (di sidebar), `kpi`, `grafik`, `tabel` |
| `"grid-2x2"` | `kpi`, `kiri_atas`, `kanan_atas`, `kiri_bawah`, `kanan_bawah` |
| `"laporan"` | `judul`, `ringkasan`, `isi`, `catatan`, satu kolom yang nyaman dicetak |

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const area = sl.layout("kpi-atas", { title: "Ringkasan Toko Nusantara" })
area.kpi.metric("Omzet", df.total.sum(), null, { format: "rp" })
area.kpi.metric("Transaksi", df.shape[0])
area.kpi.metric("Pelanggan", df.pelanggan_id.nunique())
area.grafik.bar_chart(df.groupby("kategori").agg({ omzet: ["total", "sum"] }), { x: "kategori", y: "omzet", sort: true, format: "compact" })
area.tabel.dataframe(df.head(5))
```

Metrik yang ditulis di area `kpi` otomatis tampil sebagai kartu yang sejajar. Di layar sempit seperti ponsel, kerangka ini menyesuaikan diri menjadi satu kolom.

> **API Slak baru**
> - `sl.layout(nama, { title })` membuat kerangka tata letak dan mengembalikan objek berisi area-areanya.

## 17.4 Laporan untuk semua orang

Laporanmu mungkin dibaca orang yang memakai pembaca layar, hanya memakai papan ketik, atau membuka di ponsel dengan layar kecil. Slak 1.9 sudah mengurus banyak hal secara otomatis:

- Setiap widget punya nama untuk pembaca layar, diambil dari labelnya.
- Semua kontrol bisa dicapai dengan tombol **Tab** dan punya garis fokus yang terlihat.
- Grafik punya teks pengganti otomatis.
- Warna teks dan menu memenuhi standar kontras WCAG AA, di tema terang maupun gelap.

Bagianmu sebagai penulis laporan:

1. **Beri label yang jelas** pada setiap widget, juga saat labelnya disembunyikan dengan `label_visibility: "collapsed"`. Pembaca layar tetap membacakannya.
2. **Tulis temuan sebagai teks**, bukan hanya sebagai grafik. Kalimat "Omzet 2024 naik 27,6%" bisa dibaca semua orang.
3. **Beri teks pengganti** yang bermakna pada grafik penting dengan opsi `alt`.
4. **Jangan mengandalkan warna saja.** Tambahkan tanda atau teks, misalnya ▲ dan ▼ yang sudah dipakai `sl.metric`.
5. **Periksa di layar ponsel.** Di Slak Studio, bilah pratinjau punya tombol lebar layar ponsel (390 px).

## 17.5 Laporan lengkap

Inilah laporan utuhnya. Kode ini memakai sidebar, jadi bacalah di sini dan jalankan di playground atau Slak Studio.

```slak tanpa-jalan
sl.set_page_config({ page_title: "Laporan Toko Nusantara", page_icon: "📊", layout: "wide" })

const semua = await sl.read_csv("toko-nusantara.csv")
const data = semua.assign({ tahun: () => semua.tanggal.dt.year })

// ---------- Filter ----------
sl.sidebar.header("Filter")
const tahun = Number(sl.sidebar.selectbox("Tahun", ["2024", "2023"]))
const daftarCabang = data.cabang.unique().sort()
const cabang = sl.sidebar.multiselect("Cabang", daftarCabang, { placeholder: "Semua cabang" })
const kanal = sl.sidebar.radio("Kanal", ["Semua", "Toko", "Online"])

const saring = (df) => df
  .filter(r => cabang.length === 0 || cabang.includes(r.cabang))
  .filter(r => kanal === "Semua" || r.kanal === kanal)

const ini = saring(data.filter(r => r.tahun === tahun))
const lalu = saring(data.filter(r => r.tahun === tahun - 1))

// ---------- Judul ----------
sl.title(`Laporan Penjualan ${tahun}`)
sl.caption(`${cabang.length ? cabang.join(", ") : "Semua cabang"} · kanal ${kanal.toLowerCase()}`)

// ---------- Angka utama ----------
const persen = new Intl.NumberFormat("id-ID", { style: "percent", maximumFractionDigits: 1, signDisplay: "always" })
const banding = (a, b) => lalu.shape[0] ? persen.format(a / b - 1) : null

const [k1, k2, k3, k4] = sl.columns(4)
k1.metric("Omzet", ini.total.sum(), banding(ini.total.sum(), lalu.total.sum()), { format: "rp" })
k2.metric("Transaksi", ini.shape[0], banding(ini.shape[0], lalu.shape[0]))
k3.metric("Pelanggan", ini.pelanggan_id.nunique(), banding(ini.pelanggan_id.nunique(), lalu.pelanggan_id.nunique()))
k4.metric("Rata-rata transaksi", Math.round(ini.total.mean()), banding(ini.total.mean(), lalu.total.mean()), { format: "rp" })

// ---------- Tren ----------
const bulanan = ini.resample("tanggal", "M").agg({ omzet: ["total", "sum"] })
const puncak = bulanan.nlargest(1, "omzet").to_records()[0]
const namaBulan = new Intl.DateTimeFormat("id-ID", { month: "long" })
sl.subheader("Tren omzet bulanan")
sl.line_chart(bulanan, { x: "tanggal", y: "omzet", format: "compact",
  alt: `Omzet bulanan ${tahun}, tertinggi di bulan ${namaBulan.format(puncak.tanggal)}` })
sl.write(`Omzet tertinggi terjadi di bulan **${namaBulan.format(puncak.tanggal)}**.`)

// ---------- Perbandingan ----------
const [tCabang, tKategori] = sl.tabs(["Per cabang", "Per kategori"])
tCabang.bar_chart(ini.groupby("cabang").agg({ omzet: ["total", "sum"] }),
  { x: "cabang", y: "omzet", horizontal: true, sort: true, format: "compact" })
tKategori.bar_chart(ini.groupby("kategori").agg({ omzet: ["total", "sum"] }),
  { x: "kategori", y: "omzet", sort: true, labels: true, format: "compact" })

// ---------- Rincian ----------
sl.subheader("Produk terlaris")
const produk = ini.groupby("produk").agg({ terjual: ["jumlah", "sum"], omzet: ["total", "sum"] })
  .sort_values("omzet", { ascending: false })
sl.dataframe(produk.head(10), { format: { omzet: "rupiah" }, gradient: ["omzet"] })
sl.download_button("Unduh data terpilih (Excel)", { Transaksi: ini, Produk: produk }, { file_name: `toko-nusantara-${tahun}.xlsx` })
```

Beberapa hal yang patut diperhatikan:

- **Fungsi `saring`** dipakai dua kali, untuk tahun ini dan tahun lalu, sehingga perbandingan selalu adil: filternya sama persis.
- **`banding`** mengembalikan `null` bila tidak ada data tahun lalu (misalnya untuk 2023), sehingga perubahannya tidak ditampilkan.
- **Temuan ditulis sebagai teks** di bawah grafik tren, dan dipakai juga sebagai teks pengganti grafiknya.
- **Unduhan Excel** berisi dua lembar sekaligus: objek `{ Transaksi: ..., Produk: ... }` menjadi dua lembar bernama sama.

Berikut bagian intinya yang bisa dijalankan langsung di halaman ini, dengan filter di atas, bukan di sidebar:

```slak
const semua = await sl.read_csv("toko-nusantara.csv")
const data = semua.assign({ tahun: () => semua.tanggal.dt.year })
const [f1, f2] = sl.columns(2)
const tahun = Number(f1.selectbox("Tahun laporan", ["2024", "2023"]))
const kanal = f2.radio("Kanal laporan", ["Semua", "Toko", "Online"], { horizontal: true })

const saring = (df) => df.filter(r => kanal === "Semua" || r.kanal === kanal)
const ini = saring(data.filter(r => r.tahun === tahun))
const lalu = saring(data.filter(r => r.tahun === tahun - 1))
const persen = new Intl.NumberFormat("id-ID", { style: "percent", maximumFractionDigits: 1, signDisplay: "always" })
const banding = (a, b) => lalu.shape[0] ? persen.format(a / b - 1) : null

const [k1, k2, k3] = sl.columns(3)
k1.metric("Omzet", ini.total.sum(), banding(ini.total.sum(), lalu.total.sum()), { format: "rp" })
k2.metric("Transaksi", ini.shape[0], banding(ini.shape[0], lalu.shape[0]))
k3.metric("Pelanggan", ini.pelanggan_id.nunique(), banding(ini.pelanggan_id.nunique(), lalu.pelanggan_id.nunique()))
sl.line_chart(ini.resample("tanggal", "M").agg({ omzet: ["total", "sum"] }), { x: "tanggal", y: "omzet", format: "compact" })
```

## 17.6 Menerbitkan

Laporan yang hanya ada di laptopmu belum bisa dipakai orang lain. Ada empat cara membagikannya, dari yang paling sederhana:

### Satu berkas HTML

Di Slak Studio, tekan **Ctrl+E** (Ekspor ke HTML). Hasilnya satu berkas `.html` yang berisi `slak.js`, kodemu, dan data CSV yang dibaca dengan nama berkas. Berkas ini bisa dikirim lewat email atau WhatsApp dan dibuka dengan klik dua kali, tanpa internet.

### Folder situs

Pilih **Berkas › Ekspor folder situs** (**Ctrl+Shift+E**). Hasilnya folder berisi `index.html`, `slak.js`, berkas tambahan yang dipakai (misalnya `slak-data.js`), dan `PANDUAN-UNGGAH.txt`. Folder ini siap diunggah ke hosting apa pun.

### Unggah sendiri

| Tempat | Langkah | Alamat hasilnya |
|---|---|---|
| cPanel | File Manager › `public_html` (atau subfolder) › Upload semua berkas | `https://domainmu.com/` |
| GitHub Pages | Repositori baru › Add file › Upload files › Settings › Pages › Deploy from a branch | `https://namamu.github.io/nama-repo/` |
| Netlify | Buka `app.netlify.com/drop`, seret folder situs | Alamat acak yang bisa diganti |

### Terbit sekali klik

Pilih **Berkas › Terbitkan…** (**Ctrl+Shift+U**), lalu pilih tujuannya:

| Tujuan | Yang perlu disiapkan |
|---|---|
| GitHub Pages | Akun GitHub dan token akses pribadi dengan izin Contents dan Pages |
| Netlify | Akun Netlify dan token akses pribadi |
| FTP (cPanel) | Server FTP, nama pengguna, dan password dari menu FTP Accounts di cPanel |

Tekan **Terbitkan**, dan tautan situsmu muncul setelah prosesnya selesai. Untuk FTP, Slak Studio mencoba FTPS (terenkripsi) lebih dulu, dan hanya mengunggah berkas yang berubah sejak terbit terakhir.

Token dan password disimpan terenkripsi oleh sistem operasi di komputermu dan **tidak pernah ikut ke situs**. Bila token ditemukan di kodemu, terbit dibatalkan. Centang **Bisa dipasang dan jalan offline (PWA)** agar pengunjung bisa memasang laporanmu seperti aplikasi dan membukanya tanpa internet setelah kunjungan pertama.

### Yang perlu diingat saat online

- Setiap pengunjung menjalankan laporan **di browsernya sendiri**, jadi hosting termurah pun cukup.
- Data yang disematkan bisa dilihat siapa saja lewat "View source". **Jangan menerbitkan data pribadi atau rahasia**; pakai data fiktif seperti Toko Nusantara, atau data yang sudah dianonimkan.

> **Coba di playground**
> Salin laporan lengkap 17.5 ke playground, lalu tekan **Bagikan**. Kirim tautannya ke temanmu. Ingat, data CSV tidak ikut di tautan; temanmu perlu memilih berkasnya, atau terbitkan lewat Slak Studio supaya datanya ikut.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Halaman hasil unggah kosong | `slak.js` tidak ikut diunggah | Unggah seluruh isi folder situs |
| Data tidak terbaca di hosting | Nama berkas CSV beda huruf besar-kecil | Hosting Linux membedakan `Data.csv` dan `data.csv` |
| Perbandingan tahun lalu aneh | Filter tahun lalu berbeda dengan tahun ini | Pakai satu fungsi `saring` untuk keduanya |
| Tampilan sempit di ponsel | Terlalu banyak kolom berdampingan | Pakai `sl.layout`, atau kurangi kolom |

## Latihan

**Latihan 17.1 (mudah).** Lengkapi fungsi `saring(df, kanal)` agar mengembalikan semua baris bila `kanal` bernilai `"Semua"`, dan hanya kanal itu bila tidak.

```slak latihan
const df = await sl.read_csv("toko-nusantara.csv")
function saring(data, kanal) {
  return data
}

await sl.testing.test("Semua tidak menyaring", () => sl.testing.expect(saring(df, "Semua").shape[0]).toBe(df.shape[0]))
await sl.testing.test("Online saja", () => sl.testing.expect(saring(df, "Online").kanal.unique()).toEqual(["Online"]))
```

**Latihan 17.2 (sedang).** Uji di bawah menjalankan aplikasi kecil lalu memilih tahun 2023. Lengkapi kode aplikasinya agar metrik "Omzet" menampilkan omzet tahun yang dipilih.

```slak latihan
const aplikasi = `
const df = await sl.read_csv("toko-nusantara.csv")
const tahun = Number(sl.selectbox("Tahun", ["2024", "2023"]))
const data = df   // saring berdasarkan tahun
sl.metric("Omzet", data.total.sum())
`
sl.code(aplikasi)

const df = await sl.read_csv("toko-nusantara.csv")
await sl.testing.test("pilih 2023", async () => {
  const at = await sl.testing.run(aplikasi)
  await at.selectbox("Tahun").set_value("2023").run()
  sl.testing.expect(at.metric("Omzet").value).toBe(df.filter(r => r.tanggal.getFullYear() === 2023).total.sum())
})
```

**Latihan 17.3 (tantangan).** Lengkapi `temuan(df)` yang mengembalikan satu kalimat berisi cabang dengan omzet tertinggi dan porsinya, misalnya `"Nusantara Surabaya memimpin dengan 13,4% omzet."`, dengan persen bergaya Indonesia satu desimal.

<script type="text/markdown" id="bab-18">
# Bab 18 · Menggabungkan dan Membentuk Ulang Data

> **Tujuan belajar**
> - Memahami inner, left, dan outer join.
> - Menggabungkan tabel dengan `Map` di JavaScript murni, lalu dengan `merge`.
> - Menyambung tabel dengan `sl.concat`.
> - Mengubah bentuk tabel dari panjang ke lebar dengan `pivot`, dan sebaliknya dengan `sl.melt`.

Selamat datang di Tahap 3. Data di dunia kerja jarang tersimpan dalam satu tabel. Transaksi ada di sistem kasir, harga pokok ada di bagian pembelian, target ada di berkas Excel manajer. Analis data menggabungkannya.

Bahan buku menyediakan tiga tabel pendamping transaksi:

| Berkas | Kunci | Isi |
|---|---|---|
| `produk.csv` | `produk` | Kategori, harga jual, **harga pokok**, pemasok |
| `cabang.csv` | `cabang` | Kode, kota, provinsi, **koordinat**, tanggal buka |
| `target.csv` | `cabang` + `bulan` | **Target omzet** bulanan setiap cabang |

## 18.1 Kunci dan jenis join

Dua tabel digabung lewat **kunci**: kolom yang isinya sama di kedua tabel. Transaksi punya kolom `produk`, dan `produk.csv` juga punya kolom `produk`. Dengan kunci itu, setiap transaksi bisa diberi harga pokoknya.

Pertanyaannya: bagaimana dengan baris yang kuncinya hanya ada di salah satu tabel?

| Jenis | Hasil | Mirip di Excel |
|---|---|---|
| **inner** (bawaan) | Hanya baris yang kuncinya ada di kedua tabel | |
| **left** | Semua baris tabel kiri; kolom kanan kosong bila tidak cocok | VLOOKUP |
| **right** | Semua baris tabel kanan | |
| **outer** | Semua baris dari kedua tabel | |

```
     inner               left                outer
   ┌───┬───┐          ┌───┬───┐           ┌───┬───┐
   │ A │▓B │          │▓A │▓B │           │▓A │▓B │
   │   │▓▓ │          │▓▓▓│▓▓ │           │▓▓▓│▓▓▓│
   └───┴───┘          └───┴───┘           └───┴───┘
  irisan saja       semua kiri         semuanya
```

Untuk analisis transaksi, **left join** paling sering dipakai: kita ingin semua transaksi tetap ada, apa pun yang terjadi di tabel pendamping.

## 18.2 Join dengan JavaScript murni

Cara paling sederhana adalah mencari dengan `find` untuk setiap transaksi. Tetapi untuk 3.000 transaksi dan banyak produk, itu berarti jutaan perbandingan. Cara yang benar: buat **`Map`**, kamus yang mencari dalam sekejap.

```slak
const trx = (await sl.read_csv("toko-nusantara.csv")).to_records()
const produk = (await sl.read_csv("produk.csv")).to_records()

const kamusProduk = new Map(produk.map(p => [p.produk, p]))   // produk → baris produk

const gabung = trx.map(t => {
  const p = kamusProduk.get(t.produk)
  return { ...t, harga_pokok: p ? p.harga_pokok : null, pemasok: p ? p.pemasok : null }
})

sl.write(`Transaksi tanpa pasangan: ${gabung.filter(r => r.harga_pokok == null).length}`)
sl.dataframe(gabung.slice(0, 5).map(r => ({ produk: r.produk, harga: r.harga, harga_pokok: r.harga_pokok, pemasok: r.pemasok })))
```

> **`Map` di JavaScript**
> - `new Map(larikPasangan)` membuat kamus dari larik `[kunci, nilai]`.
> - `peta.get(kunci)` mengambil nilai, `peta.has(kunci)` memeriksa ada tidaknya, `peta.set(kunci, nilai)` menambah.
> - Bedanya dengan objek biasa: kunci `Map` boleh bertipe apa saja, dan urutan penambahannya terjaga.

Ini **left join**: semua transaksi dipertahankan, dan yang tidak punya pasangan diberi `null`.

## 18.3 merge

Slak Data melakukan hal yang sama dalam satu baris:

```slak
const trx = await sl.read_csv("toko-nusantara.csv")
const produk = await sl.read_csv("produk.csv")

const lengkap = trx.merge(produk.select(["produk", "harga_pokok", "pemasok"]), { on: "produk", how: "left" })
  .assign({ laba_kotor: r => r.total - r.jumlah * r.harga_pokok })

const perPemasok = lengkap.groupby("pemasok").agg({
  omzet: ["total", "sum"],
  laba: ["laba_kotor", "sum"]
}).assign({ margin: r => r.laba / r.omzet }).sort_values("laba", { ascending: false })

sl.dataframe(perPemasok, { format: { omzet: "rupiah", laba: "rupiah", margin: "percent" } })
```

Kini kita bisa menjawab pertanyaan yang tidak mungkin dijawab dari satu tabel: **pemasok mana yang paling menguntungkan?**

> **API Slak baru**
> - `df.merge(lain, { on, how })` menggabungkan dua DataFrame. `how`: `"inner"`, `"left"`, `"right"`, `"outer"`. Bila nama kuncinya berbeda: `{ left_on: "nama_produk", right_on: "produk" }`.
> - `sl.merge(kiri, kanan, opsi)` adalah bentuk lain yang sama.
> - `df.join(lain, { on })` adalah singkatan untuk left join.

### Memeriksa hasil join

Join adalah sumber kesalahan analisis yang paling licin. Dua pemeriksaan wajib:

```slak
const trx = await sl.read_csv("toko-nusantara.csv")
const cabang = await sl.read_csv("cabang.csv")
const hasil = trx.merge(cabang.select(["cabang", "kode", "tanggal_buka"]), { on: "cabang", how: "left", indicator: true })

sl.write(`Baris sebelum: ${trx.shape[0]}, sesudah: ${hasil.shape[0]}`)
sl.dataframe(hasil.value_counts("_merge"))
```

1. **Banyak baris tidak boleh bertambah** pada left join. Bila bertambah, berarti kunci di tabel kanan ada yang ganda, dan transaksi ikut tergandakan. Omzetmu akan terhitung lebih besar dari kenyataan.
2. **Periksa baris tanpa pasangan.** `indicator: true` menambahkan kolom `_merge` berisi `both`, `left_only`, atau `right_only`.

## 18.4 Join dua kunci: omzet dibanding target

Target disimpan per cabang **per bulan**. Kuncinya dua kolom sekaligus.

```slak
const trx = await sl.read_csv("toko-nusantara.csv")
const target = await sl.read_csv("target.csv")

const omzetBulanan = trx
  .assign({ bulan: () => trx.tanggal.dt.strftime("%Y-%m") })
  .groupby(["cabang", "bulan"]).agg({ omzet: ["total", "sum"] })

const capaian = omzetBulanan.merge(target, { on: ["cabang", "bulan"], how: "left" })
  .assign({ capai: r => r.omzet / r.target })

const ringkas = capaian.groupby("cabang").agg({
  bulan_tercapai: ["capai", x => x.filter(v => v >= 1).length],
  rata_capaian: ["capai", "mean"]
}).sort_values("rata_capaian", { ascending: false })

sl.dataframe(ringkas, { format: { rata_capaian: "percent" } })
```

Perhatikan `["capai", x => x.filter(v => v >= 1).length]`. Fungsi agregasi boleh berupa fungsi buatanmu sendiri; ia menerima larik nilai setiap kelompok.

## 18.5 Menyambung tabel

Kadang datanya datang terpisah per periode atau per cabang, dengan kolom yang sama. `sl.concat` menumpuknya menjadi satu.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const data2023 = df.filter(r => r.tanggal.getFullYear() === 2023)
const data2024 = df.filter(r => r.tanggal.getFullYear() === 2024)
sl.write(`${data2023.shape[0]} + ${data2024.shape[0]} baris`)

const satu = sl.concat([data2023, data2024])
sl.write(`Disambung: ${satu.shape[0]} baris`)
```

## 18.6 Panjang dan lebar

Tabel yang sama bisa disusun dua cara:

| Bentuk panjang | | | | Bentuk lebar | | |
|---|---|---|---|---|---|---|
| **kategori** | **tahun** | **omzet** | | **kategori** | **2023** | **2024** |
| Minuman | 2023 | 36,4 jt | | Minuman | 36,4 jt | 47,5 jt |
| Minuman | 2024 | 47,5 jt | | Makanan | 35,3 jt | 47,5 jt |
| Makanan | 2023 | 35,3 jt | | | | |

Bentuk **lebar** enak dibaca manusia. Bentuk **panjang** disukai komputer dan grafik, karena setiap baris satu pengamatan.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const panjang = df.assign({ tahun: () => df.tanggal.dt.year.astype("str") })
  .groupby(["kategori", "tahun"]).agg({ omzet: ["total", "sum"] })

const lebar = panjang.pivot({ index: "kategori", columns: "tahun", values: "omzet" })
sl.dataframe(lebar, { format: "compact" })

const kembali = sl.melt(lebar, { id_vars: ["kategori"], var_name: "tahun", value_name: "omzet" })
sl.dataframe(kembali.head(4), { format: "compact" })
```

- `pivot` mengubah panjang menjadi lebar: nilai kolom `tahun` menjadi nama kolom.
- `sl.melt` mengubah lebar menjadi panjang: nama kolom kembali menjadi nilai.

Kapan butuh `melt`? Saat datamu datang dalam bentuk lebar dari Excel, misalnya satu kolom per bulan, dan kamu ingin menggambarnya dengan `color: "bulan"` atau mengelompokkannya.

> **API Slak baru**
> - `sl.concat([df1, df2])` menyambung tabel ke bawah.
> - `df.pivot({ index, columns, values })` panjang ke lebar; `pivot_table` (Bab 15) melakukan hal yang sama sambil meringkas.
> - `sl.melt(df, { id_vars, var_name, value_name })` lebar ke panjang.

> **Coba di playground**
> Di contoh 18.3, ganti `"pemasok"` dengan `"kategori"`. Kategori mana yang marginnya paling tipis?

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Omzet setelah join lebih besar dari sebelumnya | Kunci ganda di tabel kanan | Periksa `drop_duplicates` pada tabel kanan dan banyak baris sebelum-sesudah |
| Banyak nilai kosong setelah left join | Ejaan kunci berbeda, misalnya spasi atau huruf besar | Bersihkan kunci di kedua tabel (Bab 13–14) |
| Kolom `harga_x` dan `harga_y` muncul | Kolom bernama sama di kedua tabel | Pilih kolom dengan `select` sebelum `merge`, atau beri `suffixes` |
| Baris hilang setelah join | Memakai inner join padahal butuh left | `how: "left"` |

<script type="text/markdown" id="bab-19">
# Bab 19 · Statistik Deskriptif Lanjutan

> **Tujuan belajar**
> - Mengukur sebaran data: rentang, varians, dan simpangan baku.
> - Memakai persentil, kuartil, dan box plot.
> - Mendeteksi pencilan dengan metode IQR, dan memutuskan apa yang harus dilakukan terhadapnya.
> - Mengukur hubungan dua variabel dengan korelasi, dan memahami bedanya dengan sebab-akibat.
> - Membandingkan dua kelompok dengan uji t dan uji A/B.

Rata-rata saja tidak cukup. Dua cabang bisa punya rata-rata transaksi yang sama, tetapi yang satu stabil dan yang lain naik turun tak menentu. Bab ini memberimu alat untuk melihat **bentuk** data, bukan hanya pusatnya.

## 19.1 Sebaran: seberapa jauh nilai-nilai menyebar

Mari mulai dengan JavaScript murni, seperti di Bab 5:

```slak
const nilaiA = [100, 102, 98, 101, 99]     // stabil
const nilaiB = [60, 140, 80, 130, 90]      // naik turun

function rata(x) { return x.reduce((a, b) => a + b, 0) / x.length }
function varians(x) {
  const m = rata(x)
  return x.reduce((a, v) => a + (v - m) ** 2, 0) / (x.length - 1)
}
const simpangan = x => Math.sqrt(varians(x))

sl.write(`A: rata-rata ${rata(nilaiA)}, simpangan baku ${simpangan(nilaiA).toFixed(1)}`)
sl.write(`B: rata-rata ${rata(nilaiB)}, simpangan baku ${simpangan(nilaiB).toFixed(1)}`)
```

Rata-ratanya sama-sama 100, tetapi simpangan bakunya sangat berbeda.

- **Varians** adalah rata-rata kuadrat jarak setiap nilai ke rata-ratanya. Kuadrat dipakai supaya jarak ke bawah dan ke atas tidak saling meniadakan.
- **Simpangan baku** (*standard deviation*) adalah akar varians, sehingga satuannya kembali sama dengan data. Kira-kira: "biasanya nilai menyimpang sejauh ini dari rata-rata".
- Pembagi `x.length - 1` dipakai untuk **sampel**. Ini juga bawaan pandas dan Excel `STDEV.S`.

Dengan Slak Data:

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const t = df.total
sl.json(sl.stats.describe(t))
```

> **API Slak baru**
> - `sl.stats.describe(x)` meringkas satu kolom: banyak data, rata-rata, simpangan baku, minimum, kuartil, dan maksimum.
> - `sl.stats.var(x)`, `sl.stats.std(x)`, `sl.stats.mean(x)`, `sl.stats.median(x)`, juga tersedia sebagai metode Series: `df.total.std()`.

## 19.2 Persentil dan kuartil

**Persentil ke-90** adalah nilai yang di bawahnya terdapat 90% data. **Kuartil** adalah persentil ke-25, 50, dan 75: tiga titik yang membagi data menjadi empat bagian sama banyak.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const t = df.total
const [q1, q2, q3] = sl.stats.quantile(t, [0.25, 0.5, 0.75])

const rp = new Intl.NumberFormat("id-ID")
sl.markdown(`
- 25% transaksi bernilai di bawah **Rp ${rp.format(q1)}** (kuartil 1)
- separuh transaksi di bawah **Rp ${rp.format(q2)}** (median)
- 75% transaksi di bawah **Rp ${rp.format(q3)}** (kuartil 3)
- 10% transaksi teratas di atas **Rp ${rp.format(sl.stats.percentile(t, 90))}** (persentil 90)
`)
```

Kalimat seperti ini jauh lebih mudah dipahami manajer daripada "simpangan baku 149 ribu".

**Rentang antarkuartil** (IQR) adalah `Q3 − Q1`, lebar separuh data yang di tengah. IQR tidak terpengaruh nilai ekstrem, sehingga lebih bisa diandalkan daripada rentang `max − min`.

## 19.3 Box plot

Box plot menggambar lima angka sekaligus: minimum, Q1, median, Q3, dan maksimum, ditambah titik-titik pencilan.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
sl.box_plot(df, { y: "total", by: "kategori", title: "Nilai transaksi per kategori" })
```

Cara membacanya:

- **Kotak** membentang dari Q1 sampai Q3; garis di dalamnya adalah median.
- **Kumis** memanjang sampai nilai terjauh yang masih dalam 1,5 × IQR dari kotak.
- **Titik** di luar kumis adalah pencilan.

Satu grafik ini memperlihatkan bahwa transaksi Kerajinan jauh lebih besar dan lebih beragam daripada kategori lain.

> **API Slak baru**
> - `sl.box_plot(data, { y, by })` menggambar box plot, satu kotak per kelompok.

## 19.4 Pencilan: buang, potong, atau biarkan?

Metode IQR menganggap nilai sebagai pencilan bila berada di bawah `Q1 − 1,5 × IQR` atau di atas `Q3 + 1,5 × IQR`.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const masker = df.outliers("total")
sl.write(`Batas normal: ${masker.bounds.map(x => x.toLocaleString("id-ID")).join(" sampai ")}`)
sl.write(`${masker.values.filter(Boolean).length} transaksi di luar batas`)

const pencilan = df.filter(masker)
sl.dataframe(pencilan.value_counts("kategori"))
```

Ada 235 transaksi "pencilan", hampir semuanya Kerajinan. Apakah mereka salah? **Tidak.** Tenun ikat dan ukiran Asmat memang mahal. Inilah pelajaran terpenting bagian ini:

> **Pencilan bukan berarti salah.** Sebelum membuang, tanyakan: apakah nilai ini mungkin terjadi? Di Bab 13, jumlah 250 barang dalam satu transaksi oleh-oleh hampir pasti salah ketik, jadi dibuang. Di sini, transaksi 1,8 juta untuk tenun ikat adalah penjualan sungguhan. Membuangnya berarti menghilangkan pelanggan terbaikmu.

Tiga pilihan yang tersedia:

| Pilihan | Perintah | Kapan |
|---|---|---|
| Buang | `df.remove_outliers("total")` | Nilainya pasti salah |
| Potong ke batas | `df.cap_outliers("total")` | Nilainya benar, tetapi mengganggu model atau rata-rata |
| Biarkan, pakai median | `df.total.median()` | Nilainya benar dan penting; laporkan median di samping rata-rata |

## 19.5 Korelasi

**Korelasi** mengukur seberapa kuat dua variabel bergerak bersama, dari −1 sampai +1:

| Nilai | Arti |
|---|---|
| mendekati +1 | Bila satu naik, yang lain cenderung naik |
| sekitar 0 | Tidak ada hubungan garis lurus |
| mendekati −1 | Bila satu naik, yang lain cenderung turun |

```slak
const kar = sl.dataset("karyawan")
const angka = kar.select_dtypes("number")
sl.heatmap(angka.corr(), { title: "Korelasi antarvariabel karyawan" })

const r = sl.stats.pearsonr(kar.pengalaman_tahun, kar.gaji_juta)
sl.write(`Korelasi pengalaman dan gaji: ${r.statistic.toFixed(2)}`)
sl.write(r.conclusion)
```

Dataset bawaan `karyawan` berisi 300 karyawan fiktif. Pengalaman dan gaji berkorelasi 0,74: kuat dan positif.

> **API Slak baru**
> - `df.corr()` menghitung korelasi semua pasangan kolom angka. `df.select_dtypes("number")` memilih kolom angka saja.
> - `sl.heatmap(data)` menggambar tabel angka sebagai kotak berwarna.
> - `sl.stats.pearsonr(x, y)` dan `sl.stats.spearmanr(x, y)` menguji korelasi, lengkap dengan kesimpulan berbahasa Indonesia.

### Korelasi bukan sebab-akibat

Penjualan es krim dan kasus tenggelam berkorelasi positif. Apakah es krim menyebabkan orang tenggelam? Tentu tidak. Keduanya naik di musim panas, saat orang lebih banyak berenang. Variabel ketiga seperti "musim" disebut **variabel pengganggu**.

Saat menemukan korelasi, tuliskan "berhubungan dengan", bukan "menyebabkan". Membuktikan sebab-akibat butuh eksperimen, seperti uji A/B di bagian berikut.

## 19.6 Uji hipotesis: apakah perbedaannya nyata?

Rata-rata transaksi kanal Toko sedikit lebih besar daripada Online. Apakah perbedaan itu nyata, atau kebetulan saja?

**Uji hipotesis** menjawabnya dengan cara berikut:

1. Anggap dulu **tidak ada perbedaan** (hipotesis nol, H₀).
2. Hitung **p-value**: peluang melihat perbedaan sebesar ini bila H₀ benar.
3. Bila p-value lebih kecil dari 0,05, perbedaannya dianggap **signifikan**: terlalu besar untuk dianggap kebetulan.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const hasil = sl.stats.ttest_ind(df, { value: "total", group: "kanal" })
sl.write(hasil)
```

Kesimpulannya: tidak ada bukti bahwa rata-rata transaksi kedua kanal berbeda. Perbedaan kecil yang terlihat bisa saja kebetulan.

`sl.stats.ttest_ind` menampilkan statistik uji, p-value, ukuran efek, dan kesimpulan dalam bahasa Indonesia. Uji t ini memakai versi Welch, yang tidak menganggap kedua kelompok punya sebaran sama.

### Uji A/B

**Uji A/B** adalah eksperimen: pengunjung dibagi acak ke dua versi (A dan B), lalu hasilnya dibandingkan. Karena pembagiannya acak, perbedaan hasil bisa dianggap **disebabkan** oleh versinya. Dataset bawaan `ab_test` berisi 4.000 pengunjung halaman checkout.

```slak
const ab = sl.dataset("ab_test")
const uji = sl.stats.ab_test(ab, { group: "grup", metric: "beli", control: "A" })
sl.write(uji)
```

Versi B meningkatkan pembelian sekitar 21%, dan p-value-nya di bawah 0,05. Kini kita boleh mengatakan versi B **menyebabkan** lebih banyak pembelian.

> **API Slak baru**
> - `sl.stats.ttest_ind(df, { value, group })` membandingkan rata-rata dua kelompok.
> - `sl.stats.ab_test(df, { group, metric, control })` menganalisis uji A/B. Metrik 0/1 diuji sebagai proporsi, metrik lain sebagai rata-rata.
> - Setiap hasil uji punya `statistic`, `p_value`, `significant`, `conclusion`, dan bisa ditampilkan langsung dengan `sl.write`.

Hasil uji statistik Slak sudah dicocokkan dengan scipy dan statsmodels, pustaka statistik baku di Python.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Simpangan baku berbeda sedikit dengan kalkulator | Pembagi `n` dan `n − 1` | Slak dan pandas memakai `n − 1` untuk sampel |
| Membuang ratusan "pencilan" yang sebenarnya pelanggan terbaik | Menganggap pencilan pasti salah | Periksa dulu apakah nilainya mungkin terjadi |
| Menulis "X menyebabkan Y" dari korelasi | Lupa variabel pengganggu | Tulis "berhubungan dengan" |
| "Tidak signifikan" dibaca "tidak ada perbedaan" | Salah tafsir | Artinya "tidak ada bukti cukup", bukan "pasti sama" |

## Latihan

**Latihan 19.1 (mudah).** Hitung `iqr` kolom `total` dengan `sl.stats.quantile`, tanpa memakai `sl.stats.iqr`.

```slak latihan
const df = await sl.read_csv("toko-nusantara.csv")
const iqr = 0   // ganti

sl.write(iqr)
await sl.testing.test("IQR benar", () => sl.testing.expect(iqr).toBe(sl.stats.iqr(df.total)))
```

**Latihan 19.2 (sedang).** Lengkapi fungsi `batasPencilan(x)` dengan JavaScript murni (boleh memakai `sl.stats.quantile`), yang mengembalikan larik `[bawah, atas]` menurut metode IQR.

```slak latihan

  return [0, 0]
}

const df = await sl.read_csv("toko-nusantara.csv")
await sl.testing.test("batas sama dengan Slak", () => sl.testing.expect(batasPencilan(df.total)).toEqual(df.outliers("total").bounds))
```

const hasil = null       // ganti
const berbeda = null     // ganti: true bila signifikan

```

## Mini-proyek: profil statistik otomatis

Aplikasi ini membuat profil statistik untuk kolom angka mana pun dari berkas CSV apa pun.

```slak
sl.title("Profil Statistik :mag:")

const unggah = sl.file_uploader("CSV (kosongkan untuk contoh)", { type: ["csv"] })
const df = unggah ? await sl.read_csv(unggah) : await sl.read_csv("toko-nusantara.csv")
const kolomAngka = df.select_dtypes("number").columns
const kolomTeks = df.select_dtypes("string").columns

const [a, b] = sl.columns(2)
const pilih = a.selectbox("Kolom angka", kolomAngka, { index: kolomAngka.indexOf("total") >= 0 ? kolomAngka.indexOf("total") : 0 })
const kelompok = b.selectbox("Bandingkan menurut", ["(tidak ada)", ...kolomTeks])

const x = df[pilih].dropna()
const [q1, med, q3] = sl.stats.quantile(x, [0.25, 0.5, 0.75])
const rata = x.mean()
const m = df.outliers(pilih)

const [k1, k2, k3, k4] = sl.columns(4)
k1.metric("Rata-rata", Math.round(rata))
k2.metric("Median", med)
k3.metric("Simpangan baku", Math.round(x.std()))
k4.metric("Pencilan", m.values.filter(Boolean).length)

sl.histogram(df, { x: pilih, bins: 30 })
if (kelompok !== "(tidak ada)") sl.box_plot(df, { y: pilih, by: kelompok })

const condong = rata > med * 1.2 ? "condong ke kanan: ada sebagian kecil nilai yang sangat besar"
  : rata < med * 0.8 ? "condong ke kiri" : "cukup simetris"
sl.info(`Sebaran **${pilih}** ${condong}. Separuh data berada antara ${q1.toLocaleString("id-ID")} dan ${q3.toLocaleString("id-ID")}.`)
```

Kalimat di akhir ditulis otomatis dari angka-angkanya. Aplikasi yang **menjelaskan** temuannya sendiri jauh lebih berguna daripada tabel angka saja.

<script type="text/markdown" id="bab-20">
# Bab 20 · Data Deret Waktu

> **Tujuan belajar**
> - Mengubah teks menjadi tanggal dan memformatnya.
> - Mengelompokkan per hari, minggu, bulan, kuartal, dan tahun dengan `resample`.
> - Menghitung pertumbuhan bulan ke bulan dan tahun ke tahun.
> - Menghaluskan data dengan rata-rata bergerak.
> - Menguraikan tren dan pola musiman.

**Deret waktu** adalah data yang diurutkan menurut waktu: omzet harian, pengunjung mingguan, harga bulanan. Hampir semua laporan bisnis memuat deret waktu, karena pertanyaan terpenting manajer adalah "**bagaimana perkembangannya?**"

## 20.1 Tanggal di Slak Data

`sl.read_csv` mengubah kolom tanggal ISO menjadi `Date` secara otomatis. Untuk format lain, termasuk format Indonesia, pakai `to_datetime`:

```slak
const tgl = sl.to_datetime(["2024-04-10", "10/04/2024", "10 April 2024"])
sl.write(tgl.map(d => sl.strftime(d, "%A, %d %B %Y")))
```

Ketiga format menghasilkan tanggal yang sama: Rabu, 10 April 2024.

Membuat deretan tanggal, misalnya untuk memastikan setiap bulan ada:

```slak
const bulan = sl.date_range("2024-01-01", { end: "2024-06-01", freq: "MS" })
sl.write(bulan.to_list().map(d => sl.strftime(d, "%B %Y")))
```

> **API Slak baru**
> - `sl.to_datetime(nilai)` mengubah teks atau larik teks menjadi tanggal; `df.to_datetime(kolom)` mengubah satu kolom DataFrame.
> - `sl.date_range(awal, { end, periods, freq })` membuat deretan tanggal. `freq`: `"D"` hari, `"W"` minggu, `"MS"` awal bulan, `"ME"` akhir bulan, `"QS"` awal kuartal, `"YS"` awal tahun.

## 20.2 resample: mengelompokkan menurut waktu

`resample` adalah `groupby` khusus tanggal. Ia juga memastikan periode tanpa data tetap muncul, sehingga grafik tidak melompat.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const freq = sl.segmented_control("Periode", ["D", "W", "M", "Q"], { default: "M" })
const per = df.resample("tanggal", freq).agg({ omzet: ["total", "sum"], transaksi: ["id_transaksi", "nunique"] })
sl.write(`${per.shape[0]} periode`)
sl.line_chart(per, { x: "tanggal", y: "omzet", format: "compact" })
```

Geser pilihan dari hari (`D`) ke kuartal (`Q`). Data harian penuh gerigi; data bulanan dan kuartalan memperlihatkan polanya.

| Kode | Periode |
|---|---|
| `"D"` | Hari |
| `"W"` | Minggu (mulai Senin) |
| `"M"` | Bulan |
| `"Q"` | Kuartal |
| `"Y"` | Tahun |

> **API Slak baru**
> - `df.resample(kolomTanggal, freq).agg({...})` meringkas per periode.
> - `sl.segmented_control(label, pilihan, { default })` menampilkan tombol pilihan yang berdampingan.

## 20.3 Pertumbuhan

Dua ukuran pertumbuhan yang paling sering diminta:

- **MoM** (*month over month*): dibanding bulan sebelumnya.
- **YoY** (*year over year*): dibanding bulan yang sama tahun lalu.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const bulanan = df.resample("tanggal", "M").agg({ omzet: ["total", "sum"] })
const tumbuh = bulanan.assign({
  mom: () => bulanan.omzet.pct_change(),
  yoy: () => bulanan.omzet.pct_change(12)
})
sl.dataframe(tumbuh.tail(6), { format: { omzet: "rupiah", mom: "percent", yoy: "percent" } })
```

`pct_change()` membandingkan setiap baris dengan satu baris sebelumnya; `pct_change(12)` dengan dua belas baris sebelumnya, yaitu bulan yang sama tahun lalu. Tahun pertama tidak punya YoY, sehingga kolomnya kosong.

**Mengapa YoY penting?** Omzet Desember naik tajam dibanding November setiap tahun karena musim liburan. MoM Desember yang tinggi bukan prestasi, melainkan musim. YoY membandingkan Desember dengan Desember, sehingga pengaruh musim hilang.

Pintasan untuk laporan pertumbuhan:

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const g = sl.analysis.growth(df, { date: "tanggal", value: "total" })
sl.dataframe(g.tail(4), { format: { total: "rupiah", pertumbuhan: "percent", pertumbuhan_yoy: "percent", kumulatif: "rupiah" } })
```

> **API Slak baru**
> - `series.pct_change(n)` menghitung persen perubahan dibanding `n` baris sebelumnya.
> - `sl.analysis.growth(df, { date, value })` menghasilkan kolom `periode`, `pertumbuhan` (MoM), `pertumbuhan_yoy`, dan `kumulatif`.

## 20.4 Rata-rata bergerak

Data harian naik turun karena banyak hal kecil: hujan, hari libur, pembeli rombongan. **Rata-rata bergerak** menghaluskannya dengan merata-ratakan beberapa periode terakhir.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const harian = df.resample("tanggal", "D").agg({ omzet: ["total", "sum"] })
const halus = harian.assign({
  rata7: () => harian.omzet.rolling(7).mean(),
  rata30: () => harian.omzet.rolling(30).mean()
})
sl.line_chart(halus, { x: "tanggal", y: ["omzet", "rata7", "rata30"], format: "compact", title: "Omzet harian dan rata-rata bergerak" })
```

- `rolling(7).mean()` merata-ratakan 7 hari terakhir: pola mingguan hilang.
- `rolling(30).mean()` merata-ratakan 30 hari: hanya tren besarnya yang tersisa.

Mengirim larik ke opsi `y` menggambar beberapa garis sekaligus.

Cara kerjanya bisa kamu tulis sendiri dengan JavaScript murni:

```slak
function rataBergerak(x, n) {
  return x.map((_, i) => {
    if (i < n - 1) return null
    const jendela = x.slice(i - n + 1, i + 1)
    return jendela.reduce((a, b) => a + b, 0) / n
  })
}
sl.write(rataBergerak([10, 20, 30, 40, 50], 3))
```

> **API Slak baru**
> - `series.rolling(n).mean()` (juga `.sum()`, `.max()`) menghitung nilai bergerak.
> - `series.cumsum()` menjumlahkan terus-menerus; `series.shift(n)` menggeser nilai `n` baris; `series.diff()` selisih dengan baris sebelumnya.

## 20.5 Musim: Lebaran dan akhir tahun

Toko oleh-oleh punya dua musim ramai: menjelang **Lebaran** dan **akhir tahun**. Lebaran bergeser sekitar 11 hari lebih awal setiap tahun (22 April 2023, 10 April 2024), jadi puncaknya pun bergeser.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const t = df.assign({ tahun: () => df.tanggal.dt.year.astype("str"), bulan: () => df.tanggal.dt.month })
const perBulan = t.groupby(["tahun", "bulan"]).agg({ omzet: ["total", "sum"] })
sl.bar_chart(perBulan, { x: "bulan", y: "omzet", color: "tahun", format: "compact", title: "Dua puncak setiap tahun: Lebaran dan Desember" })
```

Menempatkan dua tahun berdampingan per bulan memperlihatkan pola yang berulang.

### Menguraikan tren dan musim

**Dekomposisi** memisahkan deret waktu menjadi tiga bagian: **tren** (arah jangka panjang), **musiman** (pola yang berulang setiap periode), dan **residu** (sisa yang tidak bisa dijelaskan). Butuh beberapa tahun data supaya polanya terlihat jelas. Dataset bawaan `penjualan_bulanan` berisi omzet bulanan selama enam tahun:

```slak
const pb = sl.dataset("penjualan_bulanan")
const d = sl.ts.decompose(pb, { period: 12 })
sl.line_chart(d, { x: "bulan", y: ["nilai", "tren"], title: "Omzet dan trennya" })
sl.bar_chart(d.head(12), { x: "bulan", y: "musiman", title: "Pola musiman: puncak di bulan Desember" })
```

> **API Slak baru**
> - `sl.ts.decompose(df, { period })` menghasilkan kolom `nilai`, `tren`, `musiman`, dan `residu`. `period: 12` untuk data bulanan dengan pola tahunan, `7` untuk data harian dengan pola mingguan.

> **Coba di playground**
> Ganti `rolling(30)` menjadi `rolling(90)`. Apa yang terjadi pada garisnya, dan berapa hari pertama yang kosong?

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| Grafik waktu melompat-lompat | Data belum diurutkan atau ada periode kosong | Pakai `resample`, yang mengurutkan dan mengisi periode kosong |
| Pertumbuhan Desember selalu tampak luar biasa | Membandingkan dengan November (MoM) | Lihat juga YoY |
| Bulan terakhir tampak anjlok | Bulannya belum selesai | Buang periode yang belum lengkap, atau beri catatan |
| `rolling` menghasilkan kosong di awal | Belum cukup periode untuk jendela | Wajar; jendela 7 butuh 7 data |

## Latihan

**Latihan 20.1 (mudah).** Buat `kuartalan`: omzet per kuartal, dengan kolom `omzet`.

```slak latihan

const kuartalan = sl.DataFrame([])   // ganti

sl.dataframe(kuartalan)
await sl.testing.test("8 kuartal", () => sl.testing.expect(kuartalan.shape[0]).toBe(8))
await sl.testing.test("jumlahnya sama dengan total omzet", () => sl.testing.expect(kuartalan.omzet.sum()).toBe(df.total.sum()))
```

**Latihan 20.2 (sedang).** Lengkapi `pertumbuhan(x)` dengan JavaScript murni: untuk larik angka `x`, kembalikan larik persen perubahan dibanding nilai sebelumnya (angka 0 sampai 1), dengan isi pertama `null`.

```slak latihan
function pertumbuhan(x) {
  return []
}

await sl.testing.test("[100, 110, 99]", () => {
  const p = pertumbuhan([100, 110, 99])
  sl.testing.expect(p[0]).toBeNull()
  sl.testing.expect(p[1]).toBeCloseTo(0.1, 6)
  sl.testing.expect(p[2]).toBeCloseTo(-0.1, 6)
})
```

**Latihan 20.3 (tantangan).** Cari bulan dengan omzet tertinggi di setiap tahun. Simpan sebagai objek `puncak`, misalnya `{ 2023: 12, 2024: 12 }`, dengan bulan berupa angka 1–12.

```slak latihan

const puncak = {}   // isi

sl.json(puncak)
await sl.testing.test("ada dua tahun", () => sl.testing.expect(Object.keys(puncak).length).toBe(2))
await sl.testing.test("puncak 2024 benar", () => {
  const b = df.filter(r => r.tanggal.getFullYear() === 2024).resample("tanggal", "M").agg({ omzet: ["total", "sum"] }).to_records()
  const maks = b.reduce((a, r) => r.omzet > a.omzet ? r : a)
  sl.testing.expect(puncak[2024]).toBe(maks.tanggal.getMonth() + 1)
})
```

## Mini-proyek: tren penjualan per cabang

```slak
sl.title("Tren Penjualan Cabang :calendar:")

const df = await sl.read_csv("toko-nusantara.csv")
const cabang = sl.selectbox("Cabang", ["Semua", ...df.cabang.unique().sort()])
const data = cabang === "Semua" ? df : df.filter(r => r.cabang === cabang)

const bulanan = data.resample("tanggal", "M").agg({ omzet: ["total", "sum"] })
const lengkap = bulanan.assign({
  tren: () => bulanan.omzet.rolling(3).mean(),
  yoy: () => bulanan.omzet.pct_change(12)
})

const akhir = lengkap.to_records().at(-1)
const persen = new Intl.NumberFormat("id-ID", { style: "percent", maximumFractionDigits: 1, signDisplay: "always" })
const [a, b] = sl.columns(2)
a.metric("Omzet Desember 2024", akhir.omzet, akhir.yoy != null ? persen.format(akhir.yoy) + " YoY" : null, { format: "rp" })
const tahunan = data.assign({ th: () => data.tanggal.dt.year }).groupby("th").agg({ omzet: ["total", "sum"] }).to_records()
b.metric("Pertumbuhan 2024", persen.format(tahunan[1].omzet / tahunan[0].omzet - 1))

sl.line_chart(lengkap, { x: "tanggal", y: ["omzet", "tren"], format: "compact" })

const yoy = lengkap.filter(r => r.yoy != null)
const turun = yoy.filter(r => r.yoy < 0).shape[0]
sl.write(`Pada 2024, **${12 - turun} dari 12 bulan** lebih tinggi daripada bulan yang sama di 2023.`)
```

`larik.at(-1)` mengambil isi terakhir larik; lebih ringkas daripada `larik[larik.length - 1]`.

<script type="text/markdown" id="bab-21">
# Bab 21 · SQL di Browser

> **Tujuan belajar**
> - Memahami mengapa analis data wajib bisa SQL.
> - Menulis `SELECT`, `WHERE`, `GROUP BY`, `ORDER BY`, dan `JOIN`.
> - Memakai CTE (`WITH`) dan window function untuk peringkat dan total berjalan.
> - Menulis SQL yang juga jalan di PostgreSQL.
> - Mengolah data besar dan berkas Parquet dengan DuckDB.
> - Menyimpan data di browser dengan `sl.sqlite` dan `sl.db`.
> - Membuat laporan dari SQL dengan `sl.report`.

## 21.1 Mengapa SQL?

**SQL** (*Structured Query Language*) adalah bahasa untuk bertanya kepada database. Hampir setiap lowongan analis data mencantumkan SQL, karena data perusahaan tersimpan di database seperti PostgreSQL, MySQL, atau BigQuery. Kabar baiknya: SQL jauh lebih sederhana daripada JavaScript, dan cara berpikirnya sudah kamu kuasai di Bab 14–18.

| Yang sudah kamu pelajari | Di SQL |
|---|---|
| `select([...])` | `SELECT kolom1, kolom2` |
| `filter(...)` / `query(...)` | `WHERE syarat` |
| `groupby(...).agg(...)` | `GROUP BY ...` dengan `SUM`, `COUNT`, `AVG` |
| `sort_values(...)` | `ORDER BY ... DESC` |
| `head(10)` | `LIMIT 10` |
| `merge(...)` | `JOIN ... ON ...` |

Slak menyertakan **SQLite** sungguhan, database yang sama yang ada di setiap ponsel Android dan iPhone. Mesinnya ada di dalam `slak-sql.js`, sehingga SQL tetap jalan tanpa server dan tanpa internet.

```html
<script src="slak.js"><\/script>
<script src="slak-data.js"><\/script>
<script src="slak-sql.js"><\/script>

## 21.2 Kueri pertama

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const hasil = await sl.sql(`
  SELECT kota, COUNT(*) AS transaksi, SUM(total) AS omzet
  FROM jual
  GROUP BY kota
  ORDER BY omzet DESC
`, { jual: df })
sl.dataframe(hasil, { format: { omzet: "rupiah" } })
```

- Argumen kedua memberi **nama tabel** untuk setiap DataFrame: `{ jual: df }` membuat tabel bernama `jual`.
- Hasilnya DataFrame, jadi bisa langsung ditampilkan, digambar, atau diolah lagi.
- Kueri ditulis di antara backtick supaya boleh beberapa baris.

> **API Slak baru**
> - `await sl.sql(kueri, { nama: df }, { params })` menjalankan SQL atas DataFrame atau larik objek. Butuh `slak-sql.js`.

### Bagian-bagian SELECT

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const hasil = await sl.sql(`
  SELECT produk,
         SUM(jumlah)           AS terjual,
         SUM(total)            AS omzet,
         ROUND(AVG(total), 0)  AS rata_transaksi
  FROM jual
  WHERE kategori = 'Minuman'
    AND tanggal >= '2024-01-01'
  GROUP BY produk
  HAVING SUM(jumlah) > 50
  ORDER BY omzet DESC
`, { jual: df })
sl.dataframe(hasil)
```

Urutan **penulisan**: `SELECT` → `FROM` → `WHERE` → `GROUP BY` → `HAVING` → `ORDER BY` → `LIMIT`.

Urutan **pengerjaannya** berbeda: ambil tabel (`FROM`), saring baris (`WHERE`), kelompokkan (`GROUP BY`), saring kelompok (`HAVING`), pilih kolom (`SELECT`), lalu urutkan (`ORDER BY`). Karena itu `WHERE` tidak bisa memakai hasil `SUM`; untuk menyaring hasil ringkasan, pakai `HAVING`.

Teks di SQL diapit **tanda kutip tunggal**: `'Minuman'`. Tanggal dikirim ke SQLite sebagai teks `YYYY-MM-DD`, sehingga perbandingan `tanggal >= '2024-01-01'` langsung bekerja.

## 21.3 Parameter dari widget

Jangan pernah menyambung isian pengguna langsung ke teks SQL. Pakai **parameter**:

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const kota = sl.selectbox("Kota", df.kota.unique().sort())
const hasil = await sl.sql(
  "SELECT kategori, SUM(total) AS omzet FROM jual WHERE kota = :kota GROUP BY kategori ORDER BY omzet DESC",
  { jual: df }, { params: { kota } })
sl.bar_chart(hasil, { x: "kategori", y: "omzet", format: "compact" })
```

`:kota` di kueri diisi dari `params`. Parameter mencegah kesalahan kutip (misalnya nama "Jum'at") dan serangan yang disebut *SQL injection*. Kebiasaan ini wajib di tempat kerja.

## 21.4 JOIN

```slak
const [trx, produk] = await Promise.all([sl.read_csv("toko-nusantara.csv"), sl.read_csv("produk.csv")])
const hasil = await sl.sql(`
  SELECT p.pemasok,
         SUM(t.total)                          AS omzet,
         SUM(t.total - t.jumlah * p.harga_pokok) AS laba
  FROM jual AS t
  LEFT JOIN produk AS p ON p.produk = t.produk
  GROUP BY p.pemasok
  ORDER BY laba DESC
`, { jual: trx, produk })
sl.dataframe(hasil, { format: { omzet: "rupiah", laba: "rupiah" } })
```

Hasilnya sama dengan `merge` di Bab 18.3. `AS t` dan `AS p` memberi nama pendek (alias) untuk tabel, supaya kolom bisa ditulis `t.total` dan `p.harga_pokok` tanpa tertukar.

## 21.5 CTE dan window function

**CTE** (*Common Table Expression*) memecah kueri panjang menjadi langkah-langkah bernama dengan `WITH`. Mirip menyimpan hasil antara di variabel.

**Window function** menghitung sesuatu **di sekitar setiap baris** tanpa meringkasnya menjadi satu: peringkat, total berjalan, nilai bulan sebelumnya.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const hasil = await sl.sql(`
  WITH bulanan AS (
    SELECT to_char(tanggal, 'YYYY-MM') AS bulan, kota, SUM(total) AS omzet
    FROM jual
    GROUP BY 1, 2
  )
  SELECT bulan, kota, omzet,
         RANK() OVER (PARTITION BY bulan ORDER BY omzet DESC)           AS peringkat,
         omzet - LAG(omzet) OVER (PARTITION BY kota ORDER BY bulan)       AS selisih,
         SUM(omzet) OVER (PARTITION BY kota ORDER BY bulan)               AS kumulatif
  FROM bulanan
  WHERE kota IN ('Jayapura', 'Sorong')
  ORDER BY kota, bulan
`, { jual: df })
sl.dataframe(hasil.head(8), { format: { omzet: "rupiah", selisih: "rupiah", kumulatif: "rupiah" } })
```

| Fungsi jendela | Arti |
|---|---|
| `RANK() OVER (PARTITION BY a ORDER BY b DESC)` | Peringkat `b` di dalam setiap kelompok `a` |
| `LAG(x) OVER (PARTITION BY a ORDER BY t)` | Nilai `x` pada baris sebelumnya di kelompok yang sama |
| `SUM(x) OVER (PARTITION BY a ORDER BY t)` | Total berjalan |
| `ROW_NUMBER()`, `LEAD(x)`, `AVG(x) OVER (...)` | Nomor urut, nilai sesudahnya, rata-rata bergerak |

`PARTITION BY` membagi baris ke dalam jendela-jendela (mirip `groupby`), dan `ORDER BY` di dalam `OVER` menentukan urutan di setiap jendela.

## 21.6 SQL yang juga jalan di PostgreSQL

Setiap database punya logat SQL sendiri. Kueri di bab ini sengaja ditulis dengan gaya yang jalan di **SQLite dan PostgreSQL** sekaligus, karena PostgreSQL paling sering dipakai di tempat kerja.

| Hindari (khusus SQLite) | Pakai (jalan di keduanya) |
|---|---|
| `strftime('%Y-%m', tanggal)` | `to_char(tanggal, 'YYYY-MM')` |
| `strftime('%Y', tanggal)` | `EXTRACT(YEAR FROM tanggal)` |
| | `date_trunc('month', tanggal)` |
| `IFNULL(x, 0)` | `COALESCE(x, 0)` |
| `GROUP_CONCAT(x)` | `string_agg(x, ', ')` |

Slak bisa memeriksanya untukmu:

```slak
sl.dataframe(sl.sql.check("SELECT strftime('%Y', tanggal), IFNULL(kanal, '-') FROM jual"))
```

> **API Slak baru**
> - `sl.sql.check(kueri)` mendaftar sintaks khusus SQLite beserta penggantinya yang portabel.
> - Opsi `{ portable: true }` pada `sl.sql` memberi peringatan langsung saat kueri memakai sintaks khusus SQLite.

## 21.7 Data besar dengan DuckDB

SQLite cocok untuk data harian. Untuk ratusan ribu sampai jutaan baris, atau berkas **Parquet**, Slak menyediakan **DuckDB**, database analitik yang dirancang untuk meringkas data besar dengan cepat. DuckDB ada di berkas tambahan:

```html
<script src="slak.js"><\/script>
<script src="slak-data.js"><\/script>
<script src="slak-duckdb.js"><\/script>
```

> **Butuh internet:** mesin DuckDB (sekitar 35 MB) diunduh sekali saat pertama dipakai, lalu disimpan browser. Di Slak Studio, DuckDB tersedia tanpa internet. Playground tidak memuat `slak-duckdb.js`, jadi contoh DuckDB dijalankan di halaman buku ini atau di Slak Studio.

```slak
if (sl.button("Rangkum 250 ribu transaksi dengan DuckDB")) {
  const t0 = performance.now()
  const hasil = await sl.spinner("DuckDB bekerja…", () => sl.duckdb(`
    SELECT kanal, EXTRACT(YEAR FROM CAST(tanggal AS DATE)) AS tahun,
           COUNT(*) AS transaksi, SUM(total) AS omzet
    FROM 'toko-nusantara-besar.csv'
    GROUP BY 1, 2
    ORDER BY 2, 1
  `))
  sl.success(`Selesai dalam ${((performance.now() - t0) / 1000).toFixed(1)} detik`)
  sl.dataframe(hasil, { format: { omzet: "compact" } })
}
```

DuckDB bisa membaca berkas CSV dan Parquet langsung dari kueri, cukup dengan menyebut namanya dalam tanda kutip tunggal. Berkasnya tidak perlu dimuat ke DataFrame lebih dulu, sehingga data yang terlalu besar untuk Slak Data pun masih bisa diringkas.

DuckDB juga menerima DataFrame, sama seperti `sl.sql`:

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const r = await sl.duckdb("SELECT kota, SUM(total) AS omzet FROM jual GROUP BY kota ORDER BY omzet DESC LIMIT 5", { jual: df })
sl.dataframe(r)
```

### Parquet

**Parquet** menyimpan data per kolom dan terkompresi, biasanya 5 sampai 10 kali lebih kecil daripada CSV dan jauh lebih cepat dibaca. Banyak dataset terbuka kini tersedia dalam Parquet.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
const pq = await sl.duckdb.to_file("SELECT * FROM jual", "toko-nusantara.parquet", { jual: df })
sl.download_button("Unduh sebagai Parquet", pq, { file_name: "toko-nusantara.parquet" })
```

Berkas Parquet dibaca kembali dengan `await sl.read_parquet("toko-nusantara.parquet")`.

> **API Slak baru** (dari `slak-duckdb.js`)
> - `await sl.duckdb(kueri, { nama: df })` menjalankan SQL dengan DuckDB.
> - `await sl.read_parquet(nama)` membaca berkas Parquet menjadi DataFrame.
> - `await sl.duckdb.to_file(kueri, namaBerkas, tabel)` menyimpan hasil kueri sebagai Parquet untuk diunduh.

### Kapan SQLite, kapan DuckDB?

| | `sl.sql` / `sl.sqlite` (SQLite) | `sl.duckdb` (DuckDB) |
|---|---|---|
| Cocok untuk | Data kecil sampai menengah, tabel yang sering diubah | Analisis data besar, berkas Parquet |
| Tanpa internet | Selalu | Di Slak Studio; di halaman lain diunduh sekali |
| Gaya SQL | SQLite ditambah sebagian gaya PostgreSQL | Sangat mirip PostgreSQL |

Aturan sederhananya: **mulai dengan SQLite.** Pindah ke DuckDB bila data lebih dari sekitar 500 ribu baris, bila kamu memakai Parquet, atau bila ringkasan terasa lambat.

## 21.8 Menyimpan data di browser

Sejauh ini SQL hanya membaca DataFrame. Untuk data yang ditambah dan diubah pengguna, misalnya catatan stok, simpan di database yang tinggal di browser.

**SQLite yang tersimpan:**

```slak
const db = await sl.sqlite({ name: "stok-toko" })
db.query("CREATE TABLE IF NOT EXISTS stok (produk TEXT PRIMARY KEY, jumlah INTEGER)")

const f = sl.form("tambah-stok", { clear_on_submit: true })
const produk = f.text_input("Produk")
const jumlah = f.number_input("Jumlah", { min: 0, value: 1 })
if (f.form_submit_button("Simpan") && produk) {
  db.query("INSERT INTO stok (produk, jumlah) VALUES (?, ?) ON CONFLICT(produk) DO UPDATE SET jumlah = excluded.jumlah", [produk, jumlah])
}
sl.dataframe(db.query("SELECT * FROM stok ORDER BY produk"))
```

**IndexedDB lewat `sl.db`**, tanpa SQL sama sekali:

```slak
const db = sl.db("buku-kunjungan", { kunjungan: "++id, kota" })
if (sl.button("Catat kunjungan dari Ambon")) await db.kunjungan.insert({ kota: "Ambon", waktu: new Date().toISOString() })
sl.metric("Kunjungan dari Ambon", await db.kunjungan.where("kota").equals("Ambon").count())
sl.write(await sl.db_list())

> **API Slak baru**
> - `await sl.sqlite({ name })` membuka database SQLite yang tersimpan permanen di browser. `db.query(sql, params)` menjalankan SQL; `SELECT` mengembalikan DataFrame.
> - `sl.db(nama, skema)` membuka database IndexedDB dengan tabel dan perintah `insert`, `update`, `delete`, `where`, `all`, `count`.

`sl.report` menulis laporan dalam Markdown dengan blok SQL di dalamnya. Blok SQL dijalankan lebih dulu, lalu hasilnya disisipkan ke teks atau digambar sebagai grafik.

```slak
const df = await sl.read_csv("toko-nusantara.csv")
await sl.report(`
# Laporan Singkat Toko Nusantara

Selama 2023–2024, omzet mencapai **{{ ringkas.omzet | rp }}** dari {{ ringkas.transaksi }} transaksi.
Cabang teratas adalah **{{ teratas.kota }}**.

\`\`\`sql name=ringkas hide
SELECT SUM(total) AS omzet, COUNT(*) AS transaksi FROM jual
\`\`\`

\`\`\`sql name=teratas hide
SELECT kota FROM jual GROUP BY kota ORDER BY SUM(total) DESC LIMIT 1
\`\`\`

\`\`\`sql chart=bar x=kota y=omzet format=rp title="Omzet per kota"

| Opsi blok `sql` | Fungsi |
|---|---|
| `name=nama` | Memberi nama hasil, supaya bisa dipakai di teks dengan `{{ nama.kolom }}` |
| `hide` | Tidak menampilkan tabelnya |
| `chart=bar` (`line`, `area`, `scatter`, `pie`) | Menggambar grafik |
| `x=`, `y=`, `format=`, `title=` | Opsi grafik |

Di dalam teks, `{{ nama.kolom | rp }}` diisi nilai baris pertama hasil kueri `nama`, dengan format `rp`, `persen`, angka desimal `0`–`9`, atau `tanggal`.

> **API Slak baru**
> - `await sl.report(teks, { tables, db, params })` membuat laporan dari Markdown dan SQL.

## Kesalahan umum

| Gejala | Penyebab | Perbaikan |
|---|---|---|
| `no such column: Minuman` | Teks ditulis dengan kutip ganda | Teks memakai kutip tunggal: `'Minuman'` |
| `misuse of aggregate` | Memakai `SUM` di `WHERE` | Pindahkan ke `HAVING` |
| `no such table` | Nama tabel di kueri tidak sama dengan kunci objek kedua | `FROM jual` butuh `{ jual: df }` |
| Kueri lambat pada tabel lebar | `SELECT *` memuat semua kolom | Sebutkan kolom yang dibutuhkan saja |
| `sl.duckdb is not a function` | `slak-duckdb.js` belum dimuat | Tambahkan `<script src="slak-duckdb.js">` |
